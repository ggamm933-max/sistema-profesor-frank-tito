<script>
const seed = {
 users:[
  {u:"profesor",p:"1234",role:"teacher",name:"Prof. Frank Carlos Tito Chávez"}
 ],
 materials:[],
 activities:[],
 submissions:[],
 messages:[],
 courses:[{id:1,name:"Educación para el Trabajo",area:"EPT",description:"Computación e Informática"}],
 units:[],
 sessions:[],
 attendance:{},
    classRecoveries:[],
  classEvidence:[],
 incidents:[],
 announcements:[]
};
let db=JSON.parse(localStorage.getItem("aulaEPT")||JSON.stringify(seed));
let me=null, page="home";
function save(){
  localStorage.setItem("aulaEPT",JSON.stringify(db));
  if(typeof saveToFirebase === "function") saveToFirebase();
}

/* ===== SINCRONIZACIÓN FIREBASE ===== */
const FIREBASE_DOCUMENT = "aulaEPT/main";

async function saveToFirebase(){
  try{
    if(!window.firebaseReady) return;
    await window.firebaseSetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
      { data: db, updatedAt: Date.now() }
    );
  }catch(error){
    console.error("Firebase: no se pudo guardar", error);
  }
}

async function loadFromFirebase(){
  try{
    if(!window.firebaseReady) return false;
    const snap = await window.firebaseGetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main")
    );
    if(snap.exists() && snap.data().data){
      db = snap.data().data;
      localStorage.setItem("aulaEPT", JSON.stringify(db));
      if(typeof render === "function") render();
      return true;
    }
  }catch(error){
    console.error("Firebase: no se pudo cargar", error);
  }
  return false;
}

let firebaseUnsubscribe=null;

function startFirebaseSync(){
  if(!window.firebaseReady) return;
  try{
    if(typeof firebaseUnsubscribe === "function") firebaseUnsubscribe();
    firebaseUnsubscribe=window.firebaseOnSnapshot(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
      (snap)=>{
        if(snap.exists() && snap.data().data){
          db=snap.data().data;
          localStorage.setItem("aulaEPT",JSON.stringify(db));
          // Si hay un chat abierto, actualiza SOLO la lista de mensajes.
          // No reconstruimos el cuadro de texto porque eso hacía que el cursor
          // saltara, el modal se moviera y el usuario perdiera la posición al escribir.
          if(window.__openChat22 && typeof refreshOpenChat22 === "function" && me){
            refreshOpenChat22();
          }else if(typeof render === "function" && me){
            // IMPORTANTE: mientras el docente está calificando en Registro de clase
            // NO reconstruir toda la pantalla por cada sincronización de Firebase.
            // El redibujado reemplaza los <select> y <input>, haciendo que el
            // filtro Grado/Sección parezca bloqueado y provocando pérdida de foco.
            // Guardamos el filtro actual y dejamos intacta la pantalla de evaluación.
            if(page === 'registro'){
              const cg=document.getElementById('ceGrade30')?.value;
              const cs=document.getElementById('ceSec30')?.value;
              if(cg!==undefined) window._classGradeFilter30=cg;
              if(cs!==undefined) window._classSectionFilter30=cs;
              return;
            }
            // En Asistencia no reconstruimos toda la página al guardar.
            // El render completo elimina temporalmente la tabla y desplaza la vista
            // hasta el panel de alertas. Solo actualizamos la tabla de estudiantes.
            if(page === 'attendance'){
              if(typeof renderAttendanceTable25 === 'function') renderAttendanceTable25();
              return;
            }
            // En Crea y Emprende no reconstruimos la tabla mientras el docente
            // está escribiendo en Proyecto/Detalle. La sincronización Firebase
            // puede devolver nuestro propio guardado y, si se ejecuta render(),
            // el <input> se reemplaza y se pierde el foco cada pocos caracteres.
            if(page === 'creaEmprende'){
              const active=document.activeElement;
              const editingCY=active && (
                String(active.id||'').startsWith('cyProject_') ||
                String(active.id||'').startsWith('cyDetail_')
              );
              if(editingCY) return;
            }
            render();
          }
        }
      },
      (error)=>console.error("Firebase: error de sincronización",error)
    );
  }catch(error){
    console.error("Firebase: no se pudo iniciar la sincronización",error);
  }
}

window.addEventListener("firebase-ready", async ()=>{
  const exists = await loadFromFirebase();
  if(!exists) await saveToFirebase();
  startFirebaseSync();
});

function refreshDB29(){
 try{
  const raw=localStorage.getItem("aulaEPT");
  if(raw){
   const fresh=JSON.parse(raw);
   if(fresh && typeof fresh==="object"){db=fresh; if(me&&db.users){const updated=db.users.find(u=>u.u===me.u); if(updated)me=updated;}}
  }
 }catch(e){}
}

 if(u && u.role==="student" && u.p==null && u.pw!=null){u.p=u.pw;delete u.pw;save();}
 return u;
}
function login(){
 const u=username.value.trim(), p=password.value;

 if(!x){alert("Usuario o contraseña incorrectos.");return}
 me=x; localStorage.setItem("session",x.u); start();

function start(){
 document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
 currentUser.textContent=me.name; buildNav(); render();
 if(me?.role==='teacher' && typeof teacherReminderScheduler26==='function') teacherReminderScheduler26();

/* ===== CIERRE DE BIMESTRES ===== */
function getBimesterClose30(){
  if(!db.bimesterClose)db.bimesterClose={
    I:{enabled:false,date:'',closed:false,converted:0},
    II:{enabled:false,date:'',closed:false,converted:0},
    III:{enabled:false,date:'2026-10-09',closed:false,converted:0,start:'2026-08-10',end:'2026-10-09'},
    IV:{enabled:false,date:'',closed:false,converted:0,start:'2026-10-19',end:'2026-12-18'}
  };
  if(db.bimesterClose.III){
    if(!db.bimesterClose.III.start)db.bimesterClose.III.start='2026-08-10';
    if(!db.bimesterClose.III.end)db.bimesterClose.III.end='2026-10-09';
    if(!db.bimesterClose.III.date)db.bimesterClose.III.date='2026-10-09';
  }
  if(db.bimesterClose.IV && !db.bimesterClose.III?.closed) db.bimesterClose.IV.enabled=false;
  return db.bimesterClose;
}
function todayLocal30(){
  const d=new Date(),off=d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
function bimesterForDate31(date){
  if(!date)return '';
  const bs=getBimesterClose30(),d=String(date);
  for(const k of ['III','IV']){const b=bs[k];if(b&&b.start&&b.end&&d>=b.start&&d<=b.end)return k;}
  return '';
}
function closedForDate31(date){
  const k=bimesterForDate31(date);
  return !!(k&&getBimesterClose30()[k]?.closed);
}
function blockClosedDate31(date){
  const k=bimesterForDate31(date);
  if(!k||!getBimesterClose30()[k]?.closed)return false;
  alert(`🔒 ${k} Bimestre cerrado.\n\nNo se pueden modificar notas de este período.\n\n🔓 Reabre el bimestre para realizar cambios.`);
  return true;
}
function renderBimesterClose30(){
  const bs=getBimesterClose30();
  const thirdClosed=!!bs.III?.closed;
  const rows=['III','IV'].map(k=>{
    const b=bs[k];
    const lockedIV=(k==='IV' && !thirdClosed);
    const lockedClosed=(k==='III' && b.closed);
    const controlsLocked=lockedIV || lockedClosed;
    const activateDisabled=controlsLocked ? 'disabled' : '';
    const dateDisabled=controlsLocked ? 'disabled' : '';
    const closeDisabled=lockedIV ? 'disabled' : '';
    const lockMsg=lockedIV ? '<div class="muted" style="margin-top:5px">🔒 Se habilita únicamente cuando se cierre el III Bimestre.</div>' : '';
    return `<div class="item" style="margin-top:10px;${lockedIV?'opacity:.65;background:#f3f4f6':''}">
      <div><b>${k} Bimestre</b>${k==='III'?`<div class="muted">📅 Del 10 de agosto al 09 de octubre de 2026</div>`:k==='IV'?`<div class="muted">📅 Del 19 de octubre al 18 de diciembre de 2026</div>`:''}${lockMsg}</div>
      <label style="display:flex;align-items:center;gap:8px;margin:0"><input class="bimEnable30" data-bim="${k}" type="checkbox" ${b.enabled?'checked':''} ${activateDisabled}> Activar</label>
      <input class="bimDate30" data-bim="${k}" type="date" value="${escClass(b.date||'')}" style="max-width:180px" ${dateDisabled}>
      <span class="badge">${b.closed?'🔒 Cerrado':'🟢 Abierto'}</span>
      <button class="small" onclick="closeBimester30('${k}')" ${closeDisabled}>${b.closed?'🔓 Reabrir':'🔒 Cerrar ahora'}</button>
    </div>`;
  }).join('');
  return `<div class="card"><h2>🔒 Cierre de bimestres</h2>
    <p class="muted">Este sistema fue creado para trabajar desde el <b>III Bimestre</b>. Antes del cierre, las actividades pendientes siguen como recuperación pendiente.</p>
    <div class="alert">Al cerrar el bimestre, las recuperaciones que sigan pendientes pasan automáticamente a <b>05</b>. Esto aplica a faltas, faltas justificadas, representación, salud y también a trabajos/evidencias no encontrados o presentados sin nombre. Las recuperaciones realizadas conservan su nota.</div>
    ${rows}
    <div class="actions" style="margin-top:16px"><button onclick="saveBimesterDates30()">💾 Guardar fechas</button><button class="secondary" onclick="checkBimesterClosures30(true)">🔎 Comprobar fechas</button></div>
  </div>`;
}
function saveBimesterDates30(){
  const bs=getBimesterClose30();
  document.querySelectorAll('.bimDate30').forEach(x=>{
    const k=x.dataset.bim;
    if(k==='IV' && !bs.III?.closed)return;

function convertPendingRecoveriesToZero30(bimesterKey){
  let count=0;
  if(!Array.isArray(db.classRecoveries))db.classRecoveries=[];
  const bs=getBimesterClose30(), b=bs[bimesterKey]||{};
  (db.classRecords||[]).forEach(rec=>{
    if(!rec?.date)return;
    if(b.start && rec.date<b.start)return;
    if(b.end && rec.date>b.end)return;
    const sessionEvaluated=(db.classEvaluations||[]).some(x=>String(x.classId)===String(rec.id) && (x.status||x.grade!==null&&x.grade!==undefined&&x.grade!==''));
    (db.users||[]).filter(u=>u.role==='student').forEach(u=>{
      const att=attendanceStatusForDateUser(classAttendanceDate30(rec),u);
      const needsAttendanceRecovery=attendanceNeedsRecovery(att);
      const evidence=getEvidence30(rec.id,u.u);
      const evidenceProblem=!!evidence && ['no_encontrada','sin_nombre'].includes(evidence.status);
      // Una evidencia automática solo puede convertirse en recuperación si la sesión
      // realmente tuvo al menos una evaluación. Así una sesión simplemente abierta
      // pero todavía no evaluada nunca genera un 05 al cierre.
      const needsWorkRecovery=evidenceProblem && (evidence.automatic!==true || sessionEvaluated) && (att==='Presente'||att==='Tardanza');
      if(!needsAttendanceRecovery && !needsWorkRecovery)return;
      let r=getRecovery30(rec.id,u.u);
      if(r?.grade!==null && r?.grade!==undefined && r?.grade!=='')return;
      const reasonType=needsWorkRecovery?'no_trabajo':'inasistencia';
      const baseObs=needsWorkRecovery
        ? 'No recuperó el trabajo/evidencia no encontrado(a) al cierre del bimestre'
        : 'No recuperó al cierre del bimestre';
      if(!r){
        r={id:'rec_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),classId:rec.id,user:u.u,date:rec.date,title:rec.title,method:'not_recovered',observation:baseObs,grade:5,automaticClose05:true,bimester:bimesterKey,reasonType,automaticEvidenceRecovery:needsWorkRecovery,createdAt:Date.now(),updatedAt:Date.now()};
        db.classRecoveries.push(r);
      }else{
        r.grade=5;
        r.method='not_recovered';
        r.observation=needsWorkRecovery?baseObs:'No recuperó al cierre del bimestre: 05 automático';
        r.automaticClose05=true;
        r.bimester=bimesterKey;
        r.reasonType=reasonType;
        r.automaticEvidenceRecovery=needsWorkRecovery;
        r.updatedAt=Date.now();
      }
      count++;
    });
  });
  return count;
}

function convertPendingExpositionTo05_31(bimesterKey){
  ensureClassData();
  if(!db.expositionRubric||!Array.isArray(db.expositionRubric.scores)) return 0;
  if(!Array.isArray(db.expositionRubric.criteria)) return 0;
  const criteria=db.expositionRubric.criteria;
  const scores=db.expositionRubric.scores;
  const students=db.users||[];
  const groups=db.groups||[];
  const bs=getBimesterClose30(), b=bs[bimesterKey];
  if(!b?.start||!b?.end) return 0;
  let count=0;
  const batches=new Map();
  // Solo consideramos exposiciones que realmente tienen al menos una nota
  // registrada. Una sesión sin ninguna evaluación NO se convierte en 05.
  scores.forEach(sc=>{
    if(!sc || sc.score===undefined || sc.score===null || sc.score==='') return;
    const st=students.find(u=>u.u===sc.user);
    if(!st || studentIsRetired32(st.u)) return;
    const date=String(sc.date||'');
    if(!date || date<b.start || date>b.end) return;
    const grade=sc.grade||st.grade||'', section=sc.section||st.section||'';
    const sessionId=sc.sessionId||'';
    const week=Number(sc.week||0);
    const groupId=sc.groupId||'';
    const key=[sessionId,date,grade,section,week,groupId].join('|');
    if(!batches.has(key)) batches.set(key,{date,grade,section,sessionId,week,groupId});
  });
  batches.forEach(batch=>{
    const group=groups.find(g=>String(g.id)===String(batch.groupId));
    if(!group || !Array.isArray(group.members) || !group.members.length) return;
    const session=batch.sessionId ? students.length && (db.sessions||[]).find(s=>String(s.id)===String(batch.sessionId)) : null;
    group.members.forEach(user=>{
      const st=students.find(u=>u.u===user);
      if(!st || studentIsRetired32(st.u)) return;
      // Solo integrantes que pertenecen al grado/sección de esta exposición.
      if(batch.grade && st.grade!==batch.grade) return;
      if(batch.section && st.section!==batch.section) return;
      criteria.forEach(c=>{
        const exists=scores.some(x=>x.user===user && x.criterionId===c.id &&
          ((batch.sessionId && String(x.sessionId||'')===String(batch.sessionId)) ||
           (!batch.sessionId && Number(x.week||0)===batch.week && String(x.date||'')===String(batch.date))) &&
          String(x.groupId||'')===String(batch.groupId||''));
        if(exists) return;
        scores.push({
          id:'ex_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
          user,week:batch.week,criterionId:c.id,score:5,date:batch.date,
          grade:st.grade||batch.grade||'',section:st.section||batch.section||'',
          category:categoryForStudent(st),groupId:batch.groupId,groupName:group.name,
          sessionId:batch.sessionId||'',sessionNumber:session?.number||'',sessionTitle:session?.title||'',
          automaticClose05:true,bimester:bimesterKey,savedAt:Date.now()
        });
        count++;
      });
    });
  });
  return count;
}
function removeAutomaticExposition05_31(bimesterKey){
  if(!db.expositionRubric||!Array.isArray(db.expositionRubric.scores)) return 0;
  const before=db.expositionRubric.scores.length;
  db.expositionRubric.scores=db.expositionRubric.scores.filter(sc=>!(sc&&sc.automaticClose05===true&&sc.bimester===bimesterKey));
  return before-db.expositionRubric.scores.length;
}

function saveBimesterFinalSnapshot31(k){
  ensureClassData();
  if(!db.bimesterFinals||typeof db.bimesterFinals!=='object')db.bimesterFinals={};
  const snap={};
  (db.users||[]).filter(u=>u.role==='student').forEach(u=>{
    const d=evaluationDetail(u.u);
    let project=d.project;
    let process=d.process;
    let final=d.final;
    let level=d.level;
    let automaticProject05=false;
    let automaticProcess05=false;
    let automaticProjectComponents=[];
    let portfolio=null, product=null, exposition=null;

    if(!studentIsRetired31(u) && u.creaRecovery!==true){
      // Al cerrar el bimestre, cada evidencia faltante del Proyecto recibe 05.
      // Así, si falta solo Portafolio pero existen Producto y Exposición,
      // se calcula (05 + Producto + Exposición) / 3, en lugar de omitir el faltante.
      const p=projectRecord(u.u);
      portfolio=(p.portfolio===null||p.portfolio===undefined)?5:Number(p.portfolio);
      product=(p.product===null||p.product===undefined)?5:Number(p.product);
      exposition=(p.exposition===null||p.exposition===undefined)?5:Number(p.exposition);
      if(p.portfolio===null||p.portfolio===undefined){automaticProject05=true;automaticProjectComponents.push('Portafolio');}
      if(p.product===null||p.product===undefined){automaticProject05=true;automaticProjectComponents.push('Producto');}
      if(p.exposition===null||p.exposition===undefined){automaticProject05=true;automaticProjectComponents.push('Exposición');}
      project=avgNums([portfolio,product,exposition]);

      if(process===null){
        process=5;
        automaticProcess05=true;
      }
      if(project!==null && process!==null){
        final=project*.70+process*.30;
        level=classLevel(final);
      }
    }
    snap[u.u]={project,process,final,level,savedAt:Date.now(),automaticProject05,automaticProjectComponents,automaticProcess05,
      projectComponents:{portfolio,product,exposition}};
  });
  db.bimesterFinals[k]=snap;
}
function clearBimesterFinalSnapshot31(k){
  if(db.bimesterFinals&&typeof db.bimesterFinals==='object')delete db.bimesterFinals[k];
}
function closeBimester30(k){
  const bs=getBimesterClose30(),b=bs[k];
  if(!b)return;
  if(b.closed){
    if(confirm(`¿Reabrir el ${k} Bimestre? Se eliminarán únicamente los 05 colocados automáticamente por este cierre. Las demás notas no se modificarán.`)){
      const before=(db.classRecoveries||[]).length;
      db.classRecoveries=(db.classRecoveries||[]).filter(r=>!(r && r.automaticClose05===true && r.bimester===k));
      const removed=before-db.classRecoveries.length;
      const removedExpo=removeAutomaticExposition05_31(k);
      clearBimesterFinalSnapshot31(k);
      b.closed=false;b.converted=0;save();alert(`🔓 ${k} Bimestre reabierto.\n\n${removed} 05 automático(s) generado(s) por este cierre eliminado(s).\nLas notas manuales y de recuperación se conservaron.\n\n📊 La evaluación final vuelve a estar disponible para modificar.`);render();
    }
    return;
  }
  if(!b.date){alert('Primero coloca la fecha de cierre.');return;}
  if(!confirm(`¿Cerrar el ${k} Bimestre ahora?

Las recuperaciones pendientes se convertirán automáticamente en 05. En el Proyecto, cada evidencia que siga pendiente (Portafolio, Producto o Exposición) recibirá 05 únicamente para el cierre y se calculará el Proyecto con las tres evidencias.

La evaluación final quedará registrada.`))return;
  const n=convertPendingRecoveriesToZero30(k);
  const nExpo=convertPendingExpositionTo05_31(k);
  saveBimesterFinalSnapshot31(k);
  b.closed=true;b.closedAt=new Date().toISOString();b.converted=n;
  if(k==='III'){
    bs.IV.enabled=true;
  }
  save();alert(`🔒 ${k} Bimestre cerrado.\n\n${n} pendiente(s) convertida(s) a 05.\n\n📊 La evaluación final fue registrada automáticamente para este cierre.${k==='III'?'\n\n🟢 IV Bimestre habilitado. Coloca su fecha de cierre manualmente.':''}`);render();
}
function checkBimesterClosures30(show){
  const bs=getBimesterClose30(),today=todayLocal30(),done=[];
  ['III','IV'].forEach(k=>{
    const b=bs[k];
    if(b.enabled&&b.date&&!b.closed&&today>=b.date){
      const n=convertPendingRecoveriesToZero30(k);
      const nExpo=convertPendingExpositionTo05_31(k);
      b.closed=true;b.closedAt=new Date().toISOString();b.converted=n;
      if(k==='III') bs.IV.enabled=true;
      done.push(`${k} Bimestre: ${n} recuperación(es) + ${nExpo} nota(s) de exposición → 05`);
    }
  });
  if(done.length){save();if(show)alert('🔒 Cierre procesado:\n\n'+done.join('\n'));}
  return done;
}

function importStudents(){
 const raw=document.getElementById("importData").value.trim(); if(!raw){alert("Pega primero los datos de Excel.");return}
 let added=0,updated=0,skipped=0;
 raw.split(/\r?\n/).filter(x=>x.trim()).forEach((line,i)=>{
  const c=line.split(/\t/).map(x=>x.trim()); if(c.length<5){skipped++;return}
  let [name,user,pass,grade,section]=c;
  if(i===0 && /apellidos/i.test(name))return;
  grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º");section=section.toUpperCase();
  if(!name||!user||!pass||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
  const ex=db.users.find(x=>x.u===user);
  if(ex&&ex.role==="student"){ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++}
  else if(!ex){db.users.push({id:Date.now()+Math.random(),u:user,p:pass,role:"student",name,grade,section});added++}
  else skipped++;
 });
 save();closeModal();render();alert(`Importación terminada.\n\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
}

 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="Estudiantes_Aula_EPT_2026.csv";a.click();URL.revokeObjectURL(a.href);
}

function fmtGradeDetail30(v){
  return (v===null||v===undefined||v===""||!Number.isFinite(Number(v))) ? "—" : Number(v).toFixed(2);
}

function getStudentClassDetail30(u){
  ensureClassData();
  const records=Array.isArray(db.classRecords)?db.classRecords:[];
  const evals=Array.isArray(db.classEvaluations)?db.classEvaluations:[];
  const recovs=Array.isArray(db.classRecoveries)?db.classRecoveries:[];
  const result=[];
  const seen=new Set();

  // Exactamente la misma prioridad que classAvg():
  // 1) evaluación de Registro de clase; 2) recuperación; 3) evaluaciones huérfanas.
  records.filter(r=>r&&r.id).forEach(r=>{
    const ev=evals.find(x=>String(x.classId)===String(r.id)&&x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!=="");
    if(ev){
      const n=Number(ev.grade);
      if(Number.isFinite(n)){
        result.push({date:r.date||ev.date||"",title:r.title||ev.title||"Registro de clase",session:r.sessionNumber||"",note:n,source:"Registro de clase"});
        seen.add(String(r.id));
      }
      return;
    }
    const rr=recovs.find(x=>String(x.classId)===String(r.id)&&x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!=="");
    if(rr){
      const n=Number(rr.grade);
      if(Number.isFinite(n)){
        result.push({date:r.date||rr.date||"",title:r.title||rr.title||"Recuperación",session:r.sessionNumber||"",note:n,source:"Recuperación"});
        seen.add(String(r.id));
      }
    }
  });

  evals.filter(x=>x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!==""&&!seen.has(String(x.classId)))
    .forEach(x=>{
      const n=Number(x.grade);
      if(Number.isFinite(n)) result.push({date:x.date||"",title:x.title||"Evaluación",session:x.sessionNumber||"",note:n,source:"Evaluación"});
    });

  return result;
}

function saveStudentFixed(oldUser){
 const name=document.getElementById("sn").value.trim(), user=document.getElementById("su").value.trim(), pass=document.getElementById("sp").value.trim();
 const grade=document.getElementById("sg").value, section=document.getElementById("ss").value;
 if(!name||!user||!pass){alert("Completa todos los campos.");return}
 if(oldUser){
   const u=db.users.find(x=>x.u===oldUser);
   if(u){u.name=name;u.p=pass;u.grade=grade;u.section=section;}

function makeUsername(name){
 let base=name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
   .replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"");
 if(!base) base="estudiante";
 let u=base, n=2;
 while(db.users.some(x=>x.u===u)){u=base+"."+n;n++;}
 return u;
}
function importStudents(){
 const raw=document.getElementById("importData").value.trim();
 if(!raw){alert("Pega primero los datos.");return}
 const defaultGrade=document.getElementById("importGrade").value;
 const defaultSection=document.getElementById("importSection").value;
 let added=0,updated=0,skipped=0;
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 lines.forEach((line,i)=>{
   if(i===0 && /apellidos\s+y\s+nombres/i.test(line)) return;
   let c=line.split(/\t/).map(x=>x.trim()).filter((x,j)=>j<5);
   let name="",user="",pass="1234",grade=defaultGrade,section=defaultSection;
   if(c.length>=5){
      [name,user,pass,grade,section]=c;
      grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º");
      section=section.toUpperCase();
   }else if(c.length===1){
      name=c[0];
      user=makeUsername(name);
   }else if(c.length===2){
      name=c[0];
      if(["A","B"].includes(c[1].toUpperCase())) section=c[1].toUpperCase();
      else if(["1.º","2.º","3.º","4.º","5.º"].includes(c[1])) grade=c[1];
      user=makeUsername(name);
   }else{
      skipped++;return;
   }
   if(!name||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
   if(!user)user=makeUsername(name);
   if(!pass)pass="1234";
   const ex=db.users.find(x=>x.u===user);
   if(ex&&ex.role==="student"){
      ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++;
   }else if(!ex){
      db.users.push({id:Date.now()+Math.random(),u:user,p:pass,role:"student",name:name,grade:grade,section:section});
      added++;
   }else skipped++;
 });
 save();closeModal();render();
 alert(`Importación terminada.\\n\\nAgregados: ${added}\\nActualizados: ${updated}\\nOmitidos: ${skipped}\\n\\nContraseña inicial: 1234`);
}

function sessionGroups26(x){
  if(Array.isArray(x?.groups) && x.groups.length) return x.groups;
  const g=String(x?.grade||"");
  if(g==="1.º-2.º") return ["1.º A","1.º B","2.º A"];
  if(g==="3.º-5.º") return ["3.º A","3.º B","4.º A","4.º B","5.º A","5.º B"];
  return [];
}
function nextSessionNumber26(unitId, groups){
  const ss=(db.sessions||[]).filter(s=>s.unit===unitId);
  const nums=ss.filter(s=>sessionGroups26(s).some(g=>groups.includes(g))).map(s=>Number(s.number)||0);
  return Math.max(0,...nums)+1;
}

function youtubeEmbed(url){
 try{
   const u=new URL(url);
   let id="";
   if(u.hostname.includes("youtu.be")) id=u.pathname.slice(1);
   else if(u.searchParams.get("v")) id=u.searchParams.get("v");
   else {
     const m=u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
     if(m)id=m[2];
   }
   return id?`https://www.youtube.com/embed/${id}`:null;
 }catch(e){return null}
}
function openMaterial(id){

 const url=m.url||m.link||"";
 const desc=m.description||m.desc||"";
 let body="";
 const yt=youtubeEmbed(url);
 if(yt){
   body=`<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin:15px 0">
    <iframe src="${yt}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe>
   </div>`;
 }else if(url && /\\.pdf($|[?#])/i.test(url)){
   body=`<iframe src="${url}" style="width:100%;height:520px;border:1px solid #ddd;border-radius:10px"></iframe>`;
 }else if(url){
   body=`<p><a href="${url}" target="_blank" rel="noopener"><button>🔗 Abrir recurso</button></a></p>`;
 }else{
   body=`<p class="muted">Este material todavía no tiene un enlace.</p>`;
 }
 modalBody.innerHTML=`<h2>${m.title}</h2><span class="badge">${m.type||"Recurso"}</span>
 <p>${desc}</p>${body}<button class="secondary" onclick="closeModal()">Cerrar</button>`;

const AULA_FILE_DB="AulaEPT_Files_v1";
let aulaFileDBPromise=null;
function openAulaFileDB(){
 if(aulaFileDBPromise)return aulaFileDBPromise;
 aulaFileDBPromise=new Promise((resolve,reject)=>{
   const r=indexedDB.open(AULA_FILE_DB,1);
   r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files");};
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
 return aulaFileDBPromise;
}
async function saveAulaFile(id,file){
 const db=await openAulaFileDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,id);
   tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function getAulaFile(id){
 const db=await openAulaFileDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("files","readonly"),r=tx.objectStore("files").get(id);
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}

function studentAbsenceCount31(username){return Object.keys(db.attendance||{}).filter(k=>{if(!k.endsWith("|"+username))return false;const st=typeof normalizeAttendanceStatus30==='function'?normalizeAttendanceStatus30(db.attendance[k]):String(db.attendance[k]??'').trim();return st==='Falta';}).length;}
function studentIsRetired31(u){return String(u?.status||'Activo').trim().toLowerCase()==='retirado';}
function studentIsSuspended31(u){return String(u?.status||'Activo').trim().toLowerCase()==='suspension'||String(u?.status||'Activo').trim().toLowerCase()==='suspensión';}
function todayStatusDate31(){
  try{return typeof todayLocal30==='function'?todayLocal30():new Date().toISOString().slice(0,10);}catch(e){return new Date().toISOString().slice(0,10);}
}
function studentStatusForDate31(u,date){
  if(!u)return 'Activo';
  const d=String(date||'').slice(0,10);
  const hist=Array.isArray(u.statusHistory)?u.statusHistory.slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))):[];
  let status='Activo';
  hist.forEach(h=>{if(!h?.date||!d||String(h.date).slice(0,10)<=d) status=h.status||status;});
  if(!hist.length){
    const current=String(u.status||'Activo').trim();
    if(current==='Suspensión'||current==='suspensión'||current==='Retirado') return d && d>=String(u.statusSince||todayStatusDate31()).slice(0,10)?current:'Activo';
    return current||'Activo';
  }
  return status||'Activo';
}
function studentSuspendedOrRetiredOnDate31(u,date){
  const st=String(studentStatusForDate31(u,date)).trim().toLowerCase();
  return st==='suspensión'||st==='suspension'||st==='retirado';
}
function studentForcedDisapproved31(u){return studentIsRetired31(u)||studentIsSuspended31(u);}
function studentDisapprovedByAbsences31(u){return !!(u&&u.role==='student'&&u.attendanceDisapproved===true&&u.attendanceReconsidered!==true);}
function syncStudentAttendanceStatus31(u){if(!u||u.role!=='student')return false;const f=studentAbsenceCount31(u.u);if(f>=5&&!studentIsRetired31(u)&&u.attendanceReconsidered!==true&&!u.attendanceDisapproved){u.attendanceDisapproved=true;return true;}if(f<5&&u.attendanceDisapproved===true&&u.attendanceReconsidered!==true){u.attendanceDisapproved=false;return true;}return false;}
function syncAllStudentAttendanceStatus31(){let c=false;(db.users||[]).forEach(u=>{if(syncStudentAttendanceStatus31(u))c=true;});return c;}
function studentAcademicStatus31(u){const f=studentAbsenceCount31(u?.u);if(studentIsSuspended31(u))return 'Suspensión';if(studentIsRetired31(u))return 'Retirado';if(studentDisapprovedByAbsences31(u))return 'Desaprobado por faltas';if(u?.attendanceReconsidered===true&&f>=5)return 'En recuperación';if(f===4)return 'A punto de desaprobar por faltas';return 'Activo';}
function studentStatusBadge31(u){const st=studentAcademicStatus31(u);if(st==='Suspensión')return '<span class="badge bad">🟠 Suspendido · Desaprobado</span>';if(st==='Retirado')return '<span class="badge" style="background:#e5e7eb;color:#374151">⚫ Retirado · Desaprobado</span>';if(st==='Desaprobado por faltas')return '<span class="badge bad">🔴 Desaprobado por faltas</span>';if(st==='En recuperación')return '<span class="badge warn">📝 En recuperación · máximo B</span>';if(st==='A punto de desaprobar por faltas')return '<span class="badge warn">🟠 A punto de desaprobar por faltas</span>';return '<span class="badge ok">🟢 Activo</span>';}

function studentIsRetired32(user){
  const u=typeof user==='string' ? (db.users||[]).find(x=>x.u===user) : user;
  return !!u && String(u.status||'').trim().toLowerCase()==='retirado';
}
function studentIsSuspended32(user){
  const u=typeof user==='string' ? (db.users||[]).find(x=>x.u===user) : user;
  const st=String(u?.status||'').trim().toLowerCase();
  return st==='suspension'||st==='suspensión';
}
function studentForcedDisapproved32(user){return studentIsRetired32(user)||studentIsSuspended32(user);}
function blockRetiredGrade32(user){
  if(!studentIsRetired32(user) && !studentIsSuspended32(user)) return false;
  const u=typeof user==='string' ? (db.users||[]).find(x=>x.u===user) : user;
  const st=studentIsSuspended32(u)?'SUSPENDIDO':'RETIRADO';

function normalizeStudentGrade23(value){
  const s=String(value||'').trim().toLowerCase();
  const m=s.match(/[1-5]/);
  return m ? m[0]+'.º' : '';
}

function normalizeStudentSection23(value){
  const s=String(value||'').trim().toUpperCase();
  const m=s.match(/\b([AB])\b/);
  return m ? m[1] : '';
}

function ensureStudentIds23(){
  if(!Array.isArray(db.users)) db.users=[];
  let changed=false;
  db.users.forEach((u,i)=>{
    if(u.role!=='student') return;

    if(u.id===undefined || u.id===null || u.id===''){
      u.id='st_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7);
      changed=true;
    }

    const normalizedGrade=normalizeStudentGrade23(u.grade || u.grado);
    const normalizedSection=normalizeStudentSection23(u.section || u.seccion);

    if(normalizedGrade && u.grade!==normalizedGrade){
      u.grade=normalizedGrade;
      changed=true;
    }
    if(normalizedSection && u.section!==normalizedSection){
      u.section=normalizedSection;
      changed=true;
    }
  });
  if(changed) save();
}

function renderStudents23(){
  const box=document.getElementById('studentsList23');
  if(!box)return;

  ensureStudentIds23();

  const q=(document.getElementById('studentSearch23')?.value||'').trim().toLowerCase();
  const g=(document.getElementById('studentGrade23')?.value||'Todos').trim();
  const sec=(document.getElementById('studentSection23')?.value||'Todas').trim().toUpperCase();
  const statusFilter=(document.getElementById('studentStatus23')?.value||'Todos').trim();
  syncAllStudentAttendanceStatus31();

  /*
   * FILTRO ESTRICTO:
   * La condición usa GRADO Y SECCIÓN al mismo tiempo.
   * Ejemplo: 4.º + A = SOLO estudiantes 4.º A.
   * Nunca se mezclan 4.º A con 4.º B.
   */
  const arr=(db.users||[]).filter(u=>{
    if(u.role!=='student') return false;

    const ug=normalizeStudentGrade23(u.grade || u.grado);
    const us=normalizeStudentSection23(u.section || u.seccion);
    const name=String(u.name||'').toLowerCase();
    const user=String(u.u||'').toLowerCase();

    const status=studentAcademicStatus31(u);
    return (g==='Todos' || ug===g) &&
           (sec==='TODAS' || us===sec) &&
           (statusFilter==='Todos' || status===statusFilter) &&
           (!q || name.includes(q) || user.includes(q));
  });

  /*
   * Cuando se selecciona un grado y una sección concreta,
   * se muestra UNA SOLA lista. Solo se agrupa cuando el filtro
   * está en "Todos/Todas".
   */
  const total=arr.length;
  const header=`<div class="card" style="margin-bottom:12px;padding:14px 18px;background:#f8fafc">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">

        <b>👥 Estudiantes registrados</b>
        <div class="muted" style="font-size:12px;margin-top:4px">
          ${total} estudiante${total===1?'':'s'} en el filtro actual.
        </div>
      </div>
      <span class="badge">${g==='Todos'?'Todos los grados':g} · ${sec==='TODAS'?'Todas las secciones':sec}</span>
    </div>
  </div>`;

      <p class="muted" style="margin:0">
        No hay estudiantes para <b>${g==='Todos'?'todos los grados':g}</b>
        y <b>${sec==='TODAS'?'todas las secciones':'sección '+sec}</b>.
      </p>
    </div>`;
    return;
  }

  arr.sort((a,b)=>{
    const ga=normalizeStudentGrade23(a.grade || a.grado);
    const gb=normalizeStudentGrade23(b.grade || b.grado);
    const sa=normalizeStudentSection23(a.section || a.seccion);
    const sb=normalizeStudentSection23(b.section || b.seccion);
    return ga.localeCompare(gb,'es',{numeric:true}) ||
           sa.localeCompare(sb) ||
           String(a.name||'').localeCompare(String(b.name||''),'es');
  });

  let html=header;

  if(g!=='Todos' && sec!=='TODAS'){
    /* Filtro combinado: SOLO una sección de un grado */
    html+=`<div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <h3 style="margin:0">🎓 ${escClass(g)} — Sección ${escClass(sec)}</h3>
        <span class="badge ok">${total} estudiante${total===1?'':'s'}</span>
      </div>
      <div style="overflow:auto">
        <table>
          <tr><th>#</th><th>Estudiante</th><th>Grado</th><th>Sección</th><th>Faltas</th><th>Estado</th><th>Acciones</th></tr>
          ${arr.map((u,i)=>`<tr>

function saveStudent23(oldUser){
  const name=document.getElementById('stName23')?.value.trim();
  const username=document.getElementById('stUser23')?.value.trim().toLowerCase().replace(/\s+/g,'.');
  const grade=document.getElementById('stGrade23')?.value;
  const section=document.getElementById('stSec23')?.value;
  const pass=document.getElementById('stPass23')?.value.trim()||'1234';
  const newStatus=document.getElementById('stStatus31')?.value||'Activo';
  const disChecked=document.getElementById('stDis31')?.checked===true;
  if(!name||!username||!grade||!section){alert('Completa nombre, usuario, grado y sección.');return;}
  if(!Array.isArray(db.users))db.users=[];
  if(oldUser){
    const u=db.users.find(x=>x.u===oldUser);
    if(!u){alert('No se encontró al estudiante.');return;}
    const oldStatus=String(u.status||'Activo').trim();
    u.name=name;u.grade=grade;u.section=section;u.p=pass;u.status=newStatus;
    if(oldStatus!==newStatus){
      const d=todayStatusDate31();
      if(!Array.isArray(u.statusHistory))u.statusHistory=[];
      u.statusHistory.push({date:d,status:newStatus});
      u.statusHistory.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
      if(newStatus==='Suspensión'||newStatus==='Retirado')u.statusSince=d;
      else delete u.statusSince;
    }
    const absenceCount=studentAbsenceCount31(u.u);
    const recChecked=document.getElementById('stRec31')?.checked===true;
  const creaRecoveryChecked=document.getElementById('stCreaRec31')?.checked===true;
    const attendanceDecisionCase=absenceCount>=5||u.attendanceDisapproved===true||u.attendanceReconsidered===true;
    if(attendanceDecisionCase){
      if(disChecked===recChecked){alert('Con 5 o más faltas debes seleccionar una sola opción: mantener la desaprobación o dar oportunidad de recuperación.');return;}
      if(recChecked){
        const reason=document.getElementById('stRecReason31')?.value.trim()||'';
        const evidence=document.getElementById('stRecEvidence31')?.value.trim()||'';
        if(!reason||!evidence){alert('Para dar la oportunidad de recuperación registra el motivo y la observación/evidencia.');return;}
        u.attendanceDisapproved=false;u.attendanceReconsidered=true;u.attendanceReconsiderationReason=reason;u.attendanceReconsiderationEvidence=evidence;u.attendanceReconsiderationDate=todayStatusDate31();
      }else{
        u.attendanceDisapproved=true;u.attendanceReconsidered=false;
        delete u.attendanceReconsiderationReason;delete u.attendanceReconsiderationEvidence;delete u.attendanceReconsiderationDate;
      }
    }else{
      u.attendanceDisapproved=false;u.attendanceReconsidered=false;
      delete u.attendanceReconsiderationReason;delete u.attendanceReconsiderationEvidence;delete u.attendanceReconsiderationDate;
    }
    const wasCreaRecovery=u.creaRecovery===true;
    const recoveryExistingBefore=(db.creaRecoveryEvaluations||[]).find(x=>x.user===u.u)||null;
    const selectedCreaPortfolioMode=document.getElementById('stCreaRecPortfolioMode31')?.value||creaRecoveryPortfolioMode31(u,recoveryExistingBefore);
    let transferredPortfolio=null;
    if(!wasCreaRecovery && creaRecoveryChecked){
      // Si el estudiante ya tenía una nota de Portafolio en la evaluación normal,
      // la trasladamos como antecedente a Recuperación Crea para no obligar a repetirla.
      const normalProject=projectRecord(u.u);
      if(normalProject && Number.isFinite(Number(normalProject.portfolio))) transferredPortfolio=Number(normalProject.portfolio);
    }
    u.creaRecovery=creaRecoveryChecked;
    if(creaRecoveryChecked){u.creaRecoveryPortfolioMode=selectedCreaPortfolioMode==='concurso'?'concurso':'manual';}
    else delete u.creaRecoveryPortfolioMode;
    if(creaRecoveryChecked && !wasCreaRecovery && transferredPortfolio!==null){
      if(!Array.isArray(db.creaRecoveryEvaluations))db.creaRecoveryEvaluations=[];
      const already=(db.creaRecoveryEvaluations||[]).find(x=>x.user===u.u);
      if(!already || already.portfolio===undefined || already.portfolio===null){
        const rr=already||{id:'crec_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),user:u.u};
        if(!already)db.creaRecoveryEvaluations.push(rr);
        rr.category=categoryForStudent(u);
        rr.mode='recuperacion_pedagogica';
        rr.portfolio=transferredPortfolio;
        rr.portfolioLevels=[];
        rr.portfolioEvaluatedCriteria=0;
        rr.portfolioNotDevelopedCriteria=0;
        rr.portfolioImportedFromWeekly=true;
        rr.portfolioImportedAt=Date.now();
        rr.portfolioSource='Seguimiento semanal — Portafolio (criterios del concurso)';
        rr.portfolioRubricMode='concurso';
        rr.savedAt=Date.now();
      }
    }
    if(!u.id)u.id='st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  }else{
    if(db.users.some(x=>x.u===username)){alert('Ese usuario ya existe.');return;}
    const nu={id:'st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),u:username,name,role:'student',grade,section,p:pass,status:newStatus,attendanceDisapproved:false,attendanceReconsidered:false,statusHistory:[{date:todayStatusDate31(),status:newStatus}]}; if(newStatus==='Suspensión'||newStatus==='Retirado')nu.statusSince=todayStatusDate31();
    nu.creaRecovery=creaRecoveryChecked;
    db.users.push(nu);if(disChecked)nu.attendanceDisapproved=true;else syncStudentAttendanceStatus31(nu);
  }
  save();closeModal();render();
}

function pasteStudents23(){
  const raw=document.getElementById('pasteStudents23')?.value.trim();
  const defaultGrade=document.getElementById('pasteGrade23')?.value||'1.º';
  const defaultSection=document.getElementById('pasteSection23')?.value||'A';
  const defaultPass=document.getElementById('pastePass23')?.value.trim()||'1234';
  if(!raw){alert('Pega primero la lista de estudiantes.');return;}
  if(!Array.isArray(db.users))db.users=[];
  let added=0,updated=0,skipped=0;
  const usedNames=new Set(db.users.filter(u=>u.role==='student').map(u=>String(u.name||'').trim().toLowerCase()));
  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  lines.forEach((line,index)=>{
    let c=line.split('\t').map(x=>x.trim());
    if(c.length===1 && line.includes(';'))c=line.split(';').map(x=>x.trim());
    if(c.length===1 && line.includes('|'))c=line.split('|').map(x=>x.trim());
    const first=(c[0]||'').toLowerCase();
    if(index===0 && (first.includes('apellidos')||first.includes('nombre')||first.includes('estudiante')))return;
    if(!c[0]){skipped++;return;}
    let name=c[0], user='', pass=defaultPass, grade=defaultGrade, section=defaultSection;
    if(c.length>=5){user=c[1]||'';pass=c[2]||defaultPass;grade=c[3]||defaultGrade;section=(c[4]||defaultSection).toUpperCase();}
    else if(c.length===2){
      if(['A','B'].includes(c[1].toUpperCase()))section=c[1].toUpperCase();
      else if(['1.º','2.º','3.º','4.º','5.º'].includes(c[1]))grade=c[1];
    }
    grade=String(grade).replace(/^([1-5])\s*[°ºo]?\.?$/,'$1.º');
    section=String(section).toUpperCase();
    if(!['1.º','2.º','3.º','4.º','5.º'].includes(grade)||!['A','B'].includes(section)){skipped++;return;}
    if(!user)user=makeUsernameStudent23(name);
    if(!pass)pass=defaultPass;
    let existing=db.users.find(u=>u.role==='student' && (u.u===user || (String(u.name||'').trim().toLowerCase()===name.toLowerCase() && u.grade===grade && u.section===section)));
    if(existing){
      existing.name=name;existing.grade=grade;existing.section=section;existing.p=pass;
      if(!existing.id)existing.id='st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      updated++;return;
    }
    if(db.users.some(u=>u.u===user)){user=makeUsernameStudent23(name);}
    db.users.push({id:'st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),u:user,p:pass,role:'student',name,grade,section});
    added++;usedNames.add(name.toLowerCase());
  });
  if(!added && !updated){alert('No se agregó ningún estudiante. Revisa la lista, grado y sección.');return;}
  save();
  render();
  alert(`✅ Lista procesada.\n\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
}

function makeUsernameStudent23(name){
  let base=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'')||'estudiante';
  let u=base,n=2;
  while((db.users||[]).some(x=>x.u===u)){u=base+'.'+n;n++;}
  return u;
}

function renderAttendanceHistory25(){
 const box=document.getElementById("attHistory25");
 if(!box)return;
 const section=document.getElementById("attSection25")?.value||"Todas";
 const users=(db.users||[]).filter(u=>u.role==="student"||u.role==="estudiante");
 const grades=["1.º","2.º","3.º","4.º","5.º"];
 const fmt=d=>{const p=String(d).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d};
 const statusCounts=(date,grade,sec)=>{
   // El resumen debe coincidir con Registro de clase: los estudiantes retirados
   // se conservan en el historial, pero NO cuentan como registros de asistencia
   // ni como faltas de la fecha.
   const students=users.filter(u=>u.grade===grade&&(sec==="Todas"||u.section===sec)&&!studentSuspendedOrRetiredOnDate31(u,date));
   let presente=0,tardanza=0,falta=0,justificada=0,total=0;
   students.forEach(u=>{
     const v=(db.attendance||{})[date+"|"+u.u];
     if(!v)return;
     total++;
     if(v==="Presente")presente++;
     else if(v==="Tardanza")tardanza++;
     else if(v==="Falta")falta++;
     else if(v==="Justificada"||v==="Representacion"||v==="Salud")justificada++;
   });
   return {presente,tardanza,falta,justificada,total};
 };
 const gradeBlocks=grades.map(grade=>{
   const secs=section==="Todas"?["A","B"]:[section];
   const rows=[];
   secs.forEach(sec=>{
     const studentIds=new Set(users.filter(u=>u.grade===grade&&u.section===sec).map(u=>u.u));
     const dates=[...new Set(Object.keys(db.attendance||{}).filter(k=>studentIds.has(k.substring(k.indexOf("|")+1))).map(k=>k.split("|")[0]))].sort((a,b)=>b.localeCompare(a));
     dates.forEach(date=>{
       const c=statusCounts(date,grade,sec);
       rows.push(`<tr><td><b>${fmt(date)}</b></td><td><b>${sec}</b></td><td>${c.presente}</td><td>${c.tardanza}</td><td>${c.falta}</td><td>${c.justificada}</td><td>${c.total}</td><td><button class="secondary small" onclick="openAttendanceHistoryDate25('${date}','${grade}','${sec}')">👁️ Ver fecha</button></td></tr>`);
     });
   });
   if(!rows.length) return `<div class="item" style="margin-top:10px"><b>🎓 ${grade}</b><div class="muted" style="margin-top:4px">No hay fechas de asistencia registradas${section==="Todas"?" en A ni B":" en la sección "+section}.</div></div>`;
   return `<div class="card" style="margin-top:10px;padding:14px"><h3 style="margin:0">🎓 ${grade}</h3><div style="overflow:auto;margin-top:10px"><table><tr><th>Fecha</th><th>Sección</th><th>Presentes</th><th>Tardanzas</th><th>Faltas</th><th>Justificadas</th><th>Registros</th><th>Acción</th></tr>${rows.join("")}</table></div></div>`;
 }).join("");
 box.innerHTML=`<div class="card" style="border:2px solid #dbe5f4;background:#f8fbff"><h2 style="margin:0">📅 HISTORIAL DE ASISTENCIA POR GRADO</h2><p class="muted" style="margin:5px 0 0">Aquí aparecen todas las fechas que ya tienen asistencia guardada, separadas por grado. Sección mostrada: <b>${section==="Todas"?"A y B":section}</b>. Los estudiantes retirados se conservan en el historial, pero no cuentan en los totales.</p>${gradeBlocks}</div>`;
}

function attendanceAlerts26(){
 const records=db.attendance||{};
 const users=(db.users||[]).filter(u=>u.role==="student"||u.role==="estudiante");
 const alerts=[];
 users.forEach(u=>{
   const entries=Object.keys(records).filter(k=>k.endsWith("|"+u.u)).map(k=>({key:k,date:k.split("|")[0],status:records[k]}));
   // Un estudiante retirado debe aparecer claramente como RETIRADO y no generar
   // alertas de faltas, tardanzas ni recuperaciones. Se conserva su historial.
   syncStudentAttendanceStatus31(u);
   if(studentIsRetired31(u)){
     alerts.push({u,level:"retirado",text:`${u.name||u.u} se encuentra RETIRADO.`});
     return;
   }
   entries.forEach(x=>{
     if(x.status==="Representacion") alerts.push({u,level:"recuperacion",text:`${u.name||u.u} faltó el ${x.date} porque estuvo representando al colegio. Recuerda recuperar la actividad o evaluación de ese día.`});
     if(x.status==="Salud") alerts.push({u,level:"recuperacion",text:`${u.name||u.u} faltó el ${x.date} por motivo de salud. Recuerda recuperar la actividad o evaluación de ese día.`});
   });
   const faltas=entries.filter(x=>x.status==="Falta").length;
   const tardanzas=entries.filter(x=>x.status==="Tardanza").length;
   if(faltas>=5&&u.attendanceReconsidered!==true) alerts.push({u,level:"alta",text:`${u.name||u.u} tiene ${faltas} faltas y está DESAPROBADO POR FALTAS.`});
   else if(faltas>=3) alerts.push({u,level:"alta",text:`${u.name||u.u} tiene ${faltas} faltas registradas.`});
   else if(faltas===2) alerts.push({u,level:"media",text:`${u.name||u.u} tiene 2 faltas registradas. Conviene hacer seguimiento.`});
   if(tardanzas>=3) alerts.push({u,level:"media",text:`${u.name||u.u} tiene ${tardanzas} tardanzas registradas.`});
 });
 return alerts;
}

function importStudentsFromExcel(){
  const box=document.getElementById("excelStudentsPaste");
  if(!box) return;

  const raw=box.value.trim();
  if(!raw){
    alert("Pega primero la lista copiada desde Excel.");
    return;
  }

  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let added=0, skipped=0;

  lines.forEach((line,index)=>{
    let cols=line.split("\t").map(x=>x.trim());

    // También acepta ; o | si la lista no viene directamente desde Excel.
    if(cols.length<2){
      if(line.includes(";")) cols=line.split(";").map(x=>x.trim());
      else if(line.includes("|")) cols=line.split("|").map(x=>x.trim());
    }

    // Saltar encabezados habituales.
    const first=(cols[0]||"").toLowerCase();
    if(index===0 && (
      first.includes("nombre") ||
      first.includes("apellidos") ||
      first.includes("estudiante")
    )){
      skipped++;
      return;
    }

    if(cols.length<1 || !cols[0]) {
      skipped++;
      return;
    }

    const name=cols[0];
    const username=cols[1] || makeUsernameFromName(name);
    const password=cols[2] || "1234";
    const grade=cols[3] || "";
    const section=cols[4] || "";

    if(!db.users) db.users=[];

    // Evitar duplicados por usuario.
    if(db.users.some(u=>u.u===username)){
      skipped++;
      return;
    }

    db.users.push({
      u:username,
      p:password,
      role:"student",
      name:name,
      grade:grade,
      section:section
    });

    added++;
  });

  if(added===0){
    alert("No se importaron estudiantes. Revisa que las columnas estén separadas por tabulaciones.");
    return;
  }

  save();
  closeModal();
  render();

  alert(`✅ Se importaron ${added} estudiante(s).${skipped ? ` Se omitieron ${skipped}.` : ""}`);
}

function makeUsernameFromName(name){
  return name
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,".")
    .replace(/^\.+|\.+$/g,"");
}

function classAvg(u){

  const classRecords=Array.isArray(db.classRecords)?db.classRecords:[];

  const recoveries=Array.isArray(db.classRecoveries)?db.classRecoveries:[];

    const ev=evals.find(x=>String(x.classId)===String(r.id)&&x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!=='');
    if(ev){const n=Number(ev.grade);if(Number.isFinite(n)){values.push(n);seen.add(String(r.id));}return;}
    const rr=recoveries.find(x=>String(x.classId)===String(r.id)&&x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!=='');
    if(rr){const n=Number(rr.grade);if(Number.isFinite(n)){values.push(n);seen.add(String(r.id));}}
  });
  evals.filter(x=>x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!==''&&!seen.has(String(x.classId))).forEach(x=>{const n=Number(x.grade);if(Number.isFinite(n))values.push(n)});
  return avgNums(values);
}

function creaInstitutionalRecord31(user){

  if(!st)return null;

function creaInstitutionalParticipant31(user){

  return !!(r && String(r.status||'').trim().toLowerCase()==='participó');
}
function creaInstitutionalProjectStatus31(user){
  const st=(user&&typeof user==='object')?user:(db.users||[]).find(x=>x.u===user);
  if(!st)return '';
  if(st.creaRecovery===true){
    const rr=(db.creaRecoveryEvaluations||[]).find(x=>x.user===st.u)||null;
    if(rr?.portfolio!=null && rr?.exposition!=null)return '📝 Recuperación pedagógica · completa · máximo B';
    if(rr?.portfolio!=null)return '📝 Recuperación pedagógica · Portafolio listo · Exposición pendiente';
    return '📝 Recuperación pedagógica · pendiente';
  }
  if(!creaInstitutionalParticipant31(st))return '';
  const p=projectRecord(st.u),missing=[];
  if(p.portfolio===null)missing.push('Portafolio');
  if(p.product===null)missing.push('Producto');
  if(p.exposition===null)missing.push('Exposición');
  return missing.length
    ? `🏆 Participó institucional · pendiente: ${missing.join(', ')}`
    : '🏆 Participó institucional · evidencias completas';
}
function projectAvg(u){
  const user=(db.users||[]).find(x=>x.u===u)||{};
  if(user.creaRecovery===true){
    const rr=(db.creaRecoveryEvaluations||[]).find(x=>x.user===u)||null;
    if(!rr || rr.portfolio===null || rr.portfolio===undefined || rr.exposition===null || rr.exposition===undefined)return null;
    // Recuperación pedagógica: Portafolio + Exposición son obligatorios.
    // El Producto es opcional: si lo presenta, se incorpora con 30%; si no, se normalizan 30%+40% sobre 70%.
    const hasProduct=rr.product!==null&&rr.product!==undefined&&Number.isFinite(Number(rr.product));
    const raw=Number(rr.portfolio)*30+Number(rr.exposition)*40+(hasProduct?Number(rr.product)*30:0);
    const denom=hasProduct?100:70;
    return Math.max(0,Math.min(14,raw/denom));
  }
  const p=projectRecord(u);
  // Modalidad normal: las tres evidencias del Proyecto deben existir para calcularlo.
  // No se permite que Producto + Exposición oculten un Portafolio pendiente.
  const vals=[p.portfolio,p.product,p.exposition];
  if(vals.length!==3 || vals.some(x=>x===null || x===undefined || !Number.isFinite(Number(x))))return null;
  return avgNums(vals);
}

function activeProcessComponents(){
  ensureClassData();
  const w=db.evaluationWeights, a=db.evaluationConfig.components||{};
  return [
    ['class',classAvg,Number(w.class)||0],['activities',activitiesAvg,Number(w.activities)||0],
    ['participation',participationAvg,Number(w.participation)||0],['behavior',behaviorAvg,Number(w.behavior)||0],
    ['uniform',uniformAvg,Number(w.uniform)||0],['notebook',notebookAvg,Number(w.notebook)||0],
    ['folder',folderAvg,Number(w.folder)||0],['exam',examAvg,Number(w.exam)||0]
  ].filter(x=>a[x[0]]!==false&&x[2]>0);
}
function processAvg(u){
  ensureClassData();
  if(db.evaluationConfig.processEnabled===false)return null;
  const comps=activeProcessComponents();
  const vals=comps.map(([k,fn,w])=>({v:fn(u),w})).filter(x=>x.v!==null);
  if(!vals.length)return null;
  const totalW=vals.reduce((s,x)=>s+x.w,0);
  return totalW?vals.reduce((s,x)=>s+x.v*x.w,0)/totalW:null;
}
function finalGrade(u){
  ensureClassData();
  const user=(db.users||[]).find(x=>x.u===u)||{};
  if(studentForcedDisapproved31(user)) return 5;
  const attendanceReconsidered=(studentAbsenceCount31(user.u)>=5&&user.attendanceReconsidered===true);
  const creaRecovery=user.creaRecovery===true;
  if(creaRecovery){
    const rr=(db.creaRecoveryEvaluations||[]).find(x=>x.user===user.u)||null;
    if(!rr || rr.portfolio===null || rr.portfolio===undefined || rr.exposition===null || rr.exposition===undefined)return null;
  }
  const capRecovery=n=>(attendanceReconsidered||creaRecovery)&&Number.isFinite(Number(n))?Math.min(14,Number(n)):n;
  const p=projectAvg(u);
  const processOn=db.evaluationConfig.processEnabled!==false && activeProcessComponents().length>0;
  const pr=processOn?processAvg(u):null;
  if(p===null&&pr===null)return null;
  if(p!==null && !processOn)return capRecovery(p);
  if(p===null)return capRecovery(pr);
  if(pr===null)return capRecovery(p);
  return capRecovery(p*.70+pr*.30);
}

function evaluationDetail(u){
  const p=projectAvg(u), pr=processAvg(u), f=finalGrade(u);
  return {project:p,process:pr,final:f,level:f===null?'—':classLevel(f)};
}

function openMissingWorkDashboard30(){
  ensureClassData();
  const grade=(window._classGradeFilter30||document.getElementById('ceGrade30')?.value||'').trim();
  const section=(window._classSectionFilter30||document.getElementById('ceSec30')?.value||'').trim();
  if(!grade||grade==='Todos'||!section||section==='Todas'){
    alert('Primero selecciona el grado y la sección para revisar los trabajos no encontrados.');
    return;
  }

  const students=(db.users||[]).filter(u=>u.role==='student' && String(u.grade||'')===String(grade) && String(u.section||'')===String(section));
  const sessions=allSessionsForUI().filter(s=>sessionAppliesToGrade(s,grade,section));
  const studentRows=[];
  let totalCases=0;

  students.forEach(st=>{
    const cases=[];
    sessions.forEach(s=>{
      const rec=getSessionClassRecord30(s.id,grade,section);
      if(!rec)return; // Solo revisamos como "trabajo no encontrado" las sesiones que ya tienen registro de clase.
      const ev=getEvidence30(rec.id,st.u);
      if(!ev || !['no_encontrada','sin_nombre'].includes(ev.status))return;
      const att=attendanceStatusForDateUser(classAttendanceDate30(rec),st);
      cases.push({
        session:s,
        record:rec,
        evidence:ev,
        attendance:att
      });
    });
    if(cases.length){
      totalCases+=cases.length;
      studentRows.push({st,cases});
    }
  });

  // Segundo control: si tomaste asistencia pero todavía NO abriste/evaluaste
  // esa sesión en Registro de clase, no podemos llamar a eso "trabajo no encontrado".
  // Lo mostramos en un bloque separado para que puedas detectar rápidamente
  // qué estudiantes asistieron a sesiones que aún están sin evaluar.
  const notEvaluatedByStudent=[];

    sessions.forEach(s=>{
      const rec=getSessionClassRecord30(s.id,grade,section);
      if(rec)return; // Ya existe un registro de clase: se revisa en el bloque de trabajos no encontrados.
      const date=sessionDateForGradeSection(s,grade,section)||s.date||'';
      if(!date)return;
      const att=attendanceStatusForDateUser(date,st);
      // Solo estudiantes que realmente estuvieron presentes/tuvieron tardanza
      // pueden tener un trabajo pendiente de identificación en esa sesión.
      if(att==='Presente'||att==='Tardanza') pendingSessions.push({session:s,date,attendance:att});
    });

      <span style="font-size:.9rem">${status}${x.attendance?` · ${escClass(attendanceStatusLabel(x.attendance))}`:''}</span>

  modalBody.classList.remove('projectMainModal');
  modalBody.classList.add('wide');
  modalBody.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-24px;background:#fff;padding:0 0 12px;z-index:20;border-bottom:1px solid #e2e8f0">
      <div><h2 style="margin:0">🔎 Trabajos no encontrados</h2><div class="muted">${escClass(grade)} ${escClass(section)} · revisión consolidada de todas las sesiones registradas</div></div>
      <button class="secondary" onclick="closeModal()" title="Cerrar">✕ Cerrar</button>
    </div>
    <div class="card" style="margin-top:14px;background:#eff6ff;border:1px solid #bfdbfe">
      <b>📋 ${studentRows.length} estudiante(s)</b> tienen <b>${totalCases}</b> registro(s) de trabajo no encontrado o sin nombre.
      <div class="muted" style="margin-top:5px">No necesitas revisar sesión por sesión. Aquí se agrupan todos los casos del ${escClass(grade)} ${escClass(section)}.</div>
    </div>
    <div class="actions" style="margin-top:12px">
      <button onclick="openMissingWorkDashboard30()">🔄 Actualizar</button>
      <button class="secondary" onclick="closeModal()">Cerrar</button>
    </div>
    <div style="margin-top:14px">
      ${studentRows.map((row,i)=>`<div class="item" style="margin-top:10px;display:block">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">

          <span class="badge warn">⚠️ ${row.cases.length}</span>

function sessionEvaluationStatus30(session,grade,section){
  ensureClassData();
  const classRec=getSessionClassRecord30(session.id,grade,section);
  const students=(db.users||[]).filter(u=>u.role==='student' && String(u.grade||'')===String(grade||'') && String(u.section||'')===String(section||''));
  const eligible=students.filter(u=>!studentIsRetired32(u)&&!studentIsSuspended32(u));
  if(!classRec || !eligible.length){
    const forced=students.length && students.every(u=>studentIsRetired32(u)||studentIsSuspended32(u));
    return {status:forced?'evaluada':'no_evaluada',done:forced?students.length:0,total:students.length,pct:forced?100:0};
  }
  let done=0;
  eligible.forEach(u=>{
    const ev=classEvalRecord(classRec.id,u.u)||{};
    const hasEval=(ev.status!==null&&ev.status!==undefined&&String(ev.status).trim()!=='') || (ev.grade!==null&&ev.grade!==undefined&&String(ev.grade).trim()!=='');
    const evidence=getEvidence30(classRec.id,u.u);
    const hasEvidence=!!(evidence&&evidence.status);
    const recovery=getRecovery30(classRec.id,u.u);
    const hasRecovery=!!(recovery&&recovery.grade!==null&&recovery.grade!==undefined&&String(recovery.grade).trim()!=='');
    if(hasEval||hasEvidence||hasRecovery) done++;
  });
  const total=students.length;
  const allDone=done>=eligible.length;
  return {status:allDone?'evaluada':(done>0?'en_proceso':'no_evaluada'),done,total,pct:eligible.length?Math.round(done*100/eligible.length):0};
}

  if(x.status==='en_proceso') return `<span class="badge warn">🟡 En proceso · ${x.done}/${x.total}</span>`;
  return `<span class="badge" style="background:#e2e8f0;color:#475569">⚪ No evaluada · 0/${x.total}</span>`;

function classAttendanceDate30(rec){
  // En Registro de clase la fecha de asistencia debe ser la fecha de la
  // sesión para ese grado/sección. Esto evita usar una fecha antigua que
  // haya quedado guardada en un classRecord creado anteriormente.
  if(!rec)return '';
  try{
    if(rec.session){
      const ses=(db.sessions||[]).find(x=>String(x.id)===String(rec.session));
      const d=sessionDateForGradeSection(ses,rec.grade,rec.section);
      if(d)return normalizeAttendanceDate30(d);
    }
  }catch(e){}
  return normalizeAttendanceDate30(rec.date||'');
}
function normalizeAttendanceDate30(value){
  if(value===null||value===undefined)return '';
  const s=String(value).trim();
  if(!s)return '';
  // Acepta YYYY-MM-DD, YYYY-MM-DDTHH:mm... y DD/MM/YYYY.
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/);
  return m?`${m[3]}-${m[2]}-${m[1]}`:s;
}
function normalizeAttendanceStatus30(value){
  const s=String(value??'').trim().toLowerCase();
  if(s==='presente'||s==='present')return 'Presente';
  if(s==='tardanza'||s==='tarde')return 'Tardanza';
  if(s==='falta'||s==='ausente')return 'Falta';
  if(s==='justificada'||s==='falta justificada')return 'Justificada';
  if(s==='representacion'||s==='representación'||s==='representando al colegio')return 'Representacion';
  if(s==='salud'||s==='motivo de salud')return 'Salud';
  return String(value??'').trim();
}
function attendanceStatusForDateUser(date,userOrStudent){
  const attendance=db.attendance||{};
  const wantedDate=normalizeAttendanceDate30(date);
  const student=(userOrStudent&&typeof userOrStudent==='object')?userOrStudent:null;
  const wantedUser=String(student?.u ?? userOrStudent ?? '').trim();
  if(!wantedDate||!wantedUser)return '';

  // 1) La clave exacta de Asistencia tiene prioridad cuando existe.
  const exact=attendance[`${wantedDate}|${wantedUser}`];
  if(exact!==undefined&&exact!==null&&String(exact).trim()!=='') return normalizeAttendanceStatus30(exact);

  // 2) Compatibilidad con registros antiguos: misma fecha + mismo usuario.
  const sameUser=[];
  for(const key of Object.keys(attendance)){
    const pos=key.indexOf('|');
    if(pos<1)continue;
    const keyDate=normalizeAttendanceDate30(key.slice(0,pos));
    const keyUser=key.slice(pos+1).trim();
    if(keyDate===wantedDate&&keyUser===wantedUser){
      const st=normalizeAttendanceStatus30(attendance[key]);
      if(st)sameUser.push(st);
    }
  }
  if(sameUser.length)return sameUser.includes('Presente')?'Presente':sameUser[0];

  // 3) Si el ID del estudiante cambió, busca el mismo alumno por nombre + grado + sección.
  // Esto evita que Registro conserve una Falta de un ID antiguo cuando Asistencia
  // ya fue registrada como Presente con el ID actual.
  if(student?.name){
    const norm=v=>String(v??'').trim().toUpperCase().replace(/\s+/g,' ');
    const wantedName=norm(student.name), wantedGrade=norm(student.grade), wantedSection=norm(student.section);
    const idsByName=new Set((db.users||[])
      .filter(x=>norm(x.name)===wantedName && (!wantedGrade||norm(x.grade)===wantedGrade) && (!wantedSection||norm(x.section)===wantedSection))
      .map(x=>String(x.u||'').trim()).filter(Boolean));
    idsByName.add(wantedUser);
    const matches=[];
    for(const key of Object.keys(attendance)){
      const pos=key.indexOf('|');
      if(pos<1)continue;
      const keyDate=normalizeAttendanceDate30(key.slice(0,pos));
      const keyUser=key.slice(pos+1).trim();
      if(keyDate!==wantedDate||!idsByName.has(keyUser))continue;
      const st=normalizeAttendanceStatus30(attendance[key]);
      if(st)matches.push(st);
    }
    // Si hay más de un registro asociado al mismo alumno, una asistencia
    // Presente/Tardanza debe prevalecer sobre una Falta antigua.
    if(matches.includes('Presente'))return 'Presente';
    if(matches.includes('Tardanza'))return 'Tardanza';
    if(matches.length)return matches[0];
  }
  return '';
}

function renderClass30(){

  ensureClassData();
  const id=document.getElementById('ceClass30')?.value;
  const rec=classRecordById(id);
  if(!rec){box.innerHTML='';return;}

    const recovery=getRecovery30(rec.id,u.u);

    const evidence=getEvidence30(rec.id,u.u);

                          (ev.grade==='' || ev.grade==null || ev.grade===undefined);

            <option value="no_encontrada" ${evidenceStatus==='no_encontrada'||autoNoTrabajo?'selected':''}>🟡 No se encontró su trabajo</option>

    }else{
      statusCell=`<select class="ceStatus30" data-user="${escClass(u.u)}">
          <option value="" ${!ev.status?'selected':''}>—</option>
          <option value="HIZO" ${ev.status==='HIZO'?'selected':''}>✅ HIZO</option>

        </select>`;
    }

    return `<tr>

  }

  }

  </table></div>`;
  box.innerHTML=html;

    const ev=classEvalRecord(rec.id,u.u)||{};

    const noEvaluationYet=(ev.status==='' || ev.status==null || ev.status===undefined) &&
                          (ev.grade==='' || ev.grade==null || ev.grade===undefined);
    const sessionEvaluated=(db.classEvaluations||[]).some(x=>String(x.classId)===String(rec.id) && (x.status||x.grade!==null&&x.grade!==undefined&&x.grade!==''));
    if(att && !attendanceNeedsRecovery(att) && !existing && noEvaluationYet && sessionEvaluated){
      if(!Array.isArray(db.classEvidence))db.classEvidence=[];
      db.classEvidence.push({
        id:'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
        classId:rec.id,user:u.u,status:'no_encontrada',automatic:true,createdAt:Date.now()
      });

  box.querySelectorAll('.ceEvidence30').forEach(e=>{
    e.onchange=()=>{
      const id=document.getElementById('ceClass30')?.value;
      if(!id)return;
      if(!Array.isArray(db.classEvidence))db.classEvidence=[];
      let r=getEvidence30(id,e.dataset.user);
      if(!r){
        r={id:'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),classId:id,user:e.dataset.user,status:e.value,automatic:false,createdAt:Date.now()};
        db.classEvidence.push(r);
      }else{r.status=e.value;r.automatic=false;r.updatedAt=Date.now();}
      if(e.value==='encontrada'){
        const pendingRec=(db.classRecoveries||[]).find(x=>x.classId===id&&x.user===e.dataset.user&&x.automaticEvidenceRecovery===true&&(!x.grade&&x.grade!==0));
        if(pendingRec){db.classRecoveries=db.classRecoveries.filter(x=>x!==pendingRec);}
      }
      save();renderClass30();
    };
  });
  box.querySelectorAll('.ceGrade30:not([readonly])').forEach(e=>{
    e.oninput=()=>{
      const o=box.querySelector(`.ceLevel30[data-user="${CSS.escape(e.dataset.user)}"]`);
      if(o)o.textContent=e.value===''?'—':classLevel(e.value);
      autoSaveClassField30(e.dataset.user,null,e.value);
    };
    e.onblur=()=>autoSaveClassField30(e.dataset.user,null,e.value,true);
  });
}

let _classEvalSaveTimers30={};
function autoSaveClassField30(user,status,rawGrade,immediate=false){
  if(blockRetiredGrade32(user)) return;
  const lockRec=classRecordById(document.getElementById('ceClass30')?.value);
  if(lockRec&&blockClosedDate31(lockRec.date)) return;
  const id=document.getElementById('ceClass30')?.value,rec=classRecordById(id);
  if(!id||!rec||!user)return;
  let r=classEvalRecord(id,user);
  if(r){
    if(status!==null)r.status=status;
    if(rawGrade!==null){
      const v=String(rawGrade).trim();
      r.grade=v===''?null:Math.max(0,Math.min(20,Number(v)));
    }
    if(!r.status&&r.grade==null){db.classEvaluations=db.classEvaluations.filter(x=>x!==r);}
  }else{
    const st=status!==null?status:'';
    const v=rawGrade===null?'':String(rawGrade).trim();
    const gr=v===''?null:Math.max(0,Math.min(20,Number(v)));
    if(st||gr!=null)db.classEvaluations.push({id:'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),classId:id,user,status:st,grade:gr,date:rec.date,title:rec.title,gradeClass:rec.grade,section:rec.section});
  }
  clearTimeout(_classEvalSaveTimers30[user]);
  if(immediate){save();return;}
  _classEvalSaveTimers30[user]=setTimeout(()=>{save();delete _classEvalSaveTimers30[user]},350);
}
function flushClassEvalAutosave30(){
  Object.keys(_classEvalSaveTimers30).forEach(k=>clearTimeout(_classEvalSaveTimers30[k]));
  _classEvalSaveTimers30={};
  save();
}
function saveClassEval30(){
  const lockRec=classRecordById(document.getElementById('ceClass30')?.value);
  if(lockRec&&blockClosedDate31(lockRec.date)) return;
  const forcedUsers=[...document.querySelectorAll('.ceStatus30,.ceGrade30')].map(e=>e.dataset.user).filter(Boolean).filter((u,i,a)=>a.indexOf(u)===i).filter(studentForcedDisapproved32);
  if(forcedUsers.length){ alert('⚠️ Hay estudiantes suspendidos o retirados. No se guardarán evaluaciones para ellos; su resultado queda DESAPROBADO.'); }
  ensureClassData();const id=document.getElementById('ceClass30')?.value,rec=classRecordById(id);if(!rec){alert('Primero selecciona una sesión de aprendizaje.');return}
  const ss=[...document.querySelectorAll('.ceStatus30')],gs=[...document.querySelectorAll('.ceGrade30')];let n=0;
  ss.forEach(e=>{const u=e.dataset.user;if(studentForcedDisapproved32(u))return;const st=e.value,g=gs.find(x=>x.dataset.user===u),raw=g?g.value:'';let r=classEvalRecord(id,u);
    if(!st&&raw===''){if(r)db.classEvaluations=db.classEvaluations.filter(x=>x!==r);return}
    const grade=raw===''?null:Math.max(0,Math.min(20,Number(raw)));
    if(!r)db.classEvaluations.push({id:'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),classId:id,user:u,status:st,grade,date:rec.date,title:rec.title,gradeClass:rec.grade,section:rec.section});
    else{r.status=st;r.grade=grade}
    n++;
  });
  save();alert(`✅ Evaluación guardada. Registros de esta clase: ${n}`);renderClass30();
}

function normalizeRecordGrade(g){
  const s=String(g||'').trim();
  return ['1.º','2.º','3.º','4.º','5.º'].includes(s)?s:'';
}
function normalizeRecordSection(s){
  const v=String(s||'').trim().toUpperCase();
  return (v==='A'||v==='B')?v:'';
}
function recordScope(arrName,rec){
  let grade=normalizeRecordGrade(rec.grade);
  let section=normalizeRecordSection(rec.section);
  const scores=(db[arrName]||[]).filter(x=>x.recordId===rec.id && x.user);
  const users=(db.users||[]);
  if(!grade){
    const gs=[...new Set(scores.map(x=>{
      const u=users.find(u=>u.u===x.user);
      return normalizeRecordGrade(u?.grade);
    }).filter(Boolean))];
    if(gs.length===1)grade=gs[0];
  }
  if(!section){
    const ss=[...new Set(scores.map(x=>{
      const u=users.find(u=>u.u===x.user);
      return normalizeRecordSection(u?.section);
    }).filter(Boolean))];
    if(ss.length===1)section=ss[0];
  }
  return {grade,section};
}
function componentDisplayTitle(arrName,r,title){
  if(r.title && !/Grades$/i.test(String(r.title))) return r.title;
  const map={
    activitiesGrades:'Desarrollo de actividades',
    participations:'Participación',
    behaviorGrades:'Conducta',
    uniformGrades:'Uniforme',
    notebookGrades:'Cuaderno',
    folderGrades:'Folder',
    examGrades:'Examen / Fichas'
  };
  return map[arrName]||title;
}

function isRealComponentRecord(arrName,r){
  // Los registros de notas antiguas pueden estar mezclados dentro del mismo arreglo.
  // Un registro de evaluación real tiene sesión/fecha/grado-sección o un id cmp_.
  if(!r || r.user || r.recordId) return false;
  if(String(r.id||'').startsWith('cmp_')) return true;
  if(r.session || r.sessionTitle || r.date || normalizeRecordGrade(r.grade) && normalizeRecordSection(r.section)) return true;

  // Ocultar entradas antiguas mal formadas como "uniformGrades · 15".
  const badTitle=String(r.title||'').trim().toLowerCase();
  const badNames=new Set([
    'activitiesgrades','participations','behaviorgrades','uniformgrades',
    'notebookgrades','foldergrades','examgrades'
  ]);
  return !badNames.has(badTitle);
}

function renderSimpleComponentRecords(arrName,title,key,gradeFilter,sectionFilter){
  const arr=(db[arrName]||[]);
  const seen=new Set();

  const filtered=arr.slice().reverse().filter(r=>{
    if(!isRealComponentRecord(arrName,r)) return false;

    const scope=recordScope(arrName,r);
    if((gradeFilter!=='Todos' && scope.grade!==gradeFilter) ||
       (sectionFilter!=='Todas' && scope.section!==sectionFilter)) return false;

    // Un solo registro por sesión + grado + sección.
    // Esto evita que una misma evaluación aparezca repetida varias veces.
    const sessionKey=String(r.session || '') ||
      `${String(r.sessionTitle||'').trim()}|${String(r.date||'')}`;
    const uniqueKey=`${arrName}|${sessionKey}|${scope.grade}|${scope.section}`;
    if(seen.has(uniqueKey)) return false;
    seen.add(uniqueKey);
    return true;
  });

  return filtered.map(r=>{
    const scope=recordScope(arrName,r);
    const displayTitle=componentDisplayTitle(arrName,r,title);
    return `<div class="item">
      <div>
        <b>${escClass(displayTitle)}</b>
        <div class="muted" style="margin-top:6px;line-height:1.7">
          📖 <b>Sesión:</b> ${escClass(
            (r.sessionNumber ? 'Sesión '+r.sessionNumber+(r.sessionTitle?': ':'') : '') +
            (r.sessionTitle||'No vinculada')
          )}
          <br>
          📅 <b>Fecha:</b> ${escClass(r.date||'—')}
          &nbsp; · &nbsp;
          🎓 <b>Grado:</b> ${escClass(scope.grade||'No vinculado')}
          &nbsp; · &nbsp;
          🔤 <b>Sección:</b> ${escClass(scope.section||'No vinculada')}
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button onclick="openComponentRecord('${key}','${arrName}','${escClass(r.id)}')">Evaluar</button>
        <button class="secondary" onclick="editComponentRecord('${key}','${arrName}','${escClass(r.id)}')">✏️ Modificar</button>
        <button class="secondary" onclick="deleteComponentRecord('${arrName}','${escClass(r.id)}')">🗑️ Eliminar</button>
      </div>
    </div>`;
  }).join('') || `<div class="item"><b>No hay registros para este filtro.</b></div>`;
}

function filterSimpleComponentRecords(arrName){
  const keyMap={
    activitiesGrades:'activities',
    participations:'participation',
    behaviorGrades:'behavior',
    uniformGrades:'uniform',
    notebookGrades:'notebook',

function autoSaveComponentGrade(arrName,recordId,input){
  if(blockRetiredGrade32(input?.dataset?.user)) return;
  const cmpRec=(db[arrName]||[]).find(x=>x.id===recordId);
  if(cmpRec&&blockClosedDate31(cmpRec.date)) return;
  ensureClassData();
  const user=input?.dataset?.user;
  if(!user)return;
  const val=input.value;
  const arr=db[arrName]||[];
  let x=arr.find(x=>x.recordId===recordId&&x.user===user);

  if(val===''){
    if(x) db[arrName]=arr.filter(y=>y!==x);
  }else{
    const n=Math.max(0,Math.min(20,Number(val)));
    if(Number.isNaN(n))return;
    if(!x){
      x={id:'score_'+Date.now()+'_'+Math.random(),recordId,user,grade:n};
      db[arrName].push(x);
    }else{
      x.grade=n;
    }
  }
  save();

  const level=modalBody.querySelector(`.cmpLevel[data-user="${CSS.escape(user)}"]`);
  if(level)level.textContent=val===''?'—':classLevel(val);
}
