function projectRubricScore(levels,criteriaCount){
  const vals=(levels||[]).map(Number).filter(n=>Number.isFinite(n)&&Number.isInteger(n)&&n>=1&&n<=4);
  if(!vals.length)return null;
  // Los criterios marcados "Aún no enseñado" no participan en el promedio.
  // Los criterios evaluados se normalizan de niveles 1–4 a escala 0–20.
  return Math.max(0,Math.min(20,(vals.reduce((a,b)=>a+b,0)/(vals.length*4))*20));
}
function categoryForStudent(u){
  const g=String(u?.grade||'').replace(/\s/g,'');
  return (g==='1.º'||g==='1°'||g==='1' || g==='2.º'||g==='2°'||g==='2')?'A':'B';
}
function projectRecord(u){
  ensureClassData();
  const weekly=(db.projectWeeklyGrades||[]).filter(x=>x.user===u && x.excludedFromGroupEvaluation!==true);
  const legacy=(db.projectGrades||[]).filter(x=>x.user===u);
  const user=(db.users||[]).find(x=>x.u===u)||{};
  const cat=categoryForStudent(user);

  const pc=db.projectRubrics[cat+'_portfolio']||[];
  const pr=db.projectRubrics[cat+'_product']||[];
  if(user.creaRecovery===true){
    const rr=(db.creaRecoveryEvaluations||[]).find(x=>x.user===u)||null;
    const portfolio=rr&&rr.portfolio!==undefined&&rr.portfolio!==null&&Number.isFinite(Number(rr.portfolio))?Number(rr.portfolio):null;
    const exposition=rr&&rr.exposition!==undefined&&rr.exposition!==null&&Number.isFinite(Number(rr.exposition))?Number(rr.exposition):null;
    const product=rr&&rr.product!==undefined&&rr.product!==null&&Number.isFinite(Number(rr.product))?Number(rr.product):null;
    return {portfolio,product,exposition};
  }
  const portfolioVals=weekly.map(x=>projectRubricScore(x.portfolioLevels,pc.length)).filter(x=>x!==null);
  const productVals=weekly.map(x=>projectRubricScore(x.productLevels,pr.length)).filter(x=>x!==null);

  if(!portfolioVals.length) legacy.forEach(x=>{if(x.portfolio!==''&&x.portfolio!=null)portfolioVals.push(Number(x.portfolio));});
  if(!productVals.length) legacy.forEach(x=>{if(x.product!==''&&x.product!=null)productVals.push(Number(x.product));});

  // La exposición oficial de Crea y Emprende tiene 5 criterios de 1 a 4.
  // Los cinco puntajes de una misma evaluación NO se promedian: se SUMAN,
  // porque el máximo ya es 20 puntos. Si existieran varias evaluaciones,
  // se promedia el resultado de cada evaluación completa (cada una /20).
  // Exposición oficial: solo cuentan los 5 criterios actuales y cada uno debe ser 1–4.
  // Los registros antiguos de la rúbrica anterior (0–20 por criterio) se ignoran para
  // no producir resultados imposibles como 85/20. Una evaluación solo cuenta cuando
  // están completos los 5 criterios oficiales.
  const currentExpoIds=new Set([
    'organizacion_equipo','identificacion_problema','propuesta_solucion',
    'perfil_cliente','innovacion_producto_servicio'
  ]);
  const creaScores=(db.creaExpositionScores||[]).filter(x=>
    x.user===u && currentExpoIds.has(String(x.criterionId||'')) &&
    x.score!==undefined && x.score!==null && x.score!=='' &&
    Number.isInteger(Number(x.score)) && Number(x.score)>=1 && Number(x.score)<=4
  );
  const expoGroups={};
  creaScores.forEach(x=>{
    const key=String(x.groupId||'sin_grupo')+'|'+String(x.date||'');
    if(!expoGroups[key])expoGroups[key]={};
    expoGroups[key][String(x.criterionId)]=Number(x.score);
  });
  const expositionVals=Object.values(expoGroups)
    .filter(vals=>currentExpoIds.size===Object.keys(vals).length && [...currentExpoIds].every(id=>Number.isFinite(vals[id])))
    .map(vals=>Object.values(vals).reduce((a,b)=>a+b,0));
  let exposition=avgNums(expositionVals);
  // Si ya existe una evaluación en la rúbrica oficial actual de Crea y Emprende,
  // no debemos rescatar una nota antigua de 05/20 desde projectGrades solo porque
  // la evaluación nueva todavía esté incompleta. Mientras falten criterios, la
  // Exposición queda pendiente; una vez completos los 5 criterios, se usa su nota.
  if(exposition===null && creaScores.length===0){
    const legacyExpo=legacy.map(x=>x.exposition).filter(x=>x!==''&&x!=null).map(Number);
    exposition=avgNums(legacyExpo);
  }
  return {portfolio:avgNums(portfolioVals),product:avgNums(productVals),exposition};
}

/* Grupos exclusivos de Crea y Emprende.
   Cada proyecto registrado en Crea y Emprende constituye un grupo para
   la evaluación del portafolio/producto. No se consulta db.groups. */
function normalizeGradeCY30(v){
  const x=String(v||'').trim().toLowerCase().replace(/[º°]/g,'').replace(/\s+/g,'');
  const m=x.match(/([1-5])/); return m?m[1]:x;
}
function normalizeSectionCY30(v){return String(v||'').trim().toUpperCase();}

/* Grupos exclusivamente de Crea y Emprende. No usa db.groups. */
function getCreaProjectGroups30(grade,sec){
  ensureClassData();
  const ng=normalizeGradeCY30(grade), ns=normalizeSectionCY30(sec);
  const students=(db.users||[]).filter(u=>
    u.role==='student' &&
    u.creaRecovery!==true &&
    normalizeGradeCY30(u.grade)===ng &&
    normalizeSectionCY30(u.section)===ns
  );
  const studentMap=new Map(students.map(u=>[String(u.u||''),u]));
  // Para Portafolio y Producto, basta con que el estudiante tenga un
  // proyecto registrado en Crea y Emprende. NO exigimos 'Participó':
  // un estudiante puede incorporarse después y registrar recién su proyecto.
  const records=(db.creaEmprende||[]).filter(r=>{
    return normalizeGradeCY30(r.grade)===ng && normalizeSectionCY30(r.section)===ns;
  });
  const map=new Map();
  records.forEach(r=>{
    const username=String(r.studentKey||r.username||'');
    let st=studentMap.get(username);
    if(!st && r.studentId!=null) st=students.find(u=>String(u.id)===String(r.studentId));
    if(!st)return;
    const project=String((r.project||r.detail||'')).trim();
    if(!project)return;
    const key=project.toLocaleLowerCase().replace(/\s+/g,' ').trim();
    if(!map.has(key)){
      const safeKey=ng+'|'+ns+'|'+key;
      map.set(key,{id:'cygrp_'+btoa(unescape(encodeURIComponent(safeKey))).replace(/[^a-zA-Z0-9_-]/g,''),name:project,grade,section:sec,stage:r.stage||'',members:[]});
    }
    const g=map.get(key);
    if(!g.members.some(x=>x.u===st.u))g.members.push(st);
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

function getCreaProjectGroup30(groupId,grade,sec){
  let g=getCreaProjectGroups30(grade,sec).find(x=>x.id===groupId);
  if(g)return g;
  const scopes=new Map();
  (db.creaEmprende||[]).forEach(r=>{
    const key=normalizeGradeCY30(r.grade)+'|'+normalizeSectionCY30(r.section);
    if(!scopes.has(key))scopes.set(key,[r.grade,r.section]);
  });
  for(const [key,scope] of scopes){
    g=getCreaProjectGroups30(scope[0],scope[1]).find(x=>x.id===groupId);
    if(g)return g;
  }
  return null;
}

function saveCreaProjectWeeklyRubric30(groupId){
  ensureClassData();
  const grade=document.getElementById('prjWeekGrade')?.value||'';
  const sec=document.getElementById('prjWeekSection')?.value||'';
  const g=getCreaProjectGroup30(groupId,grade,sec);
  if(!g){alert('No se encontró el proyecto de Crea y Emprende.');return;}
  const members=(g.members||[]).filter(Boolean);
  if(!members.length){alert('Este proyecto no tiene integrantes para guardar.');return;}
  const u=members[0],cat=categoryForStudent(u);
  const pc=db.projectRubrics[cat+'_portfolio']||[];
  const pr=db.projectRubrics[cat+'_product']||[];
  const week=Number(document.getElementById('prjWeek')?.value||1);
  const date=document.getElementById('prjWeekDate')?.value||todayLocal30();
  const includedUsers=new Set([...document.querySelectorAll('.creaWeeklyMemberInclude30:checked')].map(el=>String(el.dataset.user||'')));
  if(!includedUsers.size){
    if(!confirm('Has excluido a todos los integrantes. ¿Quieres guardar la evaluación sin aplicar la rúbrica a ningún estudiante?'))return;
  }
  const collect=(key,blankAsNA)=>[...document.querySelectorAll(`.rubLevel30[data-k="${key}"]`)].map(el=>{const v=String(el.value||'');if(v==='')return blankAsNA?'NA':null;return v==='NA'?'NA':Number(v);});
  const portfolioLevels=collect('portfolioLevels',false);
  const productLevels=collect('productLevels',true);
  if(!pc.length){alert('No hay criterios de Portafolio configurados para esta categoría.');return;}
  if(!portfolioLevels.length){alert('No se encontraron los criterios de Portafolio en esta evaluación.');return;}
  if(portfolioLevels.some(x=>x===null)){alert('Completa todos los criterios de Portafolio o marca “Aún no enseñado”.');return;}
  const portfolio=projectRubricScore(portfolioLevels,pc.length);
  const product=productLevels.length?projectRubricScore(productLevels,pr.length):null;
  const savedUsers=[];
  const excludedUsers=[];
  members.forEach(st=>{
    if(studentIsRetired32(st.u)||studentIsSuspended32(st.u))return;
    let r=projectWeeklyRecord(st.u,week);
    if(!r){r={id:'pweek_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),user:st.u,week};db.projectWeeklyGrades.push(r);}
    const included=includedUsers.has(String(st.u));
    r.date=date;r.grade=st.grade||grade||'';r.section=st.section||sec||'';r.category=categoryForStudent(st);r.groupId=groupId;r.groupName=g.name;r.creaEmprendeGroup=true;r.creaProject=g.name;r.creaStage=g.stage||'Etapa institucional';
    r.excludedFromGroupEvaluation=!included;
    if(included){
      r.portfolioLevels=portfolioLevels.slice();
      r.productLevels=productLevels.slice();
      r.portfolio=portfolio;
      r.product=product;
      r.savedAt=Date.now();
      savedUsers.push(st.u);
    }else{
      // Conserva cualquier evaluación anterior, pero queda excluida del cálculo.
      excludedUsers.push(st.u);
      r.savedAt=Date.now();
    }
  });
  if(!savedUsers.length && !excludedUsers.length){alert('No se pudo guardar la configuración de esta evaluación.');return;}
  try{save();const stored=JSON.parse(localStorage.getItem('aulaEPT')||'{}');const touched=[...savedUsers,...excludedUsers];const ok=touched.every(user=>Array.isArray(stored.projectWeeklyGrades)&&stored.projectWeeklyGrades.some(x=>x.user===user&&Number(x.week)===week&&String(x.groupId||'')===String(groupId)));if(!ok){alert('El sistema no pudo confirmar el guardado en este navegador.');return;}}catch(err){console.error('Error al guardar evaluación de Crea y Emprende:',err);alert('No se pudo guardar la evaluación. Revisa el almacenamiento del navegador.');return;}
  const portfolioEvaluated=portfolioLevels.filter(x=>Number.isFinite(Number(x)));
  const portfolioRaw=portfolioEvaluated.reduce((a,b)=>a+Number(b),0);
  const portfolioMax=portfolioEvaluated.length*4;
  const productEvaluated=productLevels.filter(x=>Number.isFinite(Number(x)));
  const productRaw=productEvaluated.reduce((a,b)=>a+Number(b),0);
  const productMax=productEvaluated.length*4;
  const pText=portfolio===null?'Pendiente':`${portfolioRaw} / ${portfolioMax} (equivalente ${portfolio.toFixed(2)} / 20)`;
  const prText=product===null?'Pendiente de evaluación':`${productRaw} / ${productMax} (equivalente ${product.toFixed(2)} / 20)`;
  alert(`✅ Evaluación guardada.
Incluidos: ${savedUsers.length} · Excluidos: ${excludedUsers.length}
${savedUsers.length?`Portafolio: ${pText}\nProducto: ${prText}`:'Ningún integrante recibió esta evaluación.'}`);
  openProjectWeekly();
}

function levelToScore30(level){
  const n=Number(level);
  // En las rúbricas de Crea y Emprende, cada criterio se califica de 1 a 4.
  return Number.isFinite(n)&&n>=1&&n<=4 ? n : null;
}
function rubricRawAnd20_30(key){
  const els=[...document.querySelectorAll(`.rubLevel30[data-k="${key}"]`)];
  const vals=els.map(e=>levelToScore30(e.value)).filter(v=>v!==null);
  const raw=vals.reduce((a,b)=>a+b,0);
  // Solo cuentan los criterios realmente evaluados. “Aún no enseñado”
  // no se incluye ni en el puntaje máximo ni en la equivalencia sobre 20.
  const max=d=>d*4;
  const evaluatedMax=max(vals.length);
  const eq20=evaluatedMax?raw/evaluatedMax*20:null;
  return {raw,max:evaluatedMax,eq20,count:vals.length,allNA:els.length>0&&els.every(e=>e.value==='NA')};
}
function updateWeeklyRubricTotals30(){
  const update=(key,totalId)=>{
    const d=rubricRawAnd20_30(key);
    const total=document.getElementById(totalId);
    if(!total)return;
    if(d.allNA){ total.textContent='Pendiente de evaluación'; return; }
    if(!d.count){ total.textContent='—'; return; }
    total.innerHTML=`${d.raw} / ${d.max} <span class="muted" style="font-weight:600">(equivalente ${d.eq20.toFixed(2)} / 20)</span>`;
  };
  update('portfolioLevels','portfolioFinal30');
  update('productLevels','productFinal30');
}

function ensureDefaultExpositionRubric30(){
  ensureClassData();
  if(!Array.isArray(db.expositionRubric.criteria)) db.expositionRubric.criteria=[];
  // Primera configuración: dejar lista la rúbrica de exposición individual.
  const names=['1. Dominio del tema','2. Análisis económico','3. Sustenta la viabilidad','4. Propuesta de mejora','5. Comunicación y respuesta'];
  const current=db.expositionRubric.criteria;
  if(!current.length){
    names.forEach((name,i)=>current.push({id:'crit_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,6),name}));
    save();
    return;
  }
  // Si quedó la configuración inicial anterior con "Nuevo criterio", la actualizamos.
  const looksOld=current.length<=2 && current.some(c=>String(c.name||'').toLowerCase().includes('nuevo criterio'));
  if(looksOld){
    const first=current[0]||{id:'crit_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)};
    first.name=names[0];
    const ids=current.slice(1).map(c=>c.id);
    if(ids.length) db.expositionRubric.scores=db.expositionRubric.scores.filter(s=>!ids.includes(s.criterionId));
    current.length=0;
    current.push(first);
    names.slice(1).forEach((name,i)=>current.push({id:'crit_'+Date.now()+'_'+(i+1)+'_'+Math.random().toString(36).slice(2,6),name}));
    save();
  }
}

function expositionEvaluationBatches30(){
  ensureClassData();
  const scores=(db.expositionRubric&&Array.isArray(db.expositionRubric.scores))?db.expositionRubric.scores:[];
  const map=new Map();
  scores.forEach(sc=>{
    if(!sc||sc.score===undefined||sc.score===null||sc.score==='')return;
    const st=(db.users||[]).find(u=>u.u===sc.user);
    if(!st)return;
    const grade=sc.grade||st.grade||'';
    const section=sc.section||st.section||'';
    const groupId=sc.groupId||'';
    const week=Number(sc.week||0);
    const key=[sc.sessionId||'',sc.date||'',grade,section,week,groupId].join('|');

    map.get(key).count++;
  });
  return [...map.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.grade).localeCompare(String(a.grade))||Number(b.week)-Number(a.week));
}

function sessionMatchesExactGradeSection30(s,grade,section){
  if(!s||!grade)return false;
  const g=String(grade||'').trim(), sec=String(section||'').trim();
  const sg=String(s.grade||'').trim(), ss=String(s.section||'').trim();
  // En la corrección de una exposición SOLO se muestran sesiones creadas
  // para el grado y sección de la exposición. No se mezclan sesiones de
  // otros grados ni sesiones generales 3.º-5.º sin una fecha/entrada exacta.
  if(sg===g){
    return !sec || !ss || ss===sec;
  }
  const map=s.dateByGradeSection||{};
  if((sg==='3.º-5.º') && sec && map[g+'|'+sec]) return true;
  return false;
}

function expositionSessionsForFilter30(){
  const grade=document.getElementById('expoGrade30')?.value||'Todos';
  const sec=document.getElementById('expoSection30')?.value||'Todas';
  return allSessionsForUI().filter(s=>{
    if(grade==='Todos') return true;
    // Cuando se selecciona una sección, SOLO mostrar sesiones creadas
    // específicamente para ese grado y sección. Las sesiones compartidas
    // 3.º-5.º solo entran si tienen una fecha/configuración explícita para
    // la combinación seleccionada.
    if(sec!=='Todas') return sessionMatchesExactGradeSection30(s,grade,sec);
    // Si se pide todo el grado, mostrar sus sesiones exactas y las compartidas
    // únicamente cuando realmente incluyen ese grado.
    return sessionAppliesToGrade(s,grade,'');
  });
}

function expositionHasScoresForSession30(s){
  if(!s) return false;
  const grade=document.getElementById('expoGrade30')?.value||'Todos';
  const sec=document.getElementById('expoSection30')?.value||'Todas';
  const students=(db.users||[]).filter(u=>u.role==='student' && (grade==='Todos'||u.grade===grade) && (sec==='Todas'||u.section===sec));
  const ids=new Set(students.map(u=>u.u));
  // Una evaluación de exposición pertenece a UNA sesión exacta.
  // Nunca se busca por número de semana porque Sesión 1, Sesión 2, etc.
  // pueden existir en varios grados/secciones.
  return (db.expositionRubric?.scores||[]).some(x=>
    ids.has(x.user) && x.sessionId && String(x.sessionId)===String(s.id)
  );
}

function expositionSessionDate30(s){
  const grade=document.getElementById('expoGrade30')?.value||'Todos';
  const sec=document.getElementById('expoSection30')?.value||'Todas';
  if(!s)return '';
  if(grade!=='Todos' && sec!=='Todas') return sessionDateForGradeSection(s,grade,sec)||'';
  if(grade!=='Todos'){
    const entries=sessionDateEntries(s).filter(x=>String(x.label||'').startsWith(grade+' '));
    if(entries.length)return entries[0].date;
    return s.date||'';

  return s.date||sessionDateEntries(s)[0]?.date||'';
}

function expositionAutoReason30(date,user){
  const student=(db.users||[]).find(u=>String(u.u)===String(user));
  const wantedDate=normalizeAttendanceDate30(date);
  const attendance=db.attendance||{};
  let st=attendanceStatusForDateUser(wantedDate,student||user);

  // Refuerzo exclusivo para Exposición: si el ID del estudiante cambió o
  // el registro de asistencia antiguo conserva otro identificador, buscar
  // por fecha + nombre + grado + sección antes de asumir "No expuso".
  if(!st && student && wantedDate){
    const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
    const wantedName=norm(student.name), wantedGrade=norm(student.grade), wantedSection=norm(student.section);
    const validIds=new Set((db.users||[])
      .filter(u=>norm(u.name)===wantedName && norm(u.grade)===wantedGrade && norm(u.section)===wantedSection)
      .map(u=>String(u.u||'').trim()).filter(Boolean));
    validIds.add(String(user||'').trim());
    for(const key of Object.keys(attendance)){
      const pos=key.indexOf('|');
      if(pos<1)continue;
      const kd=normalizeAttendanceDate30(key.slice(0,pos));
      const ku=key.slice(pos+1).trim();
      if(kd!==wantedDate || !validIds.has(ku))continue;
      st=normalizeAttendanceStatus30(attendance[key]);
      if(st)break;
    }
  }

  // Acepta también variantes que puedan existir en registros antiguos de
  // Asistencia (con o sin tildes y con textos más largos).
  const raw=String(st||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  if(raw==='falta'||raw==='ausente'||raw.includes('falta a clases')) return '❌ Faltó a clases';
  if(raw==='justificada'||raw.includes('falta justificada')) return '📄 Falta justificada';
  if(raw==='representacion'||raw.includes('represent')||raw.includes('colegio')) return '🏫 Estuvo representando al colegio';
  if(raw==='salud'||raw.includes('salud')||raw.includes('enfermedad')) return '🩺 No asistió por motivo de salud';
  if(raw==='tardanza'||raw==='tarde'||raw.includes('tard')) return '🕐 Llegó tarde';
  if(raw==='presente'||raw==='present') return 'No expuso';
  return 'No expuso';
}

function renderExpositionStudents30(){
  ensureDefaultExpositionRubric30();
  ensureClassData();
  const box=document.getElementById('expoTable30');if(!box)return;
  const criteria=db.expositionRubric.criteria||[];
  const sessionId=document.getElementById('expoWeek30')?.value||'';

  const week=Number(session?.number||0);
  const grade=document.getElementById('expoGrade30')?.value||'Todos',sec=document.getElementById('expoSection30')?.value||'Todas';
  if(!sessionId||!session||!week){
    box.innerHTML='<div class="item">📖 Selecciona una <b>sesión de aprendizaje creada</b> para mostrar a sus integrantes y evaluar la exposición.</div>';
    return;
  }
  const students=(db.users||[]).filter(u=>u.role==='student'&&(grade==='Todos'||u.grade===grade)&&(sec==='Todas'||u.section===sec));
  const groups=(db.groups||[]).filter(g=>(grade==='Todos'||g.grade===grade)&&(sec==='Todas'||g.section===sec));

  const rows=[];
  groups.forEach(g=>{
    const members=(g.members||[]).map(id=>db.users.find(u=>u.u===id)).filter(u=>u && students.some(s=>s.u===u.u));
    if(!members.length)return;
    members.forEach((student,idx)=>{
      const studentScores=(db.expositionRubric.scores||[]).filter(x=>x.user===student.u&&x.sessionId&&String(x.sessionId)===String(session.id)&&String(x.groupId||'')===String(g.id));
      const attendance=normalizeAttendanceStatus30(attendanceStatusForDateUser(expositionSessionDate30(session),student));
      const waiting=attendance==='Salud'||attendance==='Representacion';
      const savedStatus=studentScores.find(x=>x.expositionStatus)?.expositionStatus||'expuso';
      // Salud y representación siempre quedan pendientes: no deben mostrarse
      // como No expuso ni conservar los 05 automáticos de una ejecución anterior.
      const status=waiting?'esperar':savedStatus;
      const cells=criteria.map(c=>{
        const sc=studentScores.find(x=>x.criterionId===c.id);
        const shown=waiting?'':(status==='no_expuso'?'5':(sc?.score??''));
        return `<td><input class="expoScore30" data-user="${escClass(student.u)}" data-group="${escClass(g.id)}" data-criterion="${escClass(c.id)}" type="number" min="0" max="20" value="${shown}" ${status==='no_expuso'||waiting?'readonly':''} style="width:75px"></td>`;
      }).join('');
      const vals=criteria.map(c=>studentScores.find(x=>x.criterionId===c.id)?.score).filter(x=>x!==undefined&&x!==null&&x!=='');
      const effectiveVals=waiting?[]:(status==='no_expuso'?criteria.map(()=>5):vals);
      const av=avgNums(effectiveVals);
      const attendanceLabel=attendance ? (attendance==='Presente'?'✅ Presente':attendance==='Falta'?'❌ Faltó a clases':attendance==='Justificada'?'📄 Falta justificada':attendance==='Representacion'?'🏫 Representación del colegio':attendance==='Salud'?'🩺 Motivo de salud':attendance==='Tardanza'?'🕐 Llegó tarde':('📋 '+attendance)) : '📋 Sin registro de asistencia';
      const statusText=waiting?(attendance==='Salud'?'🩺 Esperar al estudiante · Salud':'🏫 Esperar al estudiante · Representación del colegio'):(status==='no_expuso'?`❌ No expuso → 05 · ${attendanceLabel}`:`🎤 Expuso · ${attendanceLabel}`);
      rows.push(`<tr data-no-expuso="${status==='no_expuso'?'1':'0'}" data-waiting="${waiting?'1':'0'}">
        <td><b>${escClass(g.name)}</b><br>${escClass(student.name)}<br><small class="muted">${idx+1} de ${members.length} integrantes · ${escClass(student.grade||'')} ${escClass(student.section||'')}</small></td>
        <td><span class="expoAutoStatus30" data-user="${escClass(student.u)}" data-group="${escClass(g.id)}">${statusText}</span></td>${cells}<td><b>${av===null?'—':av.toFixed(2)}</b></td></tr>`);
    });
  });
  box.innerHTML=`<table><tr><th>Grupo / estudiante</th><th>Estado</th>${headers}<th>Nota individual</th></tr>${rows.join('')||'<tr><td colspan="'+(criteria.length+3)+'">No hay grupos para el filtro. Crea los grupos primero.</td></tr>'}</table><div id="expoUngrouped30" style="margin-top:14px"></div><p class="muted" style="margin-top:10px">🎯 Sesión ${escClass(session.number||'')} · ${escClass(session.title||'')} · Fecha: <b>${escClass(expositionSessionDate30(session)||'Sin fecha')}</b>. Los estudiantes que no tengan notas pueden rellenarse automáticamente con <b>❌ No expuso → 05</b>; el estado también muestra su <b>asistencia de esa fecha</b>.</p><div class="actions" style="margin-top:10px"><button class="secondary" onclick="fill05RemainingNoExposed30()">❌ Rellenar 05 a quienes no expusieron</button></div><button onclick="saveExpositionScores()">💾 Guardar evaluaciones individuales</button>`;
  const closedDate=expositionSessionDate30(session)||todayLocal30();
  if(closedForDate31(closedDate)) box.querySelectorAll('input,button').forEach(e=>e.disabled=true);
  box.querySelectorAll('.expoScore30').forEach(inp=>{inp.addEventListener('input',()=>{const row=inp.closest('tr');if(!row)return;const vals=[...row.querySelectorAll('.expoScore30')].map(x=>x.value.trim()).filter(x=>x!=='').map(Number).filter(x=>Number.isFinite(x));const cell=row.lastElementChild;if(cell)cell.innerHTML=`<b>${vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2):'—'}</b>`;});});
}

function fill05RemainingNoExposed30(){
  const box=document.getElementById('expoTable30');
  if(!box)return;
  let count=0, waitingCount=0;
  const session=(db.sessions||[]).find(x=>String(x.id)===String(document.getElementById('expoWeek30')?.value||''));
  const date=expositionSessionDate30(session)||todayLocal30();
  const rows=[...box.querySelectorAll('tr')].filter(r=>r.querySelector('.expoScore30'));

  rows.forEach(row=>{
    const inputs=[...row.querySelectorAll('.expoScore30')];
    const user=inputs[0]?.dataset.user||'';
    const groupId=inputs[0]?.dataset.group||'';
    if(!user)return;
    const att=normalizeAttendanceStatus30(attendanceStatusForDateUser(date,user));

    // SALUD y REPRESENTACIÓN: se espera al estudiante. Si este registro
    // tenía 05 automáticos de una ejecución anterior, se limpian para que
    // no quede falsamente como "No expuso".
    if(att==='Salud' || att==='Representacion'){
      waitingCount++;
      inputs.forEach(i=>{i.value='';i.readOnly=true;});
      row.dataset.noExpuso='0';
      row.dataset.expoObservation='';
      row.dataset.waiting='1';
      const st=row.querySelector('.expoAutoStatus30');
      if(st)st.textContent=att==='Salud'?'🩺 Esperar al estudiante · Salud':'🏫 Esperar al estudiante · Representación del colegio';
      const cell=row.lastElementChild;if(cell)cell.innerHTML='<b>—</b>';
      // Quitar únicamente los registros que estaban marcados como no expuso
      // para esta sesión/grupo. No se tocan evaluaciones de otras sesiones.
      db.expositionRubric.scores=(db.expositionRubric.scores||[]).filter(x=>!(String(x.sessionId)===String(session.id)&&String(x.user)===String(user)&&String(x.groupId||'')===String(groupId)&&x.expositionStatus==='no_expuso'));
      return;
    }

    // Para los demás: solo se rellenan quienes todavía no tienen ninguna nota.
    const hasAny=inputs.some(i=>String(i.value||'').trim()!=='');
    if(hasAny)return;
    inputs.forEach(i=>{i.value='5';i.readOnly=true;});
    row.dataset.noExpuso='1';
    row.dataset.waiting='0';
    row.dataset.expoObservation=expositionAutoReason30(date,user);
    const st=row.querySelector('.expoAutoStatus30');
    if(st)st.textContent='❌ No expuso → 05';
    const cell=row.lastElementChild;if(cell)cell.innerHTML='<b>5.00</b>';
    count++;
  });

  // Toda la relación del grado/sección: también incluye estudiantes sin grupo/sorteo.
  const grade=document.getElementById('expoGrade30')?.value||'Todos';
  const sec=document.getElementById('expoSection30')?.value||'Todas';
  const students=(db.users||[]).filter(u=>u.role==='student'&&(grade==='Todos'||u.grade===grade)&&(sec==='Todas'||u.section===sec));
  const grouped=new Set((db.groups||[])
    .filter(g=>(grade==='Todos'||g.grade===grade)&&(sec==='Todas'||g.section===sec))
    .flatMap(g=>g.members||[]));
  const ungrouped=students.filter(u=>!grouped.has(u.u));
  const target=document.getElementById('expoUngrouped30');
  if(target && ungrouped.length){
    const criteria=db.expositionRubric.criteria||[];
    const headers=criteria.map(c=>`<th>${escClass(c.name)}<br><small>0–20</small></th>`).join('');
    const existingUsers=new Set([...box.querySelectorAll('.expoScore30')].map(i=>i.dataset.user));
    const fresh=ungrouped.filter(u=>!existingUsers.has(u.u));
    if(fresh.length){
      const urows=fresh.map(student=>{
        const att=normalizeAttendanceStatus30(attendanceStatusForDateUser(date,student));
        if(att==='Salud' || att==='Representacion'){
          waitingCount++;
          return `<tr data-no-expuso="0" data-waiting="1"><td><b>Sin grupo</b><br>${escClass(student.name)}<br><small class="muted">No pertenece a ningún grupo/sorteo · ${escClass(student.grade||'')} ${escClass(student.section||'')}</small></td><td><span class="expoAutoStatus30" data-user="${escClass(student.u)}" data-group="">${att==='Salud'?'🩺 Esperar al estudiante · Salud':'🏫 Esperar al estudiante · Representación del colegio'}</span></td>${criteria.map(c=>`<td><input class="expoScore30" data-user="${escClass(student.u)}" data-group="" data-criterion="${escClass(c.id)}" type="number" min="0" max="20" value="" readonly style="width:75px"></td>`).join('')}<td><b>—</b></td></tr>`;
        }
        const reason=expositionAutoReason30(date,student.u);
        const attendanceLabel=att ? (att==='Presente'?'✅ Presente':att==='Falta'?'❌ Faltó a clases':att==='Justificada'?'📄 Falta justificada':att==='Representacion'?'🏫 Representación del colegio':att==='Salud'?'🩺 Motivo de salud':att==='Tardanza'?'🕐 Llegó tarde':('📋 '+att)) : '📋 Sin registro de asistencia';
        const cells=criteria.map(c=>`<td><input class="expoScore30" data-user="${escClass(student.u)}" data-group="" data-criterion="${escClass(c.id)}" type="number" min="0" max="20" value="5" readonly style="width:75px"></td>`).join('');
        return `<tr data-no-expuso="1" data-waiting="0" data-expo-observation="${escClass(reason)}"><td><b>Sin grupo</b><br>${escClass(student.name)}<br><small class="muted">No pertenece a ningún grupo/sorteo · ${escClass(student.grade||'')} ${escClass(student.section||'')}</small></td><td><span class="expoAutoStatus30" data-user="${escClass(student.u)}" data-group="">❌ No expuso → 05 · ${escClass(attendanceLabel)}</span></td>${cells}<td><b>5.00</b></td></tr>`;
      }).join('');
      target.innerHTML=`<div class="item"><b>📋 Estudiantes del grado/sección sin grupo o sin sorteo</b><div class="muted" style="margin-top:4px">Se incluyen en la relación. Salud y representación quedan pendientes; los demás reciben automáticamente 05.</div><table style="margin-top:10px"><tr><th>Estudiante</th><th>Estado</th>${headers}<th>Nota individual</th></tr>${urows}</table></div>`;
      count+=fresh.filter(u=>{const a=normalizeAttendanceStatus30(attendanceStatusForDateUser(date,u));return a!=='Salud'&&a!=='Representacion';}).length;
    }
  }

  if(count===0 && waitingCount===0){alert('No hay estudiantes pendientes de rellenar. Las notas existentes no se modificaron.');return;}
  save();
  alert(`❌ ${count} estudiante(s) quedaron como “No expuso” y con 05.${waitingCount?`\n\n⏳ ${waitingCount} estudiante(s) con SALUD o REPRESENTACIÓN quedaron pendientes y NO tienen 05.`:''}`);
}

function saveExpositionScores(){
  ensureClassData();
  const sessionId=document.getElementById('expoWeek30')?.value||'';
  const ses=(db.sessions||[]).find(x=>String(x.id)===String(sessionId));
  if(!ses){alert('Selecciona una sesión de aprendizaje creada.');return;}
  const date=sessionDateForGradeSection(ses,document.getElementById('expoGrade30')?.value||ses.grade,document.getElementById('expoSection30')?.value||ses.section)||ses.date||'';
  if(!date){alert('La sesión seleccionada no tiene una fecha registrada para ese grado y sección.');return;}
  if(blockClosedDate31(date)) return;
  const week=Number(ses.number||0);
  if(!week){alert('La sesión seleccionada no tiene número de sesión válido.');return;}
  const inputs=[...document.querySelectorAll('.expoScore30')];
  let count=0;
  inputs.forEach(e=>{
    const user=e.dataset.user,groupId=e.dataset.group,criterionId=e.dataset.criterion,val=e.value;
    const g=groupId ? (db.groups||[]).find(x=>x.id===groupId) : null;
    if(g && !(g.members||[]).includes(user))return;
    if(!g && groupId) return;
    const row=e.closest('tr');
    const status=row?.dataset.noExpuso==='1'?'no_expuso':'expuso';
    const reason=status==='no_expuso'?(row?.dataset.expoObservation||'No expuso'):'';
    const finalVal=status==='no_expuso'?5:val;
    // Buscar por sesión exacta + estudiante + grupo + criterio.
    // NO usar solo week, porque eso mezcla la misma Sesión 1, 2, etc. de otros grados/secciones.
    let sc=db.expositionRubric.scores.find(x=>x.user===user&&x.sessionId&&String(x.sessionId)===String(ses.id)&&String(x.groupId||'')===String(groupId)&&x.criterionId===criterionId);
    if(finalVal===''){if(sc)db.expositionRubric.scores=db.expositionRubric.scores.filter(x=>x!==sc);return;}
    if(!sc){sc={id:'ex_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),user,week,criterionId};db.expositionRubric.scores.push(sc);}
    if(studentIsRetired32(user)) return;
    const student=(db.users||[]).find(x=>x.u===user);
    sc.date=date;sc.grade=student?.grade||'';sc.section=student?.section||'';sc.category=categoryForStudent(student);sc.groupId=groupId;sc.groupName=g?.name||'Sin grupo';sc.sessionId=ses.id;sc.sessionNumber=ses.number||'';sc.sessionTitle=ses.title||'';sc.score=Math.max(0,Math.min(20,Number(finalVal)));sc.expositionStatus=status;sc.expositionObservation=status==='no_expuso'?(reason||'No expuso') : '';sc.savedAt=Date.now();
    count++;
  });
  save();alert(`✅ Evaluación individual de exposición guardada.\n${count} criterio(s) registrado(s).`);openProjectEvaluation();
}

function reminderNotificationStatus26(){
  if(!('Notification' in window)) return '⚠️ Este navegador no admite notificaciones.';
  if(Notification.permission==='granted') return '🟢 Avisos del navegador ACTIVADOS';
  if(Notification.permission==='denied') return '🔴 Avisos bloqueados. Actívalos en los permisos del sitio.';
  return '🟡 Avisos pendientes de autorización';
}
async function requestReminderNotifications26(){
  try{
    if(!('Notification' in window)){
      alert('Este navegador no admite notificaciones. El aviso dentro del sistema sí funcionará.');
      return;
    }
    if(Notification.permission==='granted'){
      alert('✅ Los avisos del navegador ya están activados.');
      render();
      return;
    }
    const p=await Notification.requestPermission();
    if(p==='granted'){
      try{ new Notification('🔔 Aula EPT',{body:'Los avisos de tus recordatorios ya están activados.'}); }catch(e){}
      alert('✅ Avisos activados. Ahora puedes ir a cualquier otra página. Cuando llegue la fecha y hora, Aula EPT mostrará una notificación del navegador.');
    }else{
      alert('⚠️ No se activaron los avisos del navegador. Puedes permitirlos desde el candado de la dirección del sitio.');
    }
    render();
  }catch(e){
    alert('No se pudo activar el aviso del navegador. El aviso dentro del sistema seguirá funcionando.');
  }
}
function playTeacherReminderSound26(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const ctx=new C();
    const now=ctx.currentTime;
    [0,0.22,0.44].forEach((t,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=[880,660,880][i];
      g.gain.setValueAtTime(0.0001,now+t);
      g.gain.exponentialRampToValueAtTime(0.25,now+t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,now+t+0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+t); o.stop(now+t+0.2);
    });
    setTimeout(()=>ctx.close().catch(()=>{}),900);
  }catch(e){}
}

function addTeacherReminder26(){
  const text=(document.getElementById('remText26')?.value||'').trim();
  const date=document.getElementById('remDate26')?.value||'';
  const time=document.getElementById('remTime26')?.value||'';
  const area=document.getElementById('remArea26')?.value||'General';
  const grade=document.getElementById('remGrade26')?.value||'';
  const section=document.getElementById('remSection26')?.value||'';
  if(!text||!date||!time){alert('Completa el recordatorio, la fecha y la hora.');return;}
  const due=new Date(`${date}T${time}:00`);
  if(isNaN(due.getTime())){alert('La fecha u hora no son válidas.');return;}
  if(due.getTime()<=Date.now()){alert('⚠️ Coloca una fecha y hora futuras.');return;}
  teacherReminders26().push({id:Date.now(),text,date,time,area,grade,section,done:false,notified:false});

}
function completeTeacherReminder26(id){
  const r=teacherReminders26().find(x=>String(x.id)===String(id));
  if(r){r.done=!r.done;if(r.done)r.notified=false;save();render();}
}
function checkTeacherReminders26(){
  if(!me||me.role!=='teacher') return;
  const arr=teacherReminders26(), now=new Date();
  let changed=false;
  arr.forEach(r=>{
    if(r.done||r.notified) return;
    const due=new Date(`${r.date}T${r.time}:00`);
    if(!isNaN(due.getTime()) && now.getTime()>=due.getTime()){
      r.notified=true; changed=true;
      const where=[r.area,r.grade&&('Grado '+r.grade),r.section&&('Sección '+r.section)].filter(Boolean).join(' · ');
      const title='Recordatorio docente';
      const body=(where?where+' — ':'')+r.text;

      // Aviso visual dentro de Aula EPT (si la pestaña está visible).
      showTeacherReminderAlert26(title,body);

      // Aviso del sistema: aparece aunque estés viendo OTRA PESTAÑA o
      // navegando por otra página, siempre que Aula EPT permanezca abierta
      // en alguna pestaña de este mismo navegador y los avisos estén permitidos.
      try{
        if('Notification' in window && Notification.permission==='granted'){
          const n=new Notification('🔔 '+title,{
            body,
            requireInteraction:true,
            renotify:true,
            tag:'aula-ept-reminder-'+r.id,
            icon:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" rx="24" fill="%232563eb"/><text x="64" y="82" text-anchor="middle" font-size="64">🔔</text></svg>')
          });
          n.onclick=()=>{try{window.focus();}catch(e){} try{n.close();}catch(e){}};
        }
      }catch(e){console.warn('Aula EPT: no se pudo mostrar la notificación del sistema',e);}
    }
  });
  if(changed){save();if(page==='timers')render();}
}
function teacherReminderScheduler26(){
  clearInterval(window.__teacherReminderInterval26);
  checkTeacherReminders26();
  // Se revisa periódicamente incluso cuando Aula EPT está en segundo plano.
  // El navegador puede reducir la frecuencia de los temporizadores en segundo plano;
  // por eso también se comprueba al volver a la pestaña.
  window.__teacherReminderInterval26=setInterval(checkTeacherReminders26,5000);
}

function seatLayoutKey(g,s){return `${g}|${s}`;}
function getSeatLayout(g,s){
  if(!db.seatingLayout || typeof db.seatingLayout!=="object" || Array.isArray(db.seatingLayout)) db.seatingLayout={};
  const k=seatLayoutKey(g,s);
  if(!db.seatingLayout[k] || typeof db.seatingLayout[k]!=="object") db.seatingLayout[k]={cols:6,rows:7};
  const lay=db.seatingLayout[k];
  lay.cols=Math.max(1,Math.min(12,Number(lay.cols)||6));
  lay.rows=Math.max(1,Math.min(20,Number(lay.rows)||7));

}
function setSeatLayout(){

  window.__seatCols=cols; window.__seatRows=rows; window.__seatCount=cols*rows;

function renderSeatGrid(g,s,count){
  const lay=getSeatLayout(g,s);

  while(assigned.length<total) assigned.push('');

  const assignedCount=assigned.filter(Boolean).length;
  const summary=document.getElementById('seatSummary');
  if(summary) summary.innerHTML=`<span class="seat-chip">👥 Estudiantes: ${students.length}</span><span class="seat-chip">💺 Ocupados: ${assignedCount}</span><span class="seat-chip">⭕ Sin asiento: ${free}</span><span class="seat-chip">📐 ${cols} columnas × ${rows} filas</span>`;

  let html=`<div class="seat-grid" style="grid-template-columns:repeat(${cols},minmax(130px,1fr))">`;
  for(let i=0;i<total;i++){
    const val=assigned[i]||'';

    const front=row<=Math.min(2,rows);
    html+=`<div class="seat-card">

function assignSeat(index,user){
  const g=window.__seatGrade||document.getElementById('seatGrade')?.value||'1.º';
  const s=window.__seatSection||document.getElementById('seatSection')?.value||'A';
  const arr=getSeatData(g,s);

  }

  if(grid)grid.innerHTML=renderSeatGrid(g,s,getSeatLayout(g,s).cols*getSeatLayout(g,s).rows);

function seatRows(count,cols=6){return Math.ceil(count/cols);}
function seatNeighbors(index,count,cols=6){
  const rows=seatRows(count,cols), r=Math.floor(index/cols), c=index%cols, out=[];
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dr,dc])=>{
    const rr=r+dr,cc=c+dc;
    if(rr>=0&&rr<rows&&cc>=0&&cc<cols){
      const j=rr*cols+cc;
      if(j<count)out.push(j);
    }
  });
  return out;
}
function randomSeats(){
  const g=document.getElementById('seatGrade')?.value||'1.º';
  const s=document.getElementById('seatSection')?.value||'A';
  const lay=getSeatLayout(g,s);
  const cols=lay.cols, rows=lay.rows, count=cols*rows;
  const students=[...seatStudents(g,s)];

  if(students.length>count){
    alert(`Hay ${students.length} estudiantes y solo ${count} asientos. Aumenta el número de asientos.`);
    return;
  }

  const missing=students.filter(u=>!getSeatPref(u.u).sex);
  if(missing.length){
    alert(`Falta indicar el sexo de ${missing.length} estudiante(s). Completa Varón/Mujer antes del sorteo.`);
    return;
  }

  const fixed=students.filter(u=>getSeatPref(u.u).fixed);
  // Los "fijos adelante" ocupan únicamente las primeras 2 filas (10 asientos).
  // Si hay menos de 10 asientos, se usan los disponibles de adelante.
  const frontRows=Math.min(2,rows);
  const frontLimit=Math.min(count,cols*frontRows);
  const frontSeats=Array.from({length:frontLimit},(_,i)=>i);

  if(fixed.length>frontSeats.length){
    alert(`Hay ${fixed.length} estudiantes marcados como “fijo adelante”, pero solo hay ${frontSeats.length} asientos delanteros. Marca menos estudiantes como fijos o aumenta los asientos.`);
    return;
  }

  const normal=students.filter(u=>!getSeatPref(u.u).fixed);

  // IMPORTANTE:
  // No se cancela el sorteo si hay más varones que mujeres (o viceversa).
  // Esa situación puede hacer matemáticamente imposible separar a todos.
  // En su lugar se buscan muchas distribuciones y se elige la que tenga
  // la menor cantidad posible de compañeros del mismo sexo juntos.
  function conflictScore(arr){
    let score=0, pairs=0;
    for(let i=0;i<count;i++){
      if(!arr[i])continue;
      const sex=getSeatPref(arr[i]).sex;
      for(const n of seatNeighbors(i,count,cols)){
        if(n<=i || !arr[n])continue;
        pairs++;
        if(getSeatPref(arr[n]).sex===sex) score+=1;
      }
    }
    return {score,pairs};
  }

  function shuffled(a){
    return a.slice().sort(()=>Math.random()-0.5);
  }

  function makeAttempt(){
    const arr=new Array(count).fill('');
    const freeFront=shuffled(frontSeats);

    // Colocar primero a los estudiantes con sitio fijo adelante.
    fixed.forEach((u,k)=>{
      arr[freeFront[k]]=u.u;
    });

    // Para el resto, repartir aleatoriamente intentando alternar sexo.
    const remaining=shuffled(normal);
    const empty=Array.from({length:count},(_,i)=>i).filter(i=>!arr[i]);

    // Elegir cada asiento buscando que el sexo sea diferente al de sus vecinos
    // ya colocados. Si no es posible, escoger la opción con menos conflictos.
    remaining.forEach(user=>{
      let best=[];
      let bestScore=Infinity;

      for(const pos of empty){
        if(arr[pos])continue;
        let sc=0;
        const sex=getSeatPref(user.u).sex;
        for(const n of seatNeighbors(pos,count,cols)){
          if(arr[n] && getSeatPref(arr[n]).sex===sex) sc++;
        }
        if(sc<bestScore){bestScore=sc;best=[pos];}
        else if(sc===bestScore)best.push(pos);
      }

      if(best.length){
        const pos=best[Math.floor(Math.random()*best.length)];
        arr[pos]=user.u;
        const idx=empty.indexOf(pos);
        if(idx>=0)empty.splice(idx,1);
      }
    });

    return arr;
  }

  let bestArr=null, bestScore=Infinity;

  // Muchas posibilidades para encontrar una distribución mucho mejor.
  const attempts=Math.min(3000,Math.max(500,students.length*50));
  for(let a=0;a<attempts;a++){
    const candidate=makeAttempt();
    const result=conflictScore(candidate).score;

    if(result<bestScore){
      bestScore=result;
      bestArr=candidate;
      if(bestScore===0)break;
    }
  }

  if(!bestArr){
    alert('No se pudo generar la distribución.');
    return;
  }

  db.seating[seatKey(g,s)]=bestArr;
  window.__seatGrade=g;
  window.__seatSection=s;
  window.__seatCols=cols;
  window.__seatRows=rows;
  window.__seatCount=count;
  save();

  const grid=document.getElementById('seatGrid');
  if(grid)grid.innerHTML=renderSeatGrid(g,s,count);

  const result=conflictScore(bestArr);
  if(result.score===0){
    alert('✅ Sorteo realizado. Los estudiantes fijos quedaron adelante y se logró separar varones y mujeres en los asientos adyacentes.');
  }else{
    alert(`✅ Sorteo realizado. Los estudiantes fijos quedaron adelante. Se buscó la mejor distribución posible; quedaron ${result.score} pares de estudiantes del mismo sexo juntos porque la cantidad de varones/mujeres puede hacer imposible separarlos a todos.`);
  }
}

function randomGroups30(){
  ensureClassData();
  const gradeEl=document.getElementById('gpGrade30');
  const secEl=document.getElementById('gpSec30');
  const g=gradeEl?.value;
  const s=secEl?.value;
  const n=Math.max(1,Math.min(20,Number(document.getElementById('gpCount30')?.value)||4));
  if(!g||!s){alert('Selecciona primero grado y sección.');return}

  // IMPORTANTE: cada clic vuelve a sortear SOLAMENTE el aula seleccionada.
  // No se vuelve a pedir grado/sección y no se mezcla con otros grados.
  const a=db.users.filter(u=>u.role==='student'&&u.grade===g&&u.section===s);
  if(!a.length){alert(`No hay estudiantes registrados en ${g} ${s}.`);return}

  window.__lastRaffleGrade30=g;
  window.__lastRaffleSection30=s;
  window.__lastRaffleCount30=n;
  window.__raffleCount=(window.__raffleCount||0)+1;

  const ng=Math.min(n,a.length);
  const grupos=Array.from({length:ng},(_,i)=>({
    id:'grp_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7),
    name:'Grupo '+(i+1), grade:g, section:s, members:[]
  }));

  // Mezcla únicamente a los estudiantes de grado + sección seleccionados.
  const shuffled=[...a];
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  shuffled.forEach((u,i)=>grupos[i%grupos.length].members.push(u.u));

  // Reemplaza únicamente los grupos de ESTE grado/sección.
  db.groups=db.groups.filter(x=>!(x.grade===g&&x.section===s));
  db.groups.push(...grupos);
  save();

  // NO usamos render(): así el grado y sección quedan seleccionados.
  // Solo actualizamos la zona de resultados.
  const box=document.getElementById('groupsResults30');
  if(box) box.innerHTML=renderGroups30();

  // Dejamos explícitamente los selectores en el valor elegido.
  if(gradeEl) gradeEl.value=g;
  if(secEl) secEl.value=s;
}

}
function pwLockedCondition(user,activityId){
  const m=pwMembers(activityId);
  if(m.g1.includes(user.u))return 'grupo1';
  if(m.g2.includes(user.u))return 'grupo2';
  return 'apoyo';
}
function configurePWMembers(){
  ensureClassData();
  const id=window.pwActivity;
  if(!id){alert('Primero crea o selecciona una actividad.');return;}
  const grade=window.pwGrade||'2.º',section=window.pwSection||'A';
  const students=(db.users||[]).filter(u=>u.role==='student'&&u.grade===grade&&u.section===section&&!studentIsRetired31(u)).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(!students.length){alert('No hay estudiantes disponibles en esta aula.');return;}
  const base=pwActivityBase(id), old1=Array.isArray(base.group1Members)?base.group1Members:[], old2=Array.isArray(base.group2Members)?base.group2Members:[];
  const listing=students.map((u,i)=>`${i+1}. ${u.name}`).join('\n');
  const ask=(label,old)=>{
    const nums=old.map(x=>students.findIndex(u=>u.u===x)+1).filter(n=>n>0).join(',');
    const ans=prompt(`${label}\n\nEscribe los números de los integrantes separados por coma (máximo 5).\n\n${listing}\n\nActual: ${nums||'ninguno'}`,nums);
    if(ans===null)return null;
    const arr=[...new Set(ans.split(',').map(x=>parseInt(x.trim(),10)).filter(n=>n>=1&&n<=students.length))];
    if(arr.length>5){alert('Cada grupo puede tener máximo 5 integrantes.');return ask(label,old);}
    return arr.map(n=>students[n-1].u);
  };
  const g1=ask('👥 INTEGRANTES DEL GRUPO 1',old1); if(g1===null)return;
  const g2=ask('👥 INTEGRANTES DEL GRUPO 2',old2); if(g2===null)return;
  const overlap=g1.filter(u=>g2.includes(u));
  if(overlap.length){alert('Un estudiante no puede pertenecer a los dos grupos.');return;}
  (db.projectWork||[]).forEach(r=>{if(r.activityId===id){r.group1Members=g1.slice();r.group2Members=g2.slice();
    if(g1.includes(r.user))r.condition='grupo1'; else if(g2.includes(r.user))r.condition='grupo2'; else r.condition='apoyo';
    if(r.condition==='grupo1'&&r.project1)r.project='p1'; else if(r.condition==='grupo2'&&r.project2)r.project='p2';
  }});
  save();render();
}
function resetProjectWorkRow(i){

  const u=students[i];if(!u||studentIsRetired31(u))return;

}

    <div style="margin-top:12px"><label>Actividad / avance del proyecto</label><input id="pwTitle" value="${escClass(title)}" oninput="window.pwTitleValue=this.value" placeholder="Ej.: Avance del prototipo y organización de materiales"></div>

    <div style="margin-top:12px"><label>Actividades registradas</label><select id="pwActivitySelect" onchange="selectPWActivity(this.value)"><option value="">— Nueva actividad —</option>${activities.map(id=>{const x=(db.projectWork||[]).find(r=>r.activityId===id);return `<option value="${escClass(id)}" ${id===activityId?'selected':''}>${escClass(x?.title||'Actividad')} · ${escClass(x?.date||'')}</option>`}).join('')}</select></div>

    <div style="overflow:auto;margin-top:18px"><table><tr><th>Estudiante</th><th>Condición</th><th>Proyecto</th><th>Materiales</th><th>Participación / aporte</th><th>Observación</th><th>Nota</th><th></th></tr>${activityId?rows:'<tr><td colspan="9" style="text-align:center;padding:20px">Selecciona o crea una actividad para registrar el trabajo.</td></tr>'}</table></div>

    <div style="margin-top:14px"><h3>📊 Promedio de trabajo de proyecto</h3><div style="overflow:auto"><table><tr><th>Estudiante</th><th>Actividades registradas</th><th>Promedio</th></tr>${students.map(u=>{const rs=(db.projectWork||[]).filter(r=>r.user===u.u&&r.grade===grade&&r.section===section&&Number.isFinite(Number(r.score)));const av=avgNums(rs.map(r=>Number(r.score)));return `<tr><td>${escClass(u.name)}${studentIsRetired31(u)?' ⚫ RETIRADO':''}</td><td>${rs.length}</td><td><b>${av===null?'—':av.toFixed(2)}</b></td></tr>`}).join('')}</table></div></div>
  </div>`;
}

function saveProjectWorkRow(i){

function creaEmprende(){

    .filter(u=>u.role==='student' && u.grade===grade && u.section===section)

function autoSaveCY(encodedUsername,rowIndex){
  ensureClassData();

  const username=decodeURIComponent(encodedUsername||'');
  const student=(db.users||[]).find(u=>u.role==='student'&&u.u===username);
  if(!student)return;

  const grade=document.getElementById('cyGrade')?.value||window.cyGrade||student.grade||'1.º';
  const section=document.getElementById('cySection')?.value||window.cySection||student.section||'A';
  const stage=document.getElementById('cyStage')?.value.trim()||window.cyStage||'Etapa institucional';
  const status=document.getElementById('cyStatus_'+rowIndex)?.value||'';
  const project=document.getElementById('cyProject_'+rowIndex)?.value.trim()||'';
  const reason=document.getElementById('cyReason_'+rowIndex)?.value||'';
  const detail=document.getElementById('cyDetail_'+rowIndex)?.value.trim()||'';

  // Guardado automático REAL: permite guardar también cuando el
  // usuario todavía está completando los campos.
  let r=(db.creaEmprende||[]).find(x=>
    x.grade===grade &&
    x.section===section &&
    x.stage===stage &&
    (x.studentKey===username || x.username===username ||
     (x.studentId!=null && x.studentId===student.id))
  );

  if(!r){
    r={
      id:'cy_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      studentKey:username,
      username,
      studentId:student.id??null,
      studentName:student.name||'',
      grade,
      section,
      stage
    };
    db.creaEmprende.push(r);
  }else{
    r.studentKey=username;
    r.username=username;
    r.studentId=student.id??r.studentId??null;
    r.studentName=student.name||r.studentName||'';
    r.grade=grade;
    r.section=section;
    r.stage=stage;
  }

  r.status=status;
  r.project=project;
  r.reason=status==='no participó'?reason:'';
  r.detail=detail;
  r.updatedAt=new Date().toISOString();

  window.cyGrade=grade;
  window.cySection=section;
  window.cyStage=stage;

  // Guarda en localStorage y Firebase, pero NO ejecuta render(),
  // por lo que la fila permanece en pantalla.
  save();
}

function sessionGroupForGrade(g){
  g=String(g||'').trim();
  if(g==='1.º'||g==='2.º') return g;
  if(g==='3.º'||g==='4.º'||g==='5.º') return '3.º-5.º';
  return g;
}
function sessionDateForGradeSection(s,grade,section){
  if(!s)return '';
  const g=String(grade||'').trim(), sec=String(section||'').trim();
  const map=s.dateByGradeSection||{};
  const key=g+'|'+sec;
  // Si la sesión ya tiene fechas independientes por grado y sección,
  // SOLO se usa la fecha exacta de esa combinación. No se copia la fecha
  // de A a B ni la de otro grado.
  if(Object.keys(map).length>0) return map[key]?String(map[key]):'';
  // Compatibilidad únicamente con sesiones antiguas que no tenían
  // fechas independientes por sección.
  const old=s.dateByGrade||{};
  if(g && old[g]) return String(old[g]);
  return String(s.date||'');
}
function sessionDateEntries(s){
  if(!s)return [];
  const map=s.dateByGradeSection||{};
  const vals=[];
  [['3.º','A'],['3.º','B'],['4.º','A'],['4.º','B'],['5.º','A'],['5.º','B']].forEach(([g,sec])=>{
    const v=map[g+'|'+sec]; if(v) vals.push({label:`${g} ${sec}`,date:String(v)});
  });
  if(vals.length)return vals;
  const old=s.dateByGrade||{};
  const oldVals=['3.º','4.º','5.º'].filter(g=>old[g]).map(g=>({label:g,date:String(old[g])}));
  if(oldVals.length)return oldVals;
  return s.date?[{label:'Fecha general',date:String(s.date)}]:[];
}
function sessionDatesLabel(s){
  const vals=sessionDateEntries(s);
  return vals.length?vals.map(x=>`${x.label}: ${x.date}`).join(' · '):'Sin fecha';
}
function sessionDatesSummary(s){
  const vals=sessionDateEntries(s);
  if(!vals.length)return 'Sin fecha';
  return `${vals.length} registrada${vals.length===1?'':'s'}`;
}
function toggleSessionDates(id){
  const el=document.getElementById('sessionDates_'+id);
  const btn=document.getElementById('sessionDatesBtn_'+id);
  if(!el||!btn)return;
  const hidden=el.style.display==='none';

}
function isFirstSecondSessionGroup(g){
  return ['1.º A','1.º B','2.º A','2.º B'].includes(String(g||''));
}
function sessionAppliesToGrade(s,g,section){
  const sg=String(s.grade||'').trim();
  const sec=String(s.section||'').trim();
  const target=String(g||'').trim();
  const targetSec=String(section||'').trim();

  // 1.º y 2.º: mostrar únicamente las sesiones creadas para ese grado/sección.
  // Las sesiones antiguas "1.º-2.º" siguen siendo compartidas y se muestran
  // en ambos grados porque no tienen una sección propia.
  if(target==='1.º'||target==='2.º'){
    if(sg===target) return !targetSec || !sec || sec===targetSec;
    if(sg==='1.º-2.º') return true;
    return false;
  }

  // 3.º, 4.º y 5.º: las sesiones compartidas "3.º-5.º" pueden tener
  // una fecha independiente para cada grado/sección. Si existe ese mapa,
  // solo se muestra cuando existe fecha para la combinación elegida.
  // Si la sesión es antigua y no tiene mapa, sigue siendo compartida.
  if(['3.º','4.º','5.º'].includes(target)){
    if(sg===target) return !targetSec || !sec || sec===targetSec;
    if(sg==='3.º-5.º'){
      const map=s.dateByGradeSection||{};
      if(Object.keys(map).length>0) return !!map[target+'|'+targetSec];
      return true;
    }
    return false;
  }

  return sg===target && (!targetSec || !sec || sec===targetSec);
}

  const g=String(x.grade||'').trim();
  if(g==='1.º'||g==='2.º') return `${g}${x.section?' '+x.section:''}`;

  if(g==='3.º-5.º') return '3.º, 4.º y 5.º';

function nextSessionNumber26(unitId, selectedGroup){
  const legacyGrade = selectedGroup==='3.º-5.º' ? '3.º-5.º' : null;
  let nums=[];
  (db.sessions||[]).filter(s=>s.unit===unitId).forEach(s=>{
    if(isFirstSecondSessionGroup(selectedGroup)){
      const [gr,se]=selectedGroup.split(' ');
      if(String(s.grade)===gr && String(s.section||'')===se) nums.push(Number(s.number)||0);
    }else if(legacyGrade && String(s.grade)==='3.º-5.º'){
      nums.push(Number(s.number)||0);
    }
  });
  return (Math.max(0,...nums)+1);
}

function recoveries31(){
  ensureClassData();
  const students=(db.users||[]).filter(u=>u.role==='student');
  const reconsidered=students.filter(u=>u.attendanceReconsidered===true&&studentAbsenceCount31(u.u)>=5);
  const recoveryRecords=Array.isArray(db.classRecoveries)?db.classRecoveries:[];
  const classRecords=Array.isArray(db.classRecords)?db.classRecords:[];
  const rows=reconsidered.map((u,i)=>{
    const abs=studentAbsenceCount31(u.u);
    const relevantClasses=classRecords.filter(r=>String(r.grade)===String(u.grade)&&String(r.section)===String(u.section));
    let pending=0,done=0;
    relevantClasses.forEach(r=>{
      const att=attendanceStatusForDateUser(classAttendanceDate30(r),u);if(!attendanceNeedsRecovery(att))return;
      const rr=recoveryRecords.find(x=>String(x.classId)===String(r.id)&&x.user===u.u);
      if(rr&&rr.grade!==null&&rr.grade!==undefined&&rr.grade!=='')done++;else pending++;
    });
    const current=finalGrade(u.u),level=current===null?'—':classLevel(current);
    return `<tr><td>${i+1}</td><td><b>${escClass(u.name||u.u)}</b><div class="muted">${escClass(u.grade||'')} · ${escClass(u.section||'')}</div></td><td><b>${abs}</b></td><td>${done}</td><td>${pending}</td><td>${current===null?'—':Number(current).toFixed(2)}</td><td>${level}</td><td><button class="small" onclick="openStudentRecovery31('${escClass(u.u)}')">👁️ Ver recuperación</button></td></tr>`;
  }).join('');
  const allPending=[];
  reconsidered.forEach(u=>classRecords.filter(r=>String(r.grade)===String(u.grade)&&String(r.section)===String(u.section)).forEach(r=>{
    const att=attendanceStatusForDateUser(classAttendanceDate30(r),u);if(!attendanceNeedsRecovery(att))return;
    const rr=recoveryRecords.find(x=>String(x.classId)===String(r.id)&&x.user===u.u);
    if(!rr||rr.grade===null||rr.grade===undefined||rr.grade==='')allPending.push({u,r,att});
  }));
  const detailRows=allPending.slice(0,80).map(x=>`<tr><td><b>${escClass(x.u.name||x.u.u)}</b></td><td>${escClass(x.u.grade)} · ${escClass(x.u.section)}</td><td>${escClass(x.r.title||'Sesión')}</td><td>${escClass(attendanceStatusLabel(x.att))}</td><td><button class="secondary small" onclick="goRecoverySession31('${escClass(x.r.id)}')">📝 Ir a sesión</button></td></tr>`).join('');
  return `<div class="card"><h2>📝 Recuperaciones</h2><p class="muted">Aquí puedes ver a los estudiantes a quienes se les dio una oportunidad de recuperación por tener 5 o más faltas y controlar qué trabajos, actividades o evaluaciones siguen pendientes.</p><div class="alert"><b>Importante:</b> dar la oportunidad de recuperación <b>no asigna una nota automática</b>. Las faltas permanecen registradas. El estudiante debe recuperar y la nota obtenida se incorpora a su evaluación. Para estos casos el resultado final tiene como máximo <b>B (14)</b>.</div><h3>👥 Estudiantes reconsiderados</h3><div style="overflow:auto"><table><tr><th>N.º</th><th>Estudiante</th><th>Faltas</th><th>Recuperadas</th><th>Pendientes</th><th>Resultado actual</th><th>Nivel</th><th></th></tr>${rows||'<tr><td colspan="8">No hay estudiantes con oportunidad de recuperación.</td></tr>'}</table></div><h3 style="margin-top:22px">⏳ Pendientes por recuperar</h3><div style="overflow:auto"><table><tr><th>Estudiante</th><th>Aula</th><th>Sesión / trabajo</th><th>Motivo</th><th></th></tr>${detailRows||'<tr><td colspan="5">✅ No hay recuperaciones pendientes de estudiantes reconsiderados.</td></tr>'}</table></div></div>`;
}

function getCreaRecoveryExistingGroups31(grade,sec){
  ensureClassData();
  const ng=normalizeGradeCY30(grade), ns=normalizeSectionCY30(sec);
  const students=(db.users||[]).filter(u=>u.role==='student'&&normalizeGradeCY30(u.grade)===ng&&normalizeSectionCY30(u.section)===ns);
  const studentMap=new Map(students.map(u=>[String(u.u||''),u]));
  const records=(db.creaEmprende||[]).filter(r=>normalizeGradeCY30(r.grade)===ng&&normalizeSectionCY30(r.section)===ns);
  const map=new Map();
  records.forEach(r=>{
    const project=String(r.project||r.detail||'').trim();
    if(!project)return;
    const key=project.toLocaleLowerCase().replace(/\s+/g,' ').trim();
    if(!map.has(key)){
      const safeKey=ng+'|'+ns+'|'+key;
      map.set(key,{id:'cygrp_'+btoa(unescape(encodeURIComponent(safeKey))).replace(/[^a-zA-Z0-9_-]/g,''),name:project,grade,section:sec,stage:r.stage||'Etapa institucional',source:'Crea y Emprende',members:[]});
    }
    const g=map.get(key);
    const username=String(r.studentKey||r.username||'');
    let st=studentMap.get(username);
    if(!st&&r.studentId!=null)st=students.find(u=>String(u.id)===String(r.studentId));
    if(st&&!g.members.some(x=>x.u===st.u))g.members.push(st);
  });
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'es'));
}
function getCreaRecoveryGroups31(grade,sec){
  ensureClassData();
  const out=getCreaRecoveryExistingGroups31(grade,sec);
  const ng=normalizeGradeCY30(grade),ns=normalizeSectionCY30(sec);
  const custom=(db.creaRecoveryGroups||[]).filter(g=>normalizeGradeCY30(g.grade)===ng&&normalizeSectionCY30(g.section)===ns).map(g=>({
    ...g,source:'Grupo de recuperación',members:(g.memberUsers||[]).map(id=>{
      const user=(db.users||[]).find(u=>u.role==='student'&&String(u.u)===String(id));
      return user||null;

  return out.concat(custom).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es'));
}

function createCreaRecoveryGroupFromManager31(){
  ensureClassData();
  const name=document.getElementById('recGrpName31')?.value.trim()||'';
  const grade=document.getElementById('recGrpGrade31')?.value||'';
  const section=document.getElementById('recGrpSection31')?.value||'';
  const members=[...document.querySelectorAll('.creaRecManagerMember31:checked')].map(x=>x.value).filter(Boolean);
  if(!name){alert('Escribe el nombre del grupo o proyecto.');return;}
  if(!Array.isArray(db.creaRecoveryGroups))db.creaRecoveryGroups=[];
  const id='reccgrp_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  const institutionalUsers=new Set((db.users||[]).filter(u=>u.role==='student'&&creaInstitutionalParticipant31(u)).map(u=>String(u.u)));
  const uniqueMembers=[...new Set(members)].filter(x=>!institutionalUsers.has(String(x)));
  db.creaRecoveryGroups.push({id,name,grade,section,memberUsers:uniqueMembers,createdAt:Date.now(),source:'Grupo de recuperación'});
  // Los estudiantes que se seleccionan para un grupo nuevo quedan habilitados
  // automáticamente para Recuperación Crea. No se deshabilita a ningún otro
  // estudiante, porque podría pertenecer a otra modalidad de recuperación.
  (db.users||[]).filter(u=>u.role==='student').forEach(u=>{
    if(uniqueMembers.includes(String(u.u)))u.creaRecovery=true;
  });
  save();
  alert(`✅ Grupo de recuperación creado: ${name}\nIntegrantes iniciales: ${members.length}${members.length?'':'\nPuedes agregar estudiantes después desde su evaluación.'}`);
  openCreaRecoveryGroupManager31();
}

function saveCreaRecoveryGroupMembers31(groupId){

function openCreaRecoveryEval31(user){
  ensureClassData();
  const st=(db.users||[]).find(x=>x.u===user);
  if(!st)return;
  if(st.creaRecovery!==true){alert('Este estudiante no está marcado para Recuperación pedagógica de Crea y Emprende.');return;}
  const cat=categoryForStudent(st);
  const manualPc=CREA_RECOVERY_PORTFOLIO_CRITERIA31||[];
  const contestPc=db.projectRubrics[cat+'_portfolio']||[];
  const expoCriteria=CREA_EXPO_CRITERIA30||[];
  let existing=(db.creaRecoveryEvaluations||[]).find(x=>x.user===user)||{};
  // Compatibilidad para estudiantes ya marcados como recuperación antes de activar
  // el traslado automático: si tenían una evaluación de Portafolio en el seguimiento semanal,
  // trasladamos tanto la nota /20 como los niveles 1–4 de cada criterio del concurso.
  const normalWeekly=(db.projectWeeklyGrades||[]).filter(x=>x.user===user);
  const normalPc=db.projectRubrics[cat+'_portfolio']||[];
  // Buscar la evaluación histórica aunque la rúbrica actual tenga más criterios.
  // Lo importante para trasladar es que el registro original conserve sus niveles 1–4.
  const weeklyPortfolioRecords=normalWeekly.map(x=>({
    record:x,
    score:projectRubricScore(x.portfolioLevels,Array.isArray(x.portfolioLevels)?x.portfolioLevels.length:0)
  })).filter(x=>x.score!==null && Array.isArray(x.record.portfolioLevels) && x.record.portfolioLevels.some(v=>/^[1-4]$/.test(String(v))));
  const weeklyPortfolioValues=weeklyPortfolioRecords.map(x=>Number(x.score)).filter(Number.isFinite);
  let transferVals=weeklyPortfolioValues.slice();
  if(!transferVals.length){
    transferVals=(db.projectGrades||[]).filter(x=>x.user===user&&x.portfolio!==''&&x.portfolio!=null).map(x=>Number(x.portfolio)).filter(Number.isFinite);
  }
  const transferPortfolio=avgNums(transferVals);
  const exactSource=weeklyPortfolioRecords.find(x=>Math.abs(Number(x.score)-Number(transferPortfolio))<0.0001);
  const fallbackSource=weeklyPortfolioRecords.slice().sort((a,b)=>Number(b.record.savedAt||0)-Number(a.record.savedAt||0))[0];
  const transferSource=exactSource||fallbackSource;
  const transferLevels=transferSource?transferSource.record.portfolioLevels.map(v=>{
    const sv=String(v??'').trim();
    return /^[1-4]$/.test(sv)?Number(sv):sv;
  }):[];
  // La rúbrica de categoría B puede haber sido ampliada después de que se evaluó
  // al estudiante. Conservamos la cantidad de criterios que realmente existía
  // en la evaluación histórica y no inventamos niveles para criterios nuevos.
  const transferCriterionCount=transferLevels.length;

  // Caso 1: todavía no existe nota en Recuperación: crear el registro y trasladar nota + criterios.
  if((existing.portfolio===undefined||existing.portfolio===null||existing.portfolio==='') && existing.portfolioImportedFromWeekly!==true){
    if(Number.isFinite(Number(transferPortfolio))){
      if(!existing.user){
        existing={id:'crec_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),user};
        if(!Array.isArray(db.creaRecoveryEvaluations))db.creaRecoveryEvaluations=[];

      }
      existing.category=cat;
      existing.mode='recuperacion_pedagogica';
      existing.portfolio=Number(transferPortfolio);
      existing.portfolioLevels=transferLevels.slice();
      existing.portfolioImportedCriterionCount=transferCriterionCount;
      existing.portfolioImportedRubricLength=normalPc.length;
      existing.portfolioEvaluatedCriteria=transferLevels.filter(v=>/^[1-4]$/.test(String(v))).length;
      existing.portfolioNotDevelopedCriteria=transferLevels.filter(v=>String(v)==='ND').length;
      existing.portfolioImportedFromWeekly=true;
      existing.portfolioImportedAt=Date.now();
      existing.portfolioSource='Seguimiento semanal — Portafolio (criterios del concurso)';
      existing.portfolioRubricMode='concurso';
      existing.savedAt=Date.now();
      save();

  }

  // Caso 2: el traslado ya ocurrió con una versión anterior del sistema que guardaba
  // solo la nota. Recuperamos ahora los niveles si todavía no estaban almacenados.
  if(existing.portfolioImportedFromWeekly===true && Number.isFinite(Number(existing.portfolio)) && transferSource){
    const storedLevels=Array.isArray(existing.portfolioLevels)?existing.portfolioLevels:[];
    // Recuperar los niveles históricos solo cuando realmente no fueron guardados.
    // No reemplazar una rúbrica de 12 criterios que el docente ya haya abierto y completado
    // parcialmente, porque los criterios nuevos deben quedar disponibles para evaluarlos.
    if(storedLevels.length===0){
      existing.portfolioLevels=transferLevels.slice();

      existing.portfolioImportedRubricLength=normalPc.length;
      existing.portfolioEvaluatedCriteria=transferLevels.filter(v=>/^[1-4]$/.test(String(v))).length;
      existing.portfolioNotDevelopedCriteria=transferLevels.filter(v=>String(v)==='ND').length;
      existing.portfolioSource='Seguimiento semanal — Portafolio (criterios del concurso)';
      existing.portfolioRubricMode='concurso';
      existing.savedAt=Date.now();
      save();
    }
  }
  const importedPortfolio=existing.portfolioImportedFromWeekly===true && Number.isFinite(Number(existing.portfolio));
  const importedPortfolioValue=importedPortfolio?Number(existing.portfolio):null;
  const initialMode=creaRecoveryPortfolioMode31(st,existing);
  if(!st.creaRecoveryPortfolioMode){st.creaRecoveryPortfolioMode=initialMode;try{save();}catch(e){}}
  const portfolioMode=creaRecoveryPortfolioMode31(st,existing);
  const recoveryMode=existing.creaRecoveryMode==='grupal'?'grupal':'individual';
  const selectedRecoveryGroupId=existing.creaRecoveryGroupId||'';
  const recoveryGroups=getCreaRecoveryGroups31(st.grade,st.section);
  const recoveryExpoCriteria=recoveryExpoCriteria31(recoveryMode);
  const pc=portfolioMode==='concurso'?contestPc:manualPc;
  const productCriteria=db.projectRubrics[cat+'_product']||[];
  const productLevels=Array.isArray(existing.productLevels)&&existing.productLevels.length===productCriteria.length?existing.productLevels:[];
  const productPresented=existing.productPresented===true || (existing.product!==null&&existing.product!==undefined);
  // Si existe una evaluación antigua con otra cantidad de criterios, no reutilizar
  // posiciones para evitar que un puntaje quede asociado a un criterio distinto.
  let pLevels=[];
  if(portfolioMode==='manual' && Array.isArray(existing.portfolioLevels)){
    if(existing.portfolioLevels.length===manualPc.length){
      pLevels=existing.portfolioLevels;
    }else if(existing.portfolioLevels.length===6 && manualPc.length===5){
      // Compatibilidad: versión anterior tenía duplicado el criterio de problema.

  }).join('');
  const erow=recoveryExpoCriteria.map((c,i)=>`<div class="item" style="margin:8px 0"><div><b>${i+1}. ${escClass(c.name)}</b></div><select class="creaRecEL31" data-i="${i}"><option value="">Seleccionar puntaje</option>${[1,2,3,4].map(n=>`<option value="${n}" ${Number(eLevels[i])===n?'selected':''}>${n} punto(s)</option>`).join('')}</select></div>`).join('');
  const prodrow=productCriteria.map((c,i)=>`<div class="item creaRecProductBox31" style="margin:8px 0;${productPresented?'':'display:none;'}"><div><b>${i+1}. ${escClass(c)}</b></div><select class="creaRecPR31" data-i="${i}"><option value="">Seleccionar nivel</option>${[1,2,3,4].map(n=>`<option value="${n}" ${Number(productLevels[i])===n?'selected':''}>Nivel ${n} — ${n} punto(s)</option>`).join('')}</select></div>`).join('');

    <h3 style="margin-top:20px">👥 Modalidad de recuperación</h3><div class="card" style="background:#f8fafc;border:1px solid #cbd5e1"><label>¿Cómo presenta el proyecto?</label><select id="creaRecMode31" onchange="refreshCreaRecoveryGroupUI31('${escClass(user)}')"><option value="individual" ${recoveryMode==='individual'?'selected':''}>👤 Individual — trabaja y expone solo(a)</option><option value="grupal" ${recoveryMode==='grupal'?'selected':''}>👥 Grupal — trabaja y/o expone con un equipo</option></select><div id="creaRecGroupBox31" style="margin-top:10px;${recoveryMode==='grupal'?'':'display:none;'}"><label>Grupo de recuperación</label><select id="creaRecGroup31" onchange="refreshCreaRecoveryGroupUI31('${escClass(user)}')"><option value="">Seleccionar grupo</option>${recoveryGroups.map(g=>`<option value="${escClass(g.id)}" ${String(selectedRecoveryGroupId)===String(g.id)?'selected':''}>${escClass(g.name)} · ${g.source==='Grupo de recuperación'?'grupo creado para recuperación':'grupo existente de Crea y Emprende'}</option>`).join('')}</select><div id="creaRecGroupPreview31" class="muted" style="margin-top:8px"></div><div class="muted" style="margin-top:8px">📌 Los grupos nuevos no se crean desde la ficha de Ana ni desde otro estudiante. Usa <b>“👥 Administrar grupos de recuperación”</b> en la pantalla principal y luego selecciona aquí el grupo.</div></div><div id="creaRecModeHint31" class="muted" style="margin-top:8px">${recoveryMode==='grupal'?'👥 Se utilizará la rúbrica de exposición grupal: “Organización del equipo emprendedor”.':'👤 Se utilizará la rúbrica de exposición individual: “Organización del trabajo emprendedor”.'}</div></div><p class="muted">${portfolioMode==='concurso'?'<b>Rúbrica del concurso.</b> Esta estudiante será evaluada con los criterios oficiales de su categoría, no con la rúbrica manual de recuperación.':'<b>Rúbrica específica de recuperación.</b> Evalúa únicamente lo que realmente desarrollaron contigo. Cuando un criterio no fue trabajado en la recuperación, selecciona <b>“No desarrollado / no trabajado en aula”</b>; ese criterio queda fuera del cálculo y <b>no perjudica al estudiante</b>.'} Resultado sobre 20.</p>${importedPortfolio?`<div class="card" style="background:#ecfdf5;border:1px solid #86efac"><b>📌 Evaluación trasladada del seguimiento semanal: ${importedPortfolioValue.toFixed(2)} / 20</b><div class="muted" style="margin-top:4px">Se trasladaron también los <b>niveles de los criterios del concurso</b> que ya habías registrado. ${importedHistorical?'La evaluación original tenía '+importedCount+' criterios; los criterios añadidos posteriormente aparecen como “No evaluado en la evaluación original” y no cambian la nota histórica.':'La rúbrica aparece marcada abajo con esos niveles; no necesitas volver a evaluarla para conservar la calificación.'} Puedes modificarlos si corresponde.</div></div>`:''}${prow}<div class="card" style="background:#eff6ff"><b>Portafolio: <span id="creaRecP31">—</span> / 20</b><div class="muted" style="margin-top:4px">${portfolioMode==='concurso'?'Se usan únicamente los criterios del concurso de la categoría del estudiante.':'Los criterios “No desarrollado” no suman puntos ni bajan el resultado. Esta rúbrica es exclusiva de la recuperación.'}</div></div>

    <div class="card" style="margin-top:15px;background:#fff7ed;border:1px solid #fed7aa"><b>📊 Regla</b><div class="muted">Portafolio + Exposición son obligatorios. Si no hay Producto, Proyecto = Portafolio 30% + Exposición 40%, normalizado sobre 70%. Si hay Producto, se incorpora con 30%. En ambos casos el máximo es <b>14 puntos (B)</b>.</div></div>
