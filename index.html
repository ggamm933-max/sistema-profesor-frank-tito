const seed = {
 users:[

};
let db=JSON.parse(localStorage.getItem("aulaEPT")||JSON.stringify(seed));
let me=null, page="home";
function save(){
  localStorage.setItem("aulaEPT",JSON.stringify(db));
  if(typeof saveToFirebase === "function") saveToFirebase();
}

/* ===== SINCRONIZACIÓN FIREBASE ===== */
const FIREBASE_DOCUMENT = "aulaEPT/main";

async function saveToFirebase(){
  try{
    if(!window.firebaseReady) return;
    await window.firebaseSetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
      { data: db, updatedAt: Date.now() }
    );
  }catch(error){
    console.error("Firebase: no se pudo guardar", error);
  }
}

async function loadFromFirebase(){
  try{
    if(!window.firebaseReady) return false;
    const snap = await window.firebaseGetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main")
    );
    if(snap.exists() && snap.data().data){
      db = snap.data().data;
      localStorage.setItem("aulaEPT", JSON.stringify(db));
      if(typeof render === "function") render();
      return true;
    }
  }catch(error){
    console.error("Firebase: no se pudo cargar", error);
  }
  return false;
}

let firebaseUnsubscribe=null;

function startFirebaseSync(){
  if(!window.firebaseReady) return;
  try{
    if(typeof firebaseUnsubscribe === "function") firebaseUnsubscribe();
    firebaseUnsubscribe=window.firebaseOnSnapshot(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
      (snap)=>{
        if(snap.exists() && snap.data().data){
          db=snap.data().data;
          localStorage.setItem("aulaEPT",JSON.stringify(db));
          // Actualiza también una conversación abierta en ese mismo instante.
          if(window.__openChat22 && typeof openChat22 === "function" && me){
            openChat22(window.__openChat22);
          }else if(typeof render === "function" && me){
            render();
          }
        }
      },
      (error)=>console.error("Firebase: error de sincronización",error)
    );
  }catch(error){
    console.error("Firebase: no se pudo iniciar la sincronización",error);
  }
}

window.addEventListener("firebase-ready", async ()=>{
  const exists = await loadFromFirebase();
  if(!exists) await saveToFirebase();
  startFirebaseSync();
});

function refreshDB29(){
 try{
  const raw=localStorage.getItem("aulaEPT");

   const fresh=JSON.parse(raw);
   if(fresh && typeof fresh==="object"){db=fresh; if(me&&db.users){const updated=db.users.find(u=>u.u===me.u); if(updated)me=updated;}}

}

function normalizeStudentPassword(u){

 return u;
}
function login(){
 const u=username.value.trim(), p=password.value;

 me=x; localStorage.setItem("session",x.u); start();

function start(){

function logout(ev){
  try{
    if(ev){ev.preventDefault();ev.stopPropagation();}
  }catch(e){}
  me=null;
  page="home";
  localStorage.removeItem("session");
  const appEl=document.getElementById("app");
  const loginEl=document.getElementById("login");
  const userEl=document.getElementById("currentUser");
  if(appEl) appEl.classList.add("hidden");
  if(loginEl) loginEl.classList.remove("hidden");
  if(userEl) userEl.textContent="";
  const userInput=document.getElementById("username");
  const passInput=document.getElementById("password");
  if(userInput) userInput.value="";
  if(passInput) passInput.value="";
  try{window.scrollTo(0,0);}catch(e){}
}

  const b=a=>`<button class="${page===a[0]?'active':''}" onclick="go('${a[0]}')">${a[1]} <span>${a[2]}</span></button>`;

    `<button class="nav-group-toggle" onclick="toggleEvalMenu()">📊 <span>Evaluación 30 %</span></button>`+
    `<div id="evalMenu" class="nav-sub" style="display:block">${process.map(b).join('')}</div>`+

}

function importStudents(){
 const raw=document.getElementById("importData").value.trim(); if(!raw){alert("Pega primero los datos de Excel.");return}
 let added=0,updated=0,skipped=0;
 raw.split(/\r?\n/).filter(x=>x.trim()).forEach((line,i)=>{
  const c=line.split(/\t/).map(x=>x.trim()); if(c.length<5){skipped++;return}
  let [name,user,pass,grade,section]=c;
  if(i===0 && /apellidos/i.test(name))return;
  grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º");section=section.toUpperCase();
  if(!name||!user||!pass||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
  const ex=db.users.find(x=>x.u===user);
  if(ex&&ex.role==="student"){ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++}
  else if(!ex){db.users.push({id:Date.now()+Math.random(),u:user,p:pass,role:"student",name,grade,section});added++}
  else skipped++;
 });
 save();closeModal();render();alert(`Importación terminada.\n\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
}
function exportStudents(){
 const rows=[["Apellidos y nombres","Usuario","Contraseña","Grado","Sección"]];
 db.users.filter(x=>x.role==="student").forEach(u=>rows.push([u.name,u.u,u.p,u.grade||"",u.section||""]));
 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="Estudiantes_Aula_EPT_2026.csv";a.click();URL.revokeObjectURL(a.href);
}

function importStudents(){
 const raw=document.getElementById("importData").value.trim(); if(!raw){alert("Pega primero los datos de Excel.");return}
 let added=0,updated=0,skipped=0;
 raw.split(/\r?\n/).filter(x=>x.trim()).forEach((line,i)=>{
  const c=line.split(/\t/).map(x=>x.trim()); if(c.length<5){skipped++;return}
  let [name,user,pass,grade,section]=c;
  if(i===0 && /apellidos/i.test(name))return;
  grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º"); section=section.toUpperCase();
  if(!name||!user||!pass||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
  const ex=db.users.find(x=>x.u===user);
  if(ex&&ex.role==="student"){ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++}
  else if(!ex){db.users.push({u:user,p:pass,role:"student",name:name,grade:grade,section:section});added++}
  else skipped++;
 });
 save();closeModal();render();setTimeout(renderStudentList,0);
 alert(`Importación terminada.\n\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
}
function exportStudents(){
 const rows=[["Apellidos y nombres","Usuario","Contraseña","Grado","Sección"]];
 db.users.filter(x=>x.role==="student").forEach(u=>rows.push([u.name,u.u,u.p,u.grade||"",u.section||""]));
 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="Estudiantes_Aula_EPT_2026.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

function makeUsername(name){
 let base=name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
   .replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"");
 if(!base) base="estudiante";
 let u=base, n=2;
 while(db.users.some(x=>x.u===u)){u=base+"."+n;n++;}
 return u;
}
function importStudents(){
 const raw=document.getElementById("importData").value.trim();
 if(!raw){alert("Pega primero los datos.");return}
 const defaultGrade=document.getElementById("importGrade").value;
 const defaultSection=document.getElementById("importSection").value;
 let added=0,updated=0,skipped=0;
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 lines.forEach((line,i)=>{
   if(i===0 && /apellidos\s+y\s+nombres/i.test(line)) return;
   let c=line.split(/\t/).map(x=>x.trim()).filter((x,j)=>j<5);
   let name="",user="",pass="1234",grade=defaultGrade,section=defaultSection;
   if(c.length>=5){
      [name,user,pass,grade,section]=c;
      grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º");
      section=section.toUpperCase();
   }else if(c.length===1){
      name=c[0];
      user=makeUsername(name);
   }else if(c.length===2){
      name=c[0];
      if(["A","B"].includes(c[1].toUpperCase())) section=c[1].toUpperCase();
      else if(["1.º","2.º","3.º","4.º","5.º"].includes(c[1])) grade=c[1];
      user=makeUsername(name);
   }else{
      skipped++;return;
   }
   if(!name||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
   if(!user)user=makeUsername(name);
   if(!pass)pass="1234";
   const ex=db.users.find(x=>x.u===user);
   if(ex&&ex.role==="student"){
      ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++;
   }else if(!ex){
      db.users.push({id:Date.now()+Math.random(),u:user,p:pass,role:"student",name:name,grade:grade,section:section});
      added++;
   }else skipped++;
 });
 save();closeModal();render();
 alert(`Importación terminada.\\n\\nAgregados: ${added}\\nActualizados: ${updated}\\nOmitidos: ${skipped}\\n\\nContraseña inicial: 1234`);
}

/* ===== VIDEO PROPIO DESDE PC v1.8 =====
   Guarda archivos seleccionados en IndexedDB del navegador.
   Esto permite probar carga/reproducción local. Para acceso desde otras PCs
   posteriormente habrá que conectar almacenamiento del servidor.
*/
const AULA_FILE_DB="AulaEPT_Files_v1";
let aulaFileDBPromise=null;
function openAulaFileDB(){
 if(aulaFileDBPromise)return aulaFileDBPromise;
 aulaFileDBPromise=new Promise((resolve,reject)=>{
   const r=indexedDB.open(AULA_FILE_DB,1);
   r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files");};
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
 return aulaFileDBPromise;
}
async function saveAulaFile(id,file){
 const db=await openAulaFileDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,id);
   tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function getAulaFile(id){
 const db=await openAulaFileDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("files","readonly"),r=tx.objectStore("files").get(id);
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}

const AULA_SUB_DB="AulaEPT_Submissions_v1";
let aulaSubDBPromise=null;
function openSubFileDB(){
 if(aulaSubDBPromise)return aulaSubDBPromise;
 aulaSubDBPromise=new Promise((resolve,reject)=>{
   const r=indexedDB.open(AULA_SUB_DB,1);
   r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("files"))d.createObjectStore("files");};
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
 return aulaSubDBPromise;
}
async function saveSubFile(id,file){
 const d=await openSubFileDB();
 return new Promise((resolve,reject)=>{
  const tx=d.transaction("files","readwrite");tx.objectStore("files").put(file,id);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function getSubFile(id){
 const d=await openSubFileDB();
 return new Promise((resolve,reject)=>{
  const tx=d.transaction("files","readonly"),q=tx.objectStore("files").get(id);
  q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
 });
}

function openChat22(other){
  if(!db.messages)db.messages=[];
  // Marca la conversación que está abierta para que onSnapshot la actualice
  // automáticamente sin cerrar la ventana.
  window.__openChat22=other;
  const otherUser=(db.users||[]).find(u=>u.u===other);
  const name=otherUser?otherUser.name:"Profesor";
  const msgs=db.messages.filter(m=>(m.from===me.u&&m.to===other)||(m.from===other&&m.to===me.u));
  const box=document.getElementById("chatMessages22");
  const oldText=document.getElementById("chatText22")?.value||"";
  const html=msgs.map(m=>`<div style="margin:8px 0;text-align:${m.from===me.u?"right":"left"}"><span style="display:inline-block;max-width:80%;padding:9px 12px;border-radius:12px;background:${m.from===me.u?"#dbeafe":"#fff"}">${m.text}</span><div class="muted" style="font-size:11px">${new Date(m.date).toLocaleString()}</div></div>`).join("")||`<p class="muted" style="text-align:center">No hay mensajes todavía.</p>`;
  if(box){
    box.innerHTML=html;
    box.scrollTop=box.scrollHeight;
    if(document.getElementById("chatText22")) document.getElementById("chatText22").value=oldText;
    return;
  }
  modalBody.innerHTML=`<h2>💬 Conversación con ${name}</h2>
  <div id="chatMessages22" style="height:300px;overflow:auto;border:1px solid #ddd;border-radius:10px;padding:12px;background:#f8fafc">${html}</div>
  <textarea id="chatText22" rows="3" placeholder="Escribe tu mensaje..."></textarea>
  <div class="actions"><button onclick="sendChat22('${other}')">📤 Enviar</button><button class="secondary" onclick="closeChat22()">Cerrar</button></div>`;
  modal.classList.remove("hidden");
  const newBox=document.getElementById("chatMessages22");
  if(newBox)newBox.scrollTop=newBox.scrollHeight;
}
function closeChat22(){
  window.__openChat22=null;
  closeModal();
}
async function sendChat22(to){

function pasteStudents23(){
  const raw=document.getElementById('pasteStudents23')?.value.trim();
  const defaultGrade=document.getElementById('pasteGrade23')?.value||'1.º';
  const defaultSection=document.getElementById('pasteSection23')?.value||'A';
  const defaultPass=document.getElementById('pastePass23')?.value.trim()||'1234';
  if(!raw){alert('Pega primero la lista de estudiantes.');return;}
  if(!Array.isArray(db.users))db.users=[];
  let added=0,updated=0,skipped=0;
  const usedNames=new Set(db.users.filter(u=>u.role==='student').map(u=>String(u.name||'').trim().toLowerCase()));
  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  lines.forEach((line,index)=>{
    let c=line.split('\t').map(x=>x.trim());
    if(c.length===1 && line.includes(';'))c=line.split(';').map(x=>x.trim());
    if(c.length===1 && line.includes('|'))c=line.split('|').map(x=>x.trim());
    const first=(c[0]||'').toLowerCase();
    if(index===0 && (first.includes('apellidos')||first.includes('nombre')||first.includes('estudiante')))return;
    if(!c[0]){skipped++;return;}
    let name=c[0], user='', pass=defaultPass, grade=defaultGrade, section=defaultSection;
    if(c.length>=5){user=c[1]||'';pass=c[2]||defaultPass;grade=c[3]||defaultGrade;section=(c[4]||defaultSection).toUpperCase();}
    else if(c.length===2){
      if(['A','B'].includes(c[1].toUpperCase()))section=c[1].toUpperCase();
      else if(['1.º','2.º','3.º','4.º','5.º'].includes(c[1]))grade=c[1];
    }
    grade=String(grade).replace(/^([1-5])\s*[°ºo]?\.?$/,'$1.º');
    section=String(section).toUpperCase();
    if(!['1.º','2.º','3.º','4.º','5.º'].includes(grade)||!['A','B'].includes(section)){skipped++;return;}
    if(!user)user=makeUsernameStudent23(name);
    if(!pass)pass=defaultPass;
    let existing=db.users.find(u=>u.role==='student' && (u.u===user || (String(u.name||'').trim().toLowerCase()===name.toLowerCase() && u.grade===grade && u.section===section)));
    if(existing){
      existing.name=name;existing.grade=grade;existing.section=section;existing.p=pass;
      if(!existing.id)existing.id='st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      updated++;return;
    }
    if(db.users.some(u=>u.u===user)){user=makeUsernameStudent23(name);}
    db.users.push({id:'st_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),u:user,p:pass,role:'student',name,grade,section});
    added++;usedNames.add(name.toLowerCase());
  });
  if(!added && !updated){alert('No se agregó ningún estudiante. Revisa la lista, grado y sección.');return;}
  save();
  render();
  alert(`✅ Lista procesada.\n\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
}

function makeUsernameStudent23(name){
  let base=String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.+|\.+$/g,'')||'estudiante';
  let u=base,n=2;
  while((db.users||[]).some(x=>x.u===u)){u=base+'.'+n;n++;}
  return u;
}

function attendanceAlerts26(){
 const records=db.attendance||{};

 const alerts=[];
 users.forEach(u=>{
   const entries=Object.keys(records).filter(k=>k.endsWith("|"+u.u)).map(k=>({key:k,date:k.split("|")[0],status:records[k]}));
   entries.forEach(x=>{

     if(x.status==="Salud") alerts.push({u,level:"recuperacion",text:`${u.name||u.u} faltó el ${x.date} por motivo de salud. Recuerda recuperar la actividad o evaluación de ese día.`});
   });
   const faltas=entries.filter(x=>x.status==="Falta").length;
   const tardanzas=entries.filter(x=>x.status==="Tardanza").length;
   if(faltas>=3) alerts.push({u,level:"alta",text:`${u.name||u.u} tiene ${faltas} faltas registradas.`});
   else if(faltas===2) alerts.push({u,level:"media",text:`${u.name||u.u} tiene 2 faltas registradas. Conviene hacer seguimiento.`});
   if(tardanzas>=3) alerts.push({u,level:"media",text:`${u.name||u.u} tiene ${tardanzas} tardanzas registradas.`});
 });
 return alerts;
}

function importStudentsFromExcel(){
  const box=document.getElementById("excelStudentsPaste");
  if(!box) return;

  const raw=box.value.trim();
  if(!raw){
    alert("Pega primero la lista copiada desde Excel.");
    return;
  }

  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let added=0, skipped=0;

  lines.forEach((line,index)=>{
    let cols=line.split("\t").map(x=>x.trim());

    // También acepta ; o | si la lista no viene directamente desde Excel.
    if(cols.length<2){
      if(line.includes(";")) cols=line.split(";").map(x=>x.trim());
      else if(line.includes("|")) cols=line.split("|").map(x=>x.trim());
    }

    // Saltar encabezados habituales.
    const first=(cols[0]||"").toLowerCase();
    if(index===0 && (
      first.includes("nombre") ||
      first.includes("apellidos") ||
      first.includes("estudiante")
    )){
      skipped++;
      return;
    }

    if(cols.length<1 || !cols[0]) {
      skipped++;
      return;
    }

    const name=cols[0];
    const username=cols[1] || makeUsernameFromName(name);
    const password=cols[2] || "1234";
    const grade=cols[3] || "";
    const section=cols[4] || "";

    if(!db.users) db.users=[];

    // Evitar duplicados por usuario.
    if(db.users.some(u=>u.u===username)){
      skipped++;
      return;
    }

    db.users.push({
      u:username,
      p:password,
      role:"student",
      name:name,
      grade:grade,
      section:section
    });

    added++;
  });

  if(added===0){
    alert("No se importaron estudiantes. Revisa que las columnas estén separadas por tabulaciones.");
    return;
  }

  save();
  closeModal();
  render();

  alert(`✅ Se importaron ${added} estudiante(s).${skipped ? ` Se omitieron ${skipped}.` : ""}`);
}

function makeUsernameFromName(name){
  return name
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,".")
    .replace(/^\.+|\.+$/g,"");
}

function classLevel(n){n=Number(n);return n>=18?'AD':n>=15?'A':n>=11?'B':'C'}
function escClass(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function todayLocal30(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function classRecordById(id){ensureClassData();return db.classRecords.find(x=>String(x.id)===String(id))}
function classEvalRecord(classId,u){ensureClassData();return db.classEvaluations.find(x=>String(x.classId)===String(classId)&&x.user===u)}
function avgNums(a){const x=a.map(Number).filter(Number.isFinite);return x.length?x.reduce((s,n)=>s+n,0)/x.length:null}
function componentAvg(arr,u){
  const vals=(arr||[]).filter(x=>x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!=="").map(x=>Number(x.grade));
  return avgNums(vals);
}
function classAvg(u){return componentAvg(db.classEvaluations,u)}
function activitiesAvg(u){return componentAvg(db.activitiesGrades,u)}
function participationAvg(u){return componentAvg(db.participations,u)}
function behaviorAvg(u){return componentAvg(db.behaviorGrades,u)}
function uniformAvg(u){return componentAvg(db.uniformGrades,u)}
function notebookAvg(u){return componentAvg(db.notebookGrades,u)}
function folderAvg(u){return componentAvg(db.folderGrades,u)}
function examAvg(u){return componentAvg(db.examGrades,u)}
function projectAvg(u){
  const p=projectRecord(u);
  return avgNums([p.portfolio,p.product,p.exposition].filter(x=>x!==null));
}
function processAvg(u){
  return avgNums([classAvg(u),activitiesAvg(u),participationAvg(u),behaviorAvg(u),uniformAvg(u),notebookAvg(u),folderAvg(u),examAvg(u)].filter(x=>x!==null));
}
function finalGrade(u){
  const p=projectAvg(u), pr=processAvg(u);
  if(p===null&&pr===null)return null;
  return (p===null?0:p*.70)+(pr===null?0:pr*.30);
}
function evaluationDetail(u){
  const p=projectAvg(u), pr=processAvg(u), f=finalGrade(u);
  return {project:p,process:pr,final:f,level:f===null?'—':classLevel(f)};
}

function projectRubricScore(levels,criteriaCount){
  const vals=(levels||[]).map(Number).filter(Number.isFinite);
  if(!vals.length)return null;
  // Los criterios marcados "Aún no enseñado" no participan en el promedio.
  // Los criterios evaluados se normalizan de niveles 1–4 a escala 0–20.
  return (vals.reduce((a,b)=>a+b,0)/(vals.length*4))*20;
}
function categoryForStudent(u){
  const g=String(u?.grade||'').replace(/\s/g,'');
  return (g==='1.º'||g==='1°'||g==='1' || g==='2.º'||g==='2°'||g==='2')?'A':'B';
}
function projectRecord(u){
  ensureClassData();
  const weekly=(db.projectWeeklyGrades||[]).filter(x=>x.user===u);
  const legacy=(db.projectGrades||[]).filter(x=>x.user===u);
  const user=(db.users||[]).find(x=>x.u===u)||{};
  const cat=categoryForStudent(user);

  const pc=db.projectRubrics[cat+'_portfolio']||[];
  const pr=db.projectRubrics[cat+'_product']||[];
  const portfolioVals=weekly.map(x=>projectRubricScore(x.portfolioLevels,pc.length)).filter(x=>x!==null);
  const productVals=weekly.map(x=>projectRubricScore(x.productLevels,pr.length)).filter(x=>x!==null);

  if(!portfolioVals.length) legacy.forEach(x=>{if(x.portfolio!==''&&x.portfolio!=null)portfolioVals.push(Number(x.portfolio));});
  if(!productVals.length) legacy.forEach(x=>{if(x.product!==''&&x.product!=null)productVals.push(Number(x.product));});

  const expositionVals=(db.expositionRubric.scores||[])
    .filter(x=>x.user===u&&x.week!==undefined&&x.week!==null)
    .map(x=>Number(x.score)).filter(Number.isFinite);
  let exposition=avgNums(expositionVals);
  if(exposition===null){
    const legacyExpo=legacy.map(x=>x.exposition).filter(x=>x!==''&&x!=null).map(Number);
    exposition=avgNums(legacyExpo);
  }
  return {portfolio:avgNums(portfolioVals),product:avgNums(productVals),exposition};
}

  ensureClassData();

}

function renderExpositionStudents30(){
  ensureClassData();const box=document.getElementById('expoTable30');if(!box)return;

  const grade=document.getElementById('expoGrade30')?.value||'Todos',sec=document.getElementById('expoSection30')?.value||'Todas';

  const groups=(db.groups||[]).filter(g=>(grade==='Todos'||g.grade===grade)&&(sec==='Todas'||g.section===sec));
  const headers=criteria.map(c=>`<th>${escClass(c.name)}<br><small>0–20</small></th>`).join('');
  const rows=groups.map(g=>{
    const members=(g.members||[]).filter(id=>students.some(u=>u.u===id));
    if(!members.length)return '';
    const cells=criteria.map(c=>{
      const s=(db.expositionRubric.scores||[]).find(x=>x.user===members[0]&&Number(x.week)===week&&x.criterionId===c.id);
      return `<td><input class="expoScore30" data-group="${escClass(g.id)}" data-criterion="${escClass(c.id)}" type="number" min="0" max="20" value="${s?.score??''}" style="width:75px"></td>`;
    }).join('');
    const vals=criteria.map(c=>(db.expositionRubric.scores||[]).find(x=>x.user===members[0]&&Number(x.week)===week&&x.criterionId===c.id)?.score).filter(x=>x!==undefined);
    const av=avgNums(vals);
    return `<tr><td><b>${escClass(g.name)}</b><br><span class="muted">${members.map(id=>projectStudentName(id)).join(', ')}</span>${members.length===1?'<br><small>Trabajo individual</small>':''}</td>${cells}<td>${av===null?'—':av.toFixed(2)}</td></tr>`;
  }).join('');
  box.innerHTML=`<table><tr><th>Grupo / integrantes</th>${headers}<th>Nota exposición</th></tr>${rows||'<tr><td colspan="'+(criteria.length+2)+'">No hay grupos para el filtro. Crea los grupos primero.</td></tr>'}</table><p class="muted" style="margin-top:10px">La misma calificación de exposición se guarda para todos los integrantes del grupo.</p><button onclick="saveExpositionScores()">💾 Guardar exposiciones</button>`;
}
function saveExpositionScores(){
  ensureClassData();
  const week=Number(document.getElementById('expoWeek30')?.value||1),date=document.getElementById('expoDate30')?.value||todayLocal30();
  const inputs=[...document.querySelectorAll('.expoScore30')];
  let count=0;
  inputs.forEach(e=>{
    const groupId=e.dataset.group,criterionId=e.dataset.criterion,val=e.value;
    const g=(db.groups||[]).find(x=>x.id===groupId);if(!g)return;
    (g.members||[]).forEach(user=>{
      let s=db.expositionRubric.scores.find(x=>x.user===user&&Number(x.week)===week&&x.criterionId===criterionId);
      if(val===''){if(s)db.expositionRubric.scores=db.expositionRubric.scores.filter(x=>x!==s);return;}
      if(!s){s={id:'ex_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),user,week,criterionId};db.expositionRubric.scores.push(s);}
      const student=(db.users||[]).find(x=>x.u===user);
      s.date=date;s.grade=student?.grade||'';s.section=student?.section||'';s.category=categoryForStudent(student);s.groupId=groupId;s.groupName=g.name;s.score=Math.max(0,Math.min(20,Number(val)));s.savedAt=Date.now();
      count++;
    });
  });
  save();alert(`✅ Exposición de la semana ${week} guardada para ${count} registro(s) de integrantes.`);openProjectEvaluation();
}

function updateTimerDisplay30(){
  const el=document.getElementById('timerDisplay30');
  if(!el)return;
  const min=Math.floor(Math.max(0,eptTimerSeconds30)/60);
  const sec=Math.max(0,eptTimerSeconds30)%60;
  el.textContent=String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function setTimer30(min,sec){
  pauseTimer30();
  eptTimerSeconds30=(Number(min)||0)*60+(Number(sec)||0);
  updateTimerDisplay30();
  const msg=document.getElementById('timerMsg30');
  if(msg)msg.textContent='Tiempo configurado.';
}
function startTimer30(){
  if(eptTimerRunning30)return;
  if(eptTimerSeconds30<=0){
    const min=Number(document.getElementById('timerMin30')?.value)||0;
    const sec=Number(document.getElementById('timerSec30')?.value)||0;
    eptTimerSeconds30=min*60+sec;
  }
  if(eptTimerSeconds30<=0){alert('Coloca un tiempo mayor que 0.');return}
  eptTimerRunning30=true;
  const msg=document.getElementById('timerMsg30');
  if(msg)msg.textContent='⏳ Tiempo en marcha...';
  clearInterval(eptTimer30);
  eptTimer30=setInterval(()=>{
    eptTimerSeconds30--;
    updateTimerDisplay30();
    if(eptTimerSeconds30<=0){
      clearInterval(eptTimer30);
      eptTimer30=null;
      eptTimerRunning30=false;
      eptTimerSeconds30=0;
      updateTimerDisplay30();
      const msg2=document.getElementById('timerMsg30');
      if(msg2)msg2.textContent='🔔 ¡TIEMPO TERMINADO!';
      try{ new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=').play().catch(()=>{}); }catch(e){}
      alert('⏰ ¡Tiempo terminado!');
    }
  },1000);
}
function pauseTimer30(){

  eptTimerRunning30=false;
  const msg=document.getElementById('timerMsg30');

function resetTimer30(){

function renderGroups30(){
  ensureClassData();
  const gsel=document.getElementById('gpGrade30')?.value||'', ssel=document.getElementById('gpSec30')?.value||'';
  if(!gsel||!ssel)return `<div class="card"><p class="muted">Selecciona primero un <b>grado y una sección</b> para ver los grupos de esa aula.</p></div>`;
  const filtered=db.groups.filter(g=>g.grade===gsel&&g.section===ssel);
  if(!filtered.length)return `<div class="card"><p class="muted">No hay grupos creados para ${escClass(gsel)} ${escClass(ssel)}.</p></div>`;
  return `<div class="grid3">${filtered.map((g,i)=>{
    const ms=(g.members||[]).map(x=>db.users.find(u=>u.u===x)).filter(Boolean);
    const classRecs=db.classRecords.filter(r=>r.grade===g.grade&&r.section===g.section);
    const total=ms.length*classRecs.length;
    const done=ms.reduce((z,u)=>z+classRecs.filter(r=>{const ev=classEvalRecord(r.id,u.u);return ev&&ev.status&&ev.status!=='NO HIZO'}).length,0);
    const prog=total?Math.round(done/total*100):0;
    const grades=ms.flatMap(u=>db.classEvaluations.filter(r=>r.user===u.u&&r.grade!=null&&classRecs.some(c=>c.id===r.classId)).map(r=>Number(r.grade)));
    const avg=grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(1):'—';
    return `<div class="card"><div style="display:flex;justify-content:space-between"><div><h3>${escClass(g.name||'Grupo '+(i+1))}</h3><div class="muted">${escClass(g.grade)} — ${escClass(g.section)}</div></div><button class="small secondary" onclick="renameGroup30('${escClass(g.id)}')">✏️</button></div>

    <div style="height:10px;background:#e2e8f0;border-radius:9px"><div style="height:100%;width:${prog}%;background:#2563eb;border-radius:9px"></div></div>
    <div class="list" style="margin-top:12px">${ms.map(u=>`<div class="item" style="padding:8px"><div><b>${escClass(u.name)}</b></div><select onchange="moveGroup30('${escClass(g.id)}','${escClass(u.u)}',this.value)" style="max-width:110px"><option value="">Mover…</option>${db.groups.filter(z=>z.id!==g.id&&z.grade===g.grade&&z.section===g.section).map(z=>`<option value="${escClass(z.id)}">${escClass(z.name)}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Sin estudiantes.</p>'}</div>
    <div class="actions" style="margin-top:10px"><button class="small" onclick="addGroupMember30('${escClass(g.id)}')">＋ Agregar</button><button class="small danger" onclick="deleteGroup30('${escClass(g.id)}')">Eliminar</button></div></div>`;
  }).join('')}</div>`;
}

  const g=gradeEl?.value;
  const s=secEl?.value;
  const n=Math.max(1,Math.min(20,Number(document.getElementById('gpCount30')?.value)||4));
  if(!g||!s){alert('Selecciona primero grado y sección.');return}

  // IMPORTANTE: cada clic vuelve a sortear SOLAMENTE el aula seleccionada.
  // No se vuelve a pedir grado/sección y no se mezcla con otros grados.
  const a=db.users.filter(u=>u.role==='student'&&u.grade===g&&u.section===s);
  if(!a.length){alert(`No hay estudiantes registrados en ${g} ${s}.`);return}

  window.__lastRaffleGrade30=g;
  window.__lastRaffleSection30=s;
  window.__raffleCount=(window.__raffleCount||0)+1;

  const ng=Math.min(n,a.length);
  const grupos=Array.from({length:ng},(_,i)=>({
    id:'grp_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7),
    name:'Grupo '+(i+1), grade:g, section:s, members:[]
  }));

  // Mezcla únicamente a los estudiantes de grado + sección seleccionados.
  const shuffled=[...a];
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  shuffled.forEach((u,i)=>grupos[i%grupos.length].members.push(u.u));

  // Reemplaza únicamente los grupos de ESTE grado/sección.
  db.groups=db.groups.filter(x=>!(x.grade===g&&x.section===s));
  db.groups.push(...grupos);
  save();

  // NO usamos render(): así el grado y sección quedan seleccionados.
  // Solo actualizamos la zona de resultados.
  const box=document.getElementById('groupsResults30');
  if(box) box.innerHTML=renderGroups30();

  // Dejamos explícitamente los selectores en el valor elegido.
  if(gradeEl) gradeEl.value=g;
  if(secEl) secEl.value=s;
}

  ensureClassData();const g=document.getElementById('gpGrade30')?.value,s=document.getElementById('gpSec30')?.value,n=Math.max(1,Math.min(20,Number(document.getElementById('gpCount30')?.value)||4));
  if(!g||!s){alert('Selecciona primero grado y sección.');return}

function addGroupMember30(id){const g=db.groups.find(x=>x.id===id);if(!g)return;const used=new Set(db.groups.flatMap(x=>x.members||[])),a=db.users.filter(u=>u.role==='student'&&u.grade===g.grade&&u.section===g.section&&!used.has(u.u));if(!a.length){alert('No quedan estudiantes sin asignar en este grado y sección.');return}modalBody.innerHTML=`<h2>＋ Agregar estudiante</h2><p class="muted">Solo ${escClass(g.grade)} ${escClass(g.section)}.</p><select id="gm30">${a.map(u=>`<option value="${escClass(u.u)}">${escClass(u.name)}</option>`).join('')}</select><div class="actions"><button onclick="saveGroupMember30('${escClass(id)}')">Agregar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`;modal.classList.remove('hidden')}

function creaEmprende(){
  if(me.role!=='teacher') return `<div class="card"><h2>🏆 Crea y Emprende</h2><p class="muted">Registro disponible para el docente.</p></div>`;

  ensureClassData();

  const grades=['1.º','2.º','3.º','4.º','5.º'];
  const sections=['A','B'];
  const grade=window.cyGrade||'1.º';
  const section=window.cySection||'A';
  const stage=window.cyStage||'Etapa institucional';

  // IMPORTANTE: se identifica al estudiante por su usuario, no por u.id.
  // Así funciona tanto con estudiantes importados como con estudiantes agregados manualmente.
  const students=(db.users||[])
    .filter(u=>u.role==='student' && u.grade===grade && u.section===section)
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  const getRec=u=>{
    const username=u.u||'';
    return (db.creaEmprende||[]).find(r=>
      r.grade===grade &&
      r.section===section &&
      r.stage===stage &&
      (r.studentKey===username || r.username===username || (r.studentId!=null && r.studentId===u.id))
    )||{};
  };

  const safeKey=u=>encodeURIComponent(u.u||'');
  const rows=students.map((u,index)=>{
    const key=safeKey(u);
    const r=getRec(u);
    const status=r.status||'';
    const reasonDisabled=status!=='no participó'?'disabled':'';

    return `<tr>
      <td>
        <b>${escClass(u.name||'Sin nombre')}</b>
        <div class="muted" style="font-size:12px">${escClass(u.grade||'')} · ${escClass(u.section||'')}</div>
      </td>
      <td>
        <select id="cyStatus_${index}" onchange="toggleCYRow(${index})">
          <option value="">Seleccionar</option>
          <option value="participó" ${status==='participó'?'selected':''}>✅ Participó</option>
          <option value="no participó" ${status==='no participó'?'selected':''}>❌ No participó</option>
        </select>
      </td>
      <td>
        <input id="cyProject_${index}" value="${escClass(r.project||'')}" placeholder="Proyecto / grupo / función">
      </td>
      <td>
        <select id="cyReason_${index}" ${reasonDisabled}>
          <option value="">—</option>
          ${['No presentó proyecto','No quiso participar','Inasistencia','Problema familiar','Motivo de salud','Otro']
            .map(x=>`<option ${r.reason===x?'selected':''}>${x}</option>`).join('')}
        </select>
      </td>
      <td>
        <input id="cyDetail_${index}" value="${escClass(r.detail||'')}" placeholder="Detalle u observación">
      </td>
      <td>
        <button class="small" onclick="saveCY('${key}',${index})">💾 Guardar</button>
      </td>
    </tr>`;
  }).join('');

  const participados=students.filter(u=>{
    const r=getRec(u); return r.status==='participó';
  }).length;
  const noParticipados=students.filter(u=>{
    const r=getRec(u); return r.status==='no participó';
  }).length;

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div>
        <h2>🏆 Crea y Emprende</h2>
        <p class="muted">Registro independiente de participación. <b>No modifica las calificaciones.</b></p>
      </div>
      <span class="badge">REGISTRO</span>
    </div>

    <div class="grid3" style="margin-top:15px">
      <div>
        <label>🎓 Grado</label>
        <select id="cyGrade" onchange="setCYFilter()">
          ${grades.map(g=>`<option value="${g}" ${g===grade?'selected':''}>${g}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Sección</label>
        <select id="cySection" onchange="setCYFilter()">
          ${sections.map(x=>`<option value="${x}" ${x===section?'selected':''}>${x}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Etapa / actividad</label>
        <input id="cyStage" value="${escClass(stage)}" placeholder="Ej.: Etapa institucional">
      </div>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">
      <span class="badge">👥 Estudiantes: ${students.length}</span>

      <span class="badge warn">❌ No participaron: ${noParticipados}</span>
    </div>

    <div style="overflow:auto;margin-top:18px">
      <table>
        <tr>
          <th>Estudiante</th>
          <th>Participación</th>
          <th>Proyecto / grupo / función</th>
          <th>Motivo si no participó</th>
          <th>Detalle</th>
          <th>Acción</th>
        </tr>
        ${rows||`<tr><td colspan="6">
          <div style="padding:12px">
            <b>No hay estudiantes registrados en ${escClass(grade)} ${escClass(section)}.</b>
            <p class="muted" style="margin:6px 0 0">Primero agrégalos en <b>Estudiantes</b> con ese mismo grado y sección. Luego aparecerán automáticamente aquí.</p>
          </div>
        </td></tr>`}
      </table>
    </div>

    <p class="muted" style="margin-top:12px">
      Los registros se guardan por <b>estudiante, grado, sección y etapa</b>. El estudiante se reconoce por su usuario para evitar que se pierda al agregarlo o importarlo.

function setCYFilter(){
  window.cyGrade=document.getElementById('cyGrade')?.value||'1.º';
  window.cySection=document.getElementById('cySection')?.value||'A';
  window.cyStage=document.getElementById('cyStage')?.value.trim()||'Etapa institucional';
  render();
}

function saveCY(encodedUsername,rowIndex){
  ensureClassData();

  const username=decodeURIComponent(encodedUsername||'');
  const student=(db.users||[]).find(u=>u.role==='student'&&u.u===username);
  if(!student){alert('No se encontró al estudiante.');return}

  const grade=document.getElementById('cyGrade')?.value||window.cyGrade||student.grade||'1.º';
  const section=document.getElementById('cySection')?.value||window.cySection||student.section||'A';
  const stage=document.getElementById('cyStage')?.value.trim()||window.cyStage||'Etapa institucional';
  const status=document.getElementById('cyStatus_'+rowIndex)?.value||'';
  const project=document.getElementById('cyProject_'+rowIndex)?.value.trim()||'';
  const reason=document.getElementById('cyReason_'+rowIndex)?.value||'';
  const detail=document.getElementById('cyDetail_'+rowIndex)?.value.trim()||'';

  if(!status){alert(`Selecciona la participación de ${student.name}.`);return}
  if(status==='no participó' && !reason){alert(`Indica el motivo de la no participación de ${student.name}.`);return}

  let r=(db.creaEmprende||[]).find(x=>
    x.grade===grade &&
    x.section===section &&
    x.stage===stage &&
    (x.studentKey===username || x.username===username || (x.studentId!=null && x.studentId===student.id))
  );

  if(!r){
    r={
      id:'cy_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      studentKey:username,
      username,
      studentId:student.id??null,
      studentName:student.name||'',
      grade,
      section,
      stage
    };
    db.creaEmprende.push(r);
  }else{
    // Normaliza registros antiguos para que sigan funcionando.
    r.studentKey=username;
    r.username=username;
    r.studentId=student.id??r.studentId??null;
    r.studentName=student.name||r.studentName||'';
    r.grade=grade;
    r.section=section;
    r.stage=stage;
  }

  r.status=status;
  r.project=project;
  r.reason=status==='no participó'?reason:'';
  r.detail=detail;
  r.updatedAt=new Date().toISOString();

  window.cyGrade=grade;
  window.cySection=section;
  window.cyStage=stage;

  save();
  alert(`✅ Registro guardado para ${student.name}.`);
  render();
}

function toggleCYRow(rowIndex){
  const status=document.getElementById('cyStatus_'+rowIndex)?.value||'';
  const reason=document.getElementById('cyReason_'+rowIndex);
  if(reason) reason.disabled=status!=='no participó';
}
/* ===== FIN CREA Y EMPRENDE ===== */


/* ===== SESIONES POR GRADO/SECCIÓN + REGISTRO DE CLASE VINCULADO v2 ===== */
function sessionGroupForGrade(g){
  g=String(g||'').trim();
  if(g==='1.º'||g==='2.º') return '1.º-2.º';
  if(g==='3.º'||g==='4.º'||g==='5.º') return '3.º-5.º';
  return g;
}
function sessionAppliesToGrade(s,g){
  const sg=String(s.grade||'');
  return sg===sessionGroupForGrade(g) || sg===g;
}
function sessionGradeLabel(x){
  const g=sessionGroupForGrade(x.grade||'');
  if(g==='1.º-2.º') return '1.º y 2.º';
  if(g==='3.º-5.º') return '3.º, 4.º y 5.º';
  return g || 'Sin grado';
}
function allSessionsForUI(){
  (db.sessions||[]).forEach(s=>{ if(['1.º','2.º'].includes(String(s.grade))) s.grade='1.º-2.º'; else if(['3.º','4.º','5.º'].includes(String(s.grade))) s.grade='3.º-5.º'; });
  return (db.sessions||[]).slice().sort((a,b)=>{
    const ga=String(a.grade||''), gb=String(b.grade||'');
    return ga.localeCompare(gb)||Number(a.number||0)-Number(b.number||0);
  });
}
function normalizeSessionGroups(){
  (db.sessions||[]).forEach(s=>{
    const g=String(s.grade||'').trim();
    if(['1.º','2.º'].includes(g)) s.grade='1.º-2.º';
    else if(['3.º','4.º','5.º'].includes(g)) s.grade='3.º-5.º';
  });
}
function sessionGroupLabel(g){
  if(g==='1.º-2.º') return '1.º y 2.º';
  if(g==='3.º-5.º') return '3.º, 4.º y 5.º';
  return 'Sin grupo';
}
function openUnit(id, selectedGroup='1.º-2.º'){
  const u=(db.units||[]).find(x=>x.id===id); if(!u)return;
  normalizeSessionGroups();
  if(!db.sessions)db.sessions=[];
  const groups=['1.º-2.º','3.º-5.º'];
  const ses=db.sessions.filter(x=>x.unit===id && x.grade===selectedGroup).sort((a,b)=>Number(a.number||0)-Number(b.number||0));
  modalBody.innerHTML=`<h2>📚 Unidad ${u.number}: ${escClass(u.title)}</h2>
  <p class="muted">${escClass(u.description||'')}</p><hr>
  <div class="session-group-tabs" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px">
    ${groups.map(g=>`<button class="${g===selectedGroup?'':'secondary'}" onclick="openUnit(${id},'${g}')">🎓 ${sessionGroupLabel(g)}</button>`).join('')}
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <h3>📖 Sesiones de aprendizaje — ${sessionGroupLabel(selectedGroup)}</h3>
    ${me.role==='teacher'?`<button onclick="addSession(${id},'${selectedGroup}')">＋ Agregar sesión</button>`:''}
  </div>
  <div class="list" style="margin-top:12px">
  ${ses.map(x=>`<div class="item">
    <div><span class="badge">${escClass(x.status||'Programada')}</span>
    <h3 style="margin:7px 0">Sesión ${escClass(x.number)}: ${escClass(x.title)}</h3>
    <div class="muted">${escClass(x.description||'')}</div>
    <div style="margin-top:7px"><b>🎓 Grupo:</b> ${sessionGroupLabel(x.grade)}${x.section?` · ${escClass(x.section)}`:' · A y B'}</div>
    ${x.date?`<small>📅 Fecha: ${escClass(x.date)}</small>`:''}</div>
    <div class="actions" style="align-self:flex-start"><button onclick="viewSession(${x.id})">Ver</button>
    ${me.role==='teacher'?`<button class="secondary" onclick="editSession(${x.id})">✏️ Editar</button><button class="danger" onclick="deleteSession(${x.id})">🗑️ Eliminar</button>`:''}</div>
  </div>`).join('') || `<div class="card"><p class="muted">Todavía no hay sesiones para <b>${sessionGroupLabel(selectedGroup)}</b>. Usa “＋ Agregar sesión”.</p></div>`}
  </div>
  <button class="secondary" style="margin-top:15px" onclick="closeModal()">Cerrar</button>`;
  modal.classList.remove('hidden');
}
function addSession(unitId, group='1.º-2.º'){
  const count=(db.sessions||[]).filter(x=>x.unit===unitId && x.grade===group).length;
  modalBody.innerHTML=`<h2>＋ Nueva sesión</h2>
  <div class="card" style="background:#eff6ff"><b>🎓 Grupo:</b> ${sessionGroupLabel(group)}<br><span class="muted">Esta sesión aparecerá automáticamente para todos los grados de este grupo.</span></div>
  <label>Número de sesión</label><input id="sesN" type="number" min="1" value="${count+1}">
  <label>Título de la sesión</label><input id="sesT" placeholder="Ej.: Conocemos el problema de nuestra comunidad">
  <label>Descripción / propósito</label><textarea id="sesD" placeholder="Escribe brevemente qué desarrollarán los estudiantes."></textarea>
  <div class="grid3">
    <div><label>Grupo de grados</label><input id="sesGLabel" value="${sessionGroupLabel(group)}" disabled></div>
    <div><label>Sección</label><select id="sesSec"><option value="">A y B</option><option>A</option><option>B</option></select></div>
    <div><label>Fecha</label><input id="sesF" type="date"></div>
  </div>
  <label>Estado</label><select id="sesS"><option>Programada</option><option>En desarrollo</option><option>Finalizada</option></select>
  <div class="actions" style="margin-top:15px"><button onclick="saveSession(${unitId},'${group}')">Guardar sesión</button><button class="secondary" onclick="openUnit(${unitId},'${group}')">Cancelar</button></div>`;
  modal.classList.remove('hidden');
}
function saveSession(unitId, group='1.º-2.º'){
  if(!db.sessions)db.sessions=[];
  const number=Number(document.getElementById('sesN').value);
  const title=document.getElementById('sesT').value.trim();
  const description=document.getElementById('sesD').value.trim();
  const section=document.getElementById('sesSec').value;
  const date=document.getElementById('sesF').value;
  const status=document.getElementById('sesS').value;
  if(!number||!title){alert('Completa número y título de la sesión.');return}
  db.sessions.push({id:Date.now()+Math.random(),unit:unitId,number,title,description,grade:group,section,date,status});
  save();openUnit(unitId,group);
}
function editSession(id){
  const x=(db.sessions||[]).find(a=>a.id===id);if(!x)return;
  normalizeSessionGroups();
  const group=(x.grade==='1.º-2.º'||x.grade==='3.º-5.º')?x.grade:'3.º-5.º';
  modalBody.innerHTML=`<h2>✏️ Editar sesión</h2>
  <div class="card" style="background:#eff6ff"><b>🎓 Grupo:</b> ${sessionGroupLabel(group)}</div>
  <label>Número de sesión</label><input id="sesN" type="number" min="1" value="${x.number}">
  <label>Título de la sesión</label><input id="sesT" value="${escClass(x.title)}">
  <label>Descripción / propósito</label><textarea id="sesD">${escClass(x.description||'')}</textarea>
  <div class="grid3">
    <div><label>Grupo de grados</label><select id="sesG"><option value="1.º-2.º" ${group==='1.º-2.º'?'selected':''}>1.º y 2.º</option><option value="3.º-5.º" ${group==='3.º-5.º'?'selected':''}>3.º, 4.º y 5.º</option></select></div>
    <div><label>Sección</label><select id="sesSec"><option value="" ${!x.section?'selected':''}>A y B</option><option ${x.section==='A'?'selected':''}>A</option><option ${x.section==='B'?'selected':''}>B</option></select></div>
    <div><label>Fecha</label><input id="sesF" type="date" value="${escClass(x.date||'')}"></div>
  </div>
  <label>Estado</label><select id="sesS"><option ${x.status==='Programada'?'selected':''}>Programada</option><option ${x.status==='En desarrollo'?'selected':''}>En desarrollo</option><option ${x.status==='Finalizada'?'selected':''}>Finalizada</option></select>
  <div class="actions" style="margin-top:15px"><button onclick="saveEditedSession(${id})">Guardar cambios</button><button class="danger" onclick="deleteSession(${id})">🗑️ Eliminar sesión</button><button class="secondary" onclick="openUnit(${x.unit},'${group}')">Cancelar</button></div>`;
  modal.classList.remove('hidden');
}
function saveEditedSession(id){
  const x=(db.sessions||[]).find(a=>a.id===id);if(!x)return;
  const title=document.getElementById('sesT').value.trim();
  const group=document.getElementById('sesG').value;
  if(!title||!group){alert('Completa título y grupo de grados.');return}
  x.number=Number(document.getElementById('sesN').value)||1;
  x.title=title;x.description=document.getElementById('sesD').value.trim();
  x.grade=group;x.section=document.getElementById('sesSec').value;x.date=document.getElementById('sesF').value;x.status=document.getElementById('sesS').value;
  save();openUnit(x.unit,group);
}
function deleteSession(id){
  const x=(db.sessions||[]).find(a=>a.id===id); if(!x)return;
  if(!confirm(`¿Eliminar la Sesión ${x.number}: ${x.title}?\n\nSe eliminarán sus materiales y actividades vinculadas. Los registros de clase históricos se conservarán.`))return;
  db.sessions=db.sessions.filter(a=>a.id!==id);
  if(db.materials)db.materials=db.materials.filter(m=>m.session!==id);
  if(db.activities)db.activities=db.activities.filter(a=>a.session!==id);
  if(db.classRecords)db.classRecords.forEach(r=>{if(String(r.session)===String(id))r.session='';});
  save();openUnit(x.unit,sessionGroupForGrade(x.grade));
}
function viewSession(id){
  const x=(db.sessions||[]).find(a=>a.id===id); if(!x)return;
  if(!db.materials)db.materials=[]; if(!db.activities)db.activities=[];
  const mats=db.materials.filter(m=>m.session===id),acts=db.activities.filter(a=>a.session===id);
  modalBody.innerHTML=`<h2>📖 Sesión ${x.number}: ${escClass(x.title)}</h2>
  <div class="badge" style="display:inline-block;margin:5px 0">🎓 ${escClass(sessionGradeLabel(x))}</div>
  <p>${escClass(x.description||'Sin descripción.')}</p>
  <p class="muted">${x.date?'📅 Fecha: '+escClass(x.date):'Sin fecha'} · ${escClass(x.status||'Programada')}</p><hr>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3>🎬 Materiales</h3>${me.role==='teacher'?`<button onclick="addSessionMaterial(${id})">＋ Agregar material</button>`:''}</div>
  <div class="list" style="margin-top:10px">${mats.map(m=>`<div class="item"><div><span class="badge">${escClass(m.type||'Recurso')}</span><h3 style="margin:6px 0">${escClass(m.title)}</h3><div class="muted">${escClass(m.description||'')}</div></div>${m.url?`<a href="${m.url}" target="_blank" rel="noopener"><button>🔗 Abrir</button></a>`:''}</div>`).join('')||`<p class="muted">Todavía no hay materiales para esta sesión.</p>`}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px"><h3>📝 Actividades</h3>${me.role==='teacher'?`<button onclick="addSessionActivity(${id})">＋ Crear actividad</button>`:''}</div>
  ${acts.map(a=>`<div class="item"><div><b>${escClass(a.title)}</b><div class="muted">${escClass(a.description||'')}</div></div><span class="badge">${escClass(a.due||'Sin fecha')}</span></div>`).join('')||`<p class="muted">Todavía no hay una actividad para esta sesión.</p>`}
  <button class="secondary" style="margin-top:15px" onclick="closeModal()">Cerrar</button>`;
  modal.classList.remove('hidden');
}

function newClassRecord30(){
  const sessions=allSessionsForUI();
  if(!sessions.length){
    modalBody.innerHTML=`<h2>＋ Nueva clase</h2><div class="card"><p class="muted">Primero debes crear una <b>sesión de aprendizaje</b> en Cursos → Unidad → Agregar sesión.</p></div><div class="actions"><button class="secondary" onclick="closeModal()">Cerrar</button></div>`;
    modal.classList.remove('hidden');return;
  }
  const first=sessions[0];
  modalBody.innerHTML=`<h2>＋ Nueva clase desde una sesión</h2>
  <p class="muted">La clase se creará automáticamente con el grado, sección, fecha y título de la sesión seleccionada.</p>
  <label>📖 Sesión de aprendizaje</label>
  <select id="crSession30" onchange="syncSessionToClass30()">
    ${sessions.map(x=>`<option value="${escClass(x.id)}">${escClass(sessionGradeLabel(x))} · Sesión ${escClass(x.number)}: ${escClass(x.title)}</option>`).join('')}
  </select>
  <div class="grid3" style="margin-top:12px">
    <div><label>Fecha</label><input id="crDate30" type="date" value="${escClass(first.date||todayLocal30())}" readonly></div>
    <div><label>Grado</label><input id="crGrade30" value="${escClass(first.grade||'')}" readonly></div>
    <div><label>Sección</label><input id="crSec30" value="${escClass(first.section||'')}" readonly></div>
  </div>
  <label>Título de la clase</label><input id="crTitle30" value="${escClass(first.title)}" readonly>
  <label>Propósito de aprendizaje</label><textarea id="crPurpose30" rows="3">${escClass(first.description||'')}</textarea>
  <label>Criterios de evaluación</label><textarea id="crCriteria30" rows="3"></textarea>
  <label>Actividad vinculada (opcional)</label><select id="crAct30"></select>
  <div class="actions" style="margin-top:15px"><button onclick="saveClassRecord30()">Guardar clase</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`;
  modal.classList.remove('hidden');
  syncSessionToClass30();
}
function syncSessionToClass30(){
  const id=document.getElementById('crSession30')?.value;
  const s=(db.sessions||[]).find(x=>String(x.id)===String(id)); if(!s)return;
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val||''};
  set('crDate30',s.date||todayLocal30());set('crGrade30',s.grade||'');set('crSec30',s.section||'');set('crTitle30',s.title||'');set('crPurpose30',s.description||'');
  const acts=(db.activities||[]).filter(a=>String(a.session)===String(s.id));
  const box=document.getElementById('crAct30');
  if(box)box.innerHTML=`<option value="">Ninguna</option>${acts.map(a=>`<option value="${escClass(a.id)}">${escClass(a.title)}</option>`).join('')}`;
}
function saveClassRecord30(){
  const sessionId=document.getElementById('crSession30')?.value;
  const ses=(db.sessions||[]).find(x=>String(x.id)===String(sessionId));
  if(!ses){alert('Selecciona una sesión de aprendizaje.');return}
  const date=document.getElementById('crDate30')?.value,title=document.getElementById('crTitle30')?.value.trim(),purpose=document.getElementById('crPurpose30')?.value.trim(),criteria=document.getElementById('crCriteria30')?.value.trim(),grade=ses.grade,section=ses.section,activity=document.getElementById('crAct30')?.value||'';
  if(!date||!title||!grade||!section){alert('La sesión debe tener fecha, grado y sección. Puedes corregirla desde Cursos → Editar sesión.');return}
  ensureClassData();
  db.classRecords.push({id:'class_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),date,title,purpose,criteria,grade,section,activity,session:ses.id,unit:ses.unit,createdAt:Date.now()});
  save();closeModal();render();
}
function editClassRecord30(){
  const id=document.getElementById('ceClass30')?.value,r=classRecordById(id);if(!r)return;
  const sessions=allSessionsForUI();
  modalBody.innerHTML=`<h2>✏️ Editar clase</h2>
    <label>📖 Sesión de aprendizaje</label><select id="crSession30" onchange="syncSessionToClass30()">${sessions.map(x=>`<option value="${escClass(x.id)}" ${String(r.session)===String(x.id)?'selected':''}>${escClass(sessionGradeLabel(x))} · Sesión ${escClass(x.number)}: ${escClass(x.title)}</option>`).join('')}</select>
    <div class="grid3"><div><label>Fecha</label><input id="crDate30" type="date" value="${escClass(r.date)}" readonly></div><div><label>Grado</label><input id="crGrade30" value="${escClass(r.grade)}" readonly></div><div><label>Sección</label><input id="crSec30" value="${escClass(r.section)}" readonly></div></div>
    <label>Título</label><input id="crTitle30" value="${escClass(r.title)}" readonly>
    <label>Propósito de aprendizaje</label><textarea id="crPurpose30" rows="3">${escClass(r.purpose||'')}</textarea>
    <label>Criterios de evaluación</label><textarea id="crCriteria30" rows="3">${escClass(r.criteria||'')}</textarea>
    <div class="actions" style="margin-top:15px"><button onclick="updateClassRecord30('${escClass(r.id)}')">Guardar cambios</button><button class="danger" onclick="deleteClassRecord30('${escClass(r.id)}')">Eliminar clase</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`;
  modal.classList.remove('hidden');syncSessionToClass30();
}
function updateClassRecord30(id){
  const r=classRecordById(id);if(!r)return;
  const ses=(db.sessions||[]).find(x=>String(x.id)===String(document.getElementById('crSession30')?.value));
  if(!ses){alert('Selecciona una sesión.');return}
  r.session=ses.id;r.unit=ses.unit;r.date=ses.date||document.getElementById('crDate30').value;r.title=ses.title;r.purpose=document.getElementById('crPurpose30').value.trim();r.criteria=document.getElementById('crCriteria30').value.trim();r.grade=ses.grade;r.section=ses.section;
  save();closeModal();render();
}
/* ===== FIN SESIONES POR GRADO/SECCIÓN + REGISTRO VINCULADO ===== */

function render(){
  if(me.role==='student' && ['groups','iaEPT','registro','activitiesGrades','participations','behavior','uniform','notebook','folder','exam','project','evalConfig','students','tracking','attendance','incidents','reports','backup','grades','creaEmprende'].includes(page)) page='home';
  const titles={home:'Inicio',students:'Estudiantes',groups:'Grupos',aiEPT:'🤖 IA EPT',timers:'⏱️ Cronómetros',courses:me.role==='teacher'?'Cursos':'Mis cursos',creaEmprende:'🏆 Crea y Emprende',materials:'Materiales',activities:'Actividades',registro:'Registro de clase',activitiesGrades:'Actividades evaluadas',participations:'Participación',behavior:'Conducta',uniform:'Uniforme',notebook:'Cuaderno',folder:'Folder',exam:'Examen / Fichas',project:'Proyecto 70 %',submissions:me.role==='teacher'?'Entregas':'Mis entregas',chat:'Mensajes',grades:'Evaluación final',tracking:'Seguimiento',attendance:'Asistencia',incidents:'Incidentes',reports:'Reportes',backup:'Respaldo',announcements:'Avisos',evalConfig:'Pesos'};
  pageTitle.textContent=titles[page]||'Aula Virtual'; pageSub.textContent=me.role==='teacher'?'Panel del docente':'Espacio del estudiante';
  const fn={home,students,groups,aiEPT,timers,courses,creaEmprende,materials,activities,registro:registroClase,activitiesGrades,participations,behavior,uniform,notebook,folder,exam,project,submissions,chat,grades,tracking,attendance,incidents,reports,backup,announcements,evalConfig:evaluationConfig}[page];
  content.innerHTML=fn?fn():"<div class='card'><h3>Página no encontrada</h3></div>";
  if(page==='students')setTimeout(()=>{if(typeof renderStudents23==='function')renderStudents23()},0);
  if(page==='registro')setTimeout(renderClass30,0);
}

ensureClassData();

</script>
