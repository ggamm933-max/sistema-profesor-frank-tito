  localStorage.setItem("aulaEPT",JSON.stringify(db));

/* ===== SINCRONIZACIÓN FIREBASE ===== */
const FIREBASE_DOCUMENT = "aulaEPT/main";

async function saveToFirebase(){
  try{
    if(!window.firebaseReady) return;
    await window.firebaseSetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
      { data: db, updatedAt: Date.now() }
    );
  }catch(error){
    console.error("Firebase: no se pudo guardar", error);
  }
}

async function loadFromFirebase(){
  try{
    if(!window.firebaseReady) return false;
    const snap = await window.firebaseGetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main")
    );
    if(snap.exists() && snap.data().data){
      db = snap.data().data;
      localStorage.setItem("aulaEPT", JSON.stringify(db));
      if(typeof render === "function") render();
      return true;
    }
  }catch(error){
    console.error("Firebase: no se pudo cargar", error);
  }
  return false;
}

function startFirebaseSync(){
  if(!window.firebaseReady) return;
  window.firebaseOnSnapshot(
    window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
    (snap)=>{
      if(snap.exists() && snap.data().data){
        db = snap.data().data;
        localStorage.setItem("aulaEPT", JSON.stringify(db));
        if(typeof render === "function") render();
      }
    },
    (error)=>console.error("Firebase: error de sincronización", error)
  );
}

window.addEventListener("firebase-ready", async ()=>{
  const exists = await loadFromFirebase();
  if(!exists) await saveToFirebase();
  startFirebaseSync();
});

function importStudents(){
 const raw=document.getElementById("importData").value.trim(); if(!raw){alert("Pega primero los datos de Excel.");return}
 let added=0,updated=0,skipped=0;
 raw.split(/\r?\n/).filter(x=>x.trim()).forEach((line,i)=>{
  const c=line.split(/\t/).map(x=>x.trim()); if(c.length<5){skipped++;return}
  let [name,user,pass,grade,section]=c;
  if(i===0 && /apellidos/i.test(name))return;
  grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º");section=section.toUpperCase();
  if(!name||!user||!pass||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
  const ex=db.users.find(x=>x.u===user);
  if(ex&&ex.role==="student"){ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++}
  else if(!ex){db.users.push({id:Date.now()+Math.random(),u:user,p:pass,role:"student",name,grade,section});added++}
  else skipped++;
 });
 save();closeModal();render();alert(`Importación terminada.\n\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
}

function importStudents(){
 const raw=document.getElementById("importData").value.trim(); if(!raw){alert("Pega primero los datos de Excel.");return}
 let added=0,updated=0,skipped=0;
 raw.split(/\r?\n/).filter(x=>x.trim()).forEach((line,i)=>{
  const c=line.split(/\t/).map(x=>x.trim()); if(c.length<5){skipped++;return}
  let [name,user,pass,grade,section]=c;
  if(i===0 && /apellidos/i.test(name))return;
  grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º"); section=section.toUpperCase();
  if(!name||!user||!pass||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
  const ex=db.users.find(x=>x.u===user);
  if(ex&&ex.role==="student"){ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++}
  else if(!ex){db.users.push({u:user,p:pass,role:"student",name:name,grade:grade,section:section});added++}
  else skipped++;
 });
 save();closeModal();render();setTimeout(renderStudentList,0);
 alert(`Importación terminada.\n\nAgregados: ${added}\nActualizados: ${updated}\nOmitidos: ${skipped}`);
}

function makeUsername(name){
 let base=name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
   .replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"");
 if(!base) base="estudiante";
 let u=base, n=2;
 while(db.users.some(x=>x.u===u)){u=base+"."+n;n++;}
 return u;
}
function importStudents(){
 const raw=document.getElementById("importData").value.trim();
 if(!raw){alert("Pega primero los datos.");return}
 const defaultGrade=document.getElementById("importGrade").value;
 const defaultSection=document.getElementById("importSection").value;
 let added=0,updated=0,skipped=0;
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 lines.forEach((line,i)=>{
   if(i===0 && /apellidos\s+y\s+nombres/i.test(line)) return;
   let c=line.split(/\t/).map(x=>x.trim()).filter((x,j)=>j<5);
   let name="",user="",pass="1234",grade=defaultGrade,section=defaultSection;
   if(c.length>=5){
      [name,user,pass,grade,section]=c;
      grade=grade.replace(/^(\d)[°ºo]\.?$/,"$1.º");
      section=section.toUpperCase();
   }else if(c.length===1){
      name=c[0];
      user=makeUsername(name);
   }else if(c.length===2){
      name=c[0];
      if(["A","B"].includes(c[1].toUpperCase())) section=c[1].toUpperCase();
      else if(["1.º","2.º","3.º","4.º","5.º"].includes(c[1])) grade=c[1];
      user=makeUsername(name);
   }else{
      skipped++;return;
   }
   if(!name||!["1.º","2.º","3.º","4.º","5.º"].includes(grade)||!["A","B"].includes(section)){skipped++;return}
   if(!user)user=makeUsername(name);
   if(!pass)pass="1234";
   const ex=db.users.find(x=>x.u===user);
   if(ex&&ex.role==="student"){
      ex.name=name;ex.p=pass;ex.grade=grade;ex.section=section;updated++;
   }else if(!ex){
      db.users.push({id:Date.now()+Math.random(),u:user,p:pass,role:"student",name:name,grade:grade,section:section});
      added++;
   }else skipped++;
 });
 save();closeModal();render();
 alert(`Importación terminada.\\n\\nAgregados: ${added}\\nActualizados: ${updated}\\nOmitidos: ${skipped}\\n\\nContraseña inicial: 1234`);
}

/* ===== VISUALIZACIÓN REAL DE MATERIALES v1.7.2 ===== */
function youtubeEmbed(url){
 try{
   const u=new URL(url);
   let id="";
   if(u.hostname.includes("youtu.be")) id=u.pathname.slice(1);
   else if(u.searchParams.get("v")) id=u.searchParams.get("v");
   else {
     const m=u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
     if(m)id=m[2];
   }
   return id?`https://www.youtube.com/embed/${id}`:null;
 }catch(e){return null}
}
function openMaterial(id){
 const m=db.materials.find(x=>x.id===id); if(!m)return;
 const url=m.url||m.link||"";
 const desc=m.description||m.desc||"";
 let body="";
 const yt=youtubeEmbed(url);
 if(yt){
   body=`<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin:15px 0">
    <iframe src="${yt}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe>
   </div>`;
 }else if(url && /\\.pdf($|[?#])/i.test(url)){
   body=`<iframe src="${url}" style="width:100%;height:520px;border:1px solid #ddd;border-radius:10px"></iframe>`;
 }else if(url){
   body=`<p><a href="${url}" target="_blank" rel="noopener"><button>🔗 Abrir recurso</button></a></p>`;
 }else{
   body=`<p class="muted">Este material todavía no tiene un enlace.</p>`;
 }
 modalBody.innerHTML=`<h2>${m.title}</h2><span class="badge">${m.type||"Recurso"}</span>
 <p>${desc}</p>${body}<button class="secondary" onclick="closeModal()">Cerrar</button>`;
 modal.classList.remove("hidden");
}

/* ===== YOUTUBE LOCAL FILE FIX v1.7.3 ===== */
function youtubeWatchUrl(url){
 try{
   const u=new URL(url);
   if(u.hostname.includes("youtu.be")){
     const id=u.pathname.slice(1).split("/")[0];
     return id?`https://www.youtube.com/watch?v=${id}`:url;
   }
   if(u.hostname.includes("youtube.com")){
     if(u.searchParams.get("v")) return `https://www.youtube.com/watch?v=${u.searchParams.get("v")}`;
     const m=u.pathname.match(/\/(embed|shorts)\/([^/?]+)/);
     if(m)return `https://www.youtube.com/watch?v=${m[2]}`;
   }
 }catch(e){}
 return url;
}

/* ===== VIDEO PROPIO DESDE PC v1.8 =====
   Guarda archivos seleccionados en IndexedDB del navegador.
   Esto permite probar carga/reproducción local. Para acceso desde otras PCs
   posteriormente habrá que conectar almacenamiento del servidor.
*/
const AULA_FILE_DB="AulaEPT_Files_v1";
let aulaFileDBPromise=null;
function openAulaFileDB(){
 if(aulaFileDBPromise)return aulaFileDBPromise;
 aulaFileDBPromise=new Promise((resolve,reject)=>{
   const r=indexedDB.open(AULA_FILE_DB,1);
   r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("files"))db.createObjectStore("files");};
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
 return aulaFileDBPromise;
}
async function saveAulaFile(id,file){
 const db=await openAulaFileDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,id);
   tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function getAulaFile(id){
 const db=await openAulaFileDB();
 return new Promise((resolve,reject)=>{
   const tx=db.transaction("files","readonly"),r=tx.objectStore("files").get(id);
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}

function importStudentsFromExcel(){
  const box=document.getElementById("excelStudentsPaste");
  if(!box) return;

  const raw=box.value.trim();
  if(!raw){
    alert("Pega primero la lista copiada desde Excel.");
    return;
  }

  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let added=0, skipped=0;

  lines.forEach((line,index)=>{
    let cols=line.split("\t").map(x=>x.trim());

    // También acepta ; o | si la lista no viene directamente desde Excel.
    if(cols.length<2){
      if(line.includes(";")) cols=line.split(";").map(x=>x.trim());
      else if(line.includes("|")) cols=line.split("|").map(x=>x.trim());
    }

    // Saltar encabezados habituales.
    const first=(cols[0]||"").toLowerCase();
    if(index===0 && (
      first.includes("nombre") ||
      first.includes("apellidos") ||
      first.includes("estudiante")
    )){
      skipped++;
      return;
    }

    if(cols.length<1 || !cols[0]) {
      skipped++;
      return;
    }

    const name=cols[0];
    const username=cols[1] || makeUsernameFromName(name);
    const password=cols[2] || "1234";
    const grade=cols[3] || "";
    const section=cols[4] || "";

    if(!db.users) db.users=[];

    // Evitar duplicados por usuario.
    if(db.users.some(u=>u.u===username)){
      skipped++;
      return;
    }

    db.users.push({
      u:username,
      p:password,
      role:"student",
      name:name,
      grade:grade,
      section:section
    });

    added++;
  });

  if(added===0){
    alert("No se importaron estudiantes. Revisa que las columnas estén separadas por tabulaciones.");
    return;
  }

  save();
  closeModal();
  render();

  alert(`✅ Se importaron ${added} estudiante(s).${skipped ? ` Se omitieron ${skipped}.` : ""}`);
}

function makeUsernameFromName(name){
  return name
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,".")
    .replace(/^\.+|\.+$/g,"");
}

function classLevel(n){n=Number(n);return n>=18?'AD':n>=15?'A':n>=11?'B':'C'}
function escClass(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function todayLocal30(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function classRecordById(id){ensureClassData();return db.classRecords.find(x=>String(x.id)===String(id))}
function classEvalRecord(classId,u){ensureClassData();return db.classEvaluations.find(x=>String(x.classId)===String(classId)&&x.user===u)}
function avgNums(a){const x=a.map(Number).filter(Number.isFinite);return x.length?x.reduce((s,n)=>s+n,0)/x.length:null}
function componentAvg(arr,u){
  const vals=(arr||[]).filter(x=>x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!=="").map(x=>Number(x.grade));
  return avgNums(vals);
}
function classAvg(u){return componentAvg(db.classEvaluations,u)}
function activitiesAvg(u){return componentAvg(db.activitiesGrades,u)}
function participationAvg(u){return componentAvg(db.participations,u)}
function behaviorAvg(u){return componentAvg(db.behaviorGrades,u)}
function uniformAvg(u){return componentAvg(db.uniformGrades,u)}
function notebookAvg(u){return componentAvg(db.notebookGrades,u)}
function folderAvg(u){return componentAvg(db.folderGrades,u)}
function examAvg(u){return componentAvg(db.examGrades,u)}
function projectAvg(u){
  const p=(db.projectGrades||[]).filter(x=>x.user===u);
  const vals=[];
  ['portfolio','product','exposition'].forEach(k=>{
    const x=p.filter(r=>r[k]!==null&&r[k]!==undefined&&r[k]!=="").map(r=>Number(r[k]));
    const av=avgNums(x); if(av!==null) vals.push(av);
  });
  return avgNums(vals);
}
function processAvg(u){
  return avgNums([classAvg(u),activitiesAvg(u),participationAvg(u),behaviorAvg(u),uniformAvg(u),notebookAvg(u),folderAvg(u),examAvg(u)].filter(x=>x!==null));
}
function finalGrade(u){
  const p=projectAvg(u), pr=processAvg(u);
  if(p===null&&pr===null)return null;
  return (p===null?0:p*.70)+(pr===null?0:pr*.30);
}
function evaluationDetail(u){
  const p=projectAvg(u), pr=processAvg(u), f=finalGrade(u);
  return {project:p,process:pr,final:f,level:f===null?'—':classLevel(f)};
}
function saveAndRenderEval(){save();render()}

function saveClassEval30(){
  ensureClassData();const id=document.getElementById('ceClass30')?.value,rec=classRecordById(id);if(!rec){alert('Primero crea una clase.');return}
  const ss=[...document.querySelectorAll('.ceStatus30')],gs=[...document.querySelectorAll('.ceGrade30')];let n=0;
  ss.forEach(e=>{const u=e.dataset.user,st=e.value,g=gs.find(x=>x.dataset.user===u),raw=g?g.value:'';let r=classEvalRecord(id,u);
    if(!st&&raw===''){if(r)db.classEvaluations=db.classEvaluations.filter(x=>x!==r);return}
    const grade=raw===''?null:Math.max(0,Math.min(20,Number(raw)));
    if(!r)db.classEvaluations.push({id:'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),classId:id,user:u,status:st,grade,date:rec.date,title:rec.title,gradeClass:rec.grade,section:rec.section});
    else{r.status=st;r.grade=grade}
    n++;
  });
  save();alert(`✅ Evaluación guardada. Registros de esta clase: ${n}`);renderClass30();
}

  ensureClassData();if(!db.groups.length)return `<div class="card"><p class="muted">Todavía no hay grupos.</p></div>`;
  return `<div class="grid3">${db.groups.map((g,i)=>{
    const ms=(g.members||[]).map(x=>db.users.find(u=>u.u===x)).filter(Boolean);
    const classRecs=db.classRecords.filter(r=>r.grade===g.grade&&r.section===g.section);
    const total=ms.length*classRecs.length;
    const done=ms.reduce((z,u)=>z+classRecs.filter(r=>{const ev=classEvalRecord(r.id,u.u);return ev&&ev.status&&ev.status!=='NO HIZO'}).length,0);
    const prog=total?Math.round(done/total*100):0;
    const grades=ms.flatMap(u=>db.classEvaluations.filter(r=>r.user===u.u&&r.grade!=null&&classRecs.some(c=>c.id===r.classId)).map(r=>Number(r.grade)));
    const avg=grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(1):'—';
    return `<div class="card"><div style="display:flex;justify-content:space-between"><div><h3>${escClass(g.name||'Grupo '+(i+1))}</h3><div class="muted">${escClass(g.grade)} — ${escClass(g.section)}</div></div><button class="small secondary" onclick="renameGroup30('${escClass(g.id)}')">✏️</button></div>
    <p><span class="badge">${ms.length} estudiantes</span> <span class="badge">Avance ${prog}%</span> <span class="badge">Promedio ${avg}</span></p>
    <div style="height:10px;background:#e2e8f0;border-radius:9px"><div style="height:100%;width:${prog}%;background:#2563eb;border-radius:9px"></div></div>
    <div class="list" style="margin-top:12px">${ms.map(u=>`<div class="item" style="padding:8px"><div><b>${escClass(u.name)}</b></div><select onchange="moveGroup30('${escClass(g.id)}','${escClass(u.u)}',this.value)" style="max-width:110px"><option value="">Mover…</option>${db.groups.filter(z=>z.id!==g.id&&z.grade===g.grade&&z.section===g.section).map(z=>`<option value="${escClass(z.id)}">${escClass(z.name)}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Sin estudiantes.</p>'}</div>
    <div class="actions" style="margin-top:10px"><button class="small" onclick="addGroupMember30('${escClass(g.id)}')">＋ Agregar</button><button class="small danger" onclick="deleteGroup30('${escClass(g.id)}')">Eliminar</button></div></div>`;
  }).join('')}</div>`;
}
function randomGroups30(){
  ensureClassData();const g=document.getElementById('gpGrade30')?.value,s=document.getElementById('gpSec30')?.value,n=Math.max(1,Math.min(20,Number(document.getElementById('gpCount30')?.value)||4));
  if(!g||!s){alert('Selecciona primero grado y sección.');return}
  const a=db.users.filter(u=>u.role==='student'&&u.grade===g&&u.section===s);
  if(!a.length){alert(`No hay estudiantes registrados en ${g} ${s}.`);return}
  db.groups=db.groups.filter(x=>!(x.grade===g&&x.section===s));
  const ng=Math.min(n,a.length);const grupos=Array.from({length:ng},(_,i)=>({id:'grp_'+Date.now()+'_'+i,name:'Grupo '+(i+1),grade:g,section:s,members:[]}));
  a.sort(()=>Math.random()-.5).forEach((u,i)=>grupos[i%grupos.length].members.push(u.u));db.groups.push(...grupos);save();render();
}
function emptyGroups30(){
  ensureClassData();const g=document.getElementById('gpGrade30')?.value,s=document.getElementById('gpSec30')?.value,n=Math.max(1,Math.min(20,Number(document.getElementById('gpCount30')?.value)||4));
  if(!g||!s){alert('Selecciona primero grado y sección.');return}
  db.groups=db.groups.filter(x=>!(x.grade===g&&x.section===s));db.groups.push(...Array.from({length:n},(_,i)=>({id:'grp_'+Date.now()+'_'+i,name:'Grupo '+(i+1),grade:g,section:s,members:[]})));save();render();
}
function renameGroup30(id){const g=db.groups.find(x=>x.id===id);if(!g)return;const n=prompt('Nombre del grupo:',g.name);if(n){g.name=n.trim();save();render()}}
function deleteGroup30(id){if(confirm('¿Eliminar este grupo?')){db.groups=db.groups.filter(x=>x.id!==id);save();render()}}
function moveGroup30(from,u,to){if(!to)return;const a=db.groups.find(x=>x.id===from),b=db.groups.find(x=>x.id===to);if(!a||!b||a.grade!==b.grade||a.section!==b.section){alert('Solo puedes mover estudiantes dentro del mismo grado y sección.');return}a.members=(a.members||[]).filter(x=>x!==u);if(!b.members.includes(u))b.members.push(u);save();render()}
function addGroupMember30(id){const g=db.groups.find(x=>x.id===id);if(!g)return;const used=new Set(db.groups.flatMap(x=>x.members||[])),a=db.users.filter(u=>u.role==='student'&&u.grade===g.grade&&u.section===g.section&&!used.has(u.u));if(!a.length){alert('No quedan estudiantes sin asignar en este grado y sección.');return}modalBody.innerHTML=`<h2>＋ Agregar estudiante</h2><p class="muted">Solo ${escClass(g.grade)} ${escClass(g.section)}.</p><select id="gm30">${a.map(u=>`<option value="${escClass(u.u)}">${escClass(u.name)}</option>`).join('')}</select><div class="actions"><button onclick="saveGroupMember30('${escClass(id)}')">Agregar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`;modal.classList.remove('hidden')}
function saveGroupMember30(id){const g=db.groups.find(x=>x.id===id),u=document.getElementById('gm30')?.value,stu=db.users.find(x=>x.u===u);if(!g||!stu)return;if(stu.grade!==g.grade||stu.section!==g.section){alert('El estudiante pertenece a otro grado/sección.');return}g.members=g.members||[];if(!g.members.includes(u))g.members.push(u);save();closeModal();render()}

/* ===== PANEL GENERAL DE EVALUACIÓN ===== */
function grades(){
  if(me.role==='student'){
    page='home';
    buildNav();
    return home();
  }
  ensureClassData();
  const students=(db.users||[]).filter(u=>u.role==='student');
  return `<div class="card"><h2>📊 Evaluación integral</h2><p class="muted"><b>70 % Proyecto</b> (Portafolio + Producto + Exposición) + <b>30 % Proceso</b>.</p>
    <div class="actions"><button onclick="go('project')">🚀 Proyecto 70 %</button><button onclick="go('registro')">📝 Registro de clase</button><button onclick="go('activitiesGrades')">💻 Actividades</button><button onclick="go('participations')">🙋 Participación</button><button onclick="go('behavior')">🧑‍🏫 Conducta</button><button onclick="go('uniform')">👕 Uniforme</button><button onclick="go('notebook')">📓 Cuaderno</button><button onclick="go('folder')">📁 Folder</button><button onclick="go('exam')">📋 Examen/Fichas</button><button class="secondary" onclick="go('evalConfig')">⚙️ Pesos</button></div>
    <div style="overflow:auto;margin-top:18px"><table><tr><th>Estudiante</th><th>Proyecto 70%</th><th>Proceso 30%</th><th>Final</th><th>Nivel</th></tr>
    ${students.map(u=>{const d=evaluationDetail(u.u);return `<tr><td>${escClass(u.name)}</td><td>${d.project===null?'—':d.project.toFixed(2)}</td><td>${d.process===null?'—':d.process.toFixed(2)}</td><td><b>${d.final===null?'—':d.final.toFixed(2)}</b></td><td>${d.level}</td></tr>`}).join('')}</table></div></div>`;
}

/* Mantener grupos/registro accesibles aunque el menú se construya después. */

function buildNav(){
  if(me.role==='teacher'){
    const top=[['home','🏠','Inicio'],['students','👥','Estudiantes'],['groups','👥','Grupos'],['courses','📚','Cursos'],['materials','🎬','Materiales'],['activities','📝','Actividades']];
    const extra=[['submissions','📥','Entregas'],['chat','💬','Mensajes'],['tracking','📈','Seguimiento'],['attendance','🗓️','Asistencia'],['incidents','📝','Incidentes'],['reports','📑','Reportes'],['backup','💾','Respaldo'],['announcements','📢','Avisos']];
    const process=[['registro','✅','Registro de clase'],['activitiesGrades','💻','Actividades evaluadas'],['participations','🙋','Participación'],['behavior','🧑‍🏫','Conducta'],['uniform','👕','Uniforme'],['notebook','📓','Cuaderno'],['folder','📁','Folder'],['exam','📋','Examen / Fichas']];
    const b=a=>`<button class="${page===a[0]?'active':''}" onclick="go('${a[0]}')">${a[1]} <span>${a[2]}</span></button>`;
    nav.innerHTML=top.map(b).join('')+`<div class="nav-group-title">📊 EVALUACIÓN</div>`+b(['grades','📊','Evaluación final'])+`<button class="nav-group-toggle" onclick="toggleEvalMenu()">🧮 <span>Proceso 30 %</span></button>`+`<div id="evalMenu" class="nav-sub" style="display:${['registro','activitiesGrades','participations','behavior','uniform','notebook','folder','exam'].includes(page)?'block':'none'}">${process.map(b).join('')}</div>`+b(['project','🚀','Proyecto 70 %'])+extra.map(b).join('');
  }else{
    const arr=[['home','🏠','Inicio'],['courses','📚','Mis cursos'],['materials','🎬','Materiales'],['activities','📝','Actividades'],['submissions','📤','Mis entregas'],['chat','💬','Mensajes'],['announcements','📢','Avisos']];
    nav.innerHTML=arr.map(a=>`<button class="${page===a[0]?'active':''}" onclick="go('${a[0]}')">${a[1]} <span>${a[2]}</span></button>`).join('');
  }
}
function toggleEvalMenu(){const x=document.getElementById('evalMenu');if(x)x.style.display=x.style.display==='none'?'block':'none';}
function render(){
  if(me.role==='student' && ['groups','registro','activitiesGrades','participations','behavior','uniform','notebook','folder','exam','project','evalConfig','students','tracking','attendance','incidents','reports','backup','grades'].includes(page)) page='home';
  const titles={home:'Inicio',students:'Estudiantes',groups:'Grupos',courses:me.role==='teacher'?'Cursos':'Mis cursos',materials:'Materiales',activities:'Actividades',registro:'Registro de clase',activitiesGrades:'Actividades evaluadas',participations:'Participación',behavior:'Conducta',uniform:'Uniforme',notebook:'Cuaderno',folder:'Folder',exam:'Examen / Fichas',project:'Proyecto 70 %',submissions:me.role==='teacher'?'Entregas':'Mis entregas',chat:'Mensajes',grades:'Evaluación final',tracking:'Seguimiento',attendance:'Asistencia',incidents:'Incidentes',reports:'Reportes',backup:'Respaldo',announcements:'Avisos',evalConfig:'Pesos'};pageTitle.textContent=titles[page]||'Aula Virtual';pageSub.textContent=me.role==='teacher'?'Panel del docente':'Espacio del estudiante';const fn={home,students,groups,courses,materials,activities,registro:registroClase,activitiesGrades,participations,behavior,uniform,notebook,folder,exam,project,submissions,chat,grades,tracking,attendance,incidents,reports,backup,announcements,evalConfig:evaluationConfig}[page];content.innerHTML=fn?fn():"<div class='card'><h3>Página no encontrada</h3></div>";if(page==='students')setTimeout(()=>{if(typeof renderStudents23==='function')renderStudents23()},0);if(page==='registro')setTimeout(renderClass30,0)}
ensureClassData();
