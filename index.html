    const m=modeEl.value==='grupal'?'grupal':'individual';
    const hint=document.getElementById('creaRecModeHint31');
    if(hint)hint.innerHTML=m==='grupal'?'👥 Se utilizará la rúbrica de exposición grupal: “Organización del equipo emprendedor”.':'👤 Se utilizará la rúbrica de exposición individual: “Organización del trabajo emprendedor”.';
    refreshCreaRecoveryGroupUI31(user);
  });}
  if(groupEl)groupEl.addEventListener('change',()=>refreshCreaRecoveryGroupUI31(user));
  refreshCreaRecoveryGroupUI31(user);
  const update=()=>{
    const pSelected=[...document.querySelectorAll('.creaRecPL31')].map(x=>String(x.value||''));
    const pv=pSelected.filter(v=>/^\d+$/.test(v)).map(Number).filter(n=>n>=1&&n<=4);
    const ev=[...document.querySelectorAll('.creaRecEL31')].map(x=>Number(x.value)).filter(n=>Number.isFinite(n)&&n>=1&&n<=4);
    const prSelected=[...document.querySelectorAll('.creaRecPR31')].map(x=>String(x.value||''));
    const rv=prSelected.filter(v=>/^\d+$/.test(v)).map(Number).filter(n=>n>=1&&n<=4);
    const p=pv.length?Math.max(0,Math.min(20,pv.reduce((a,b)=>a+b,0)/(pv.length*4)*20)):(importedPortfolio?importedPortfolioValue:null);
    const e=ev.length===recoveryExpoCriteria.length&&recoveryExpoCriteria.length?Math.max(0,Math.min(20,ev.reduce((a,b)=>a+b,0))):null;
    const prod=rv.length?Math.max(0,Math.min(20,rv.reduce((a,b)=>a+b,0)/(rv.length*4)*20)):null;
    const pe=document.getElementById('creaRecP31'),ee=document.getElementById('creaRecE31');
    if(pe)pe.textContent=p===null?'—':p.toFixed(2); if(ee)ee.textContent=e===null?'—':e.toFixed(2);
  };
  window.toggleCreaRecoveryProduct31=()=>{
    const on=document.getElementById('creaRecProductPresented31')?.checked===true;
    document.querySelectorAll('.creaRecProductBox31').forEach(el=>el.style.display=on?'block':'none');
    update();
  };
  document.querySelectorAll('.creaRecPL31,.creaRecEL31').forEach(x=>x.addEventListener('change',update));
  update();
}
function saveCreaRecoveryEval31(user){
  ensureClassData();
  const st=(db.users||[]).find(x=>x.u===user);if(!st)return;
  const cat=categoryForStudent(st);
  const manualPc=CREA_RECOVERY_PORTFOLIO_CRITERIA31||[], contestPc=db.projectRubrics[cat+'_portfolio']||[];
  const existing=(db.creaRecoveryEvaluations||[]).find(x=>x.user===user)||{};
  const recoveryMode=String(document.getElementById('creaRecMode31')?.value||existing.creaRecoveryMode||'individual')==='grupal'?'grupal':'individual';
  const recoveryExpoCriteria=recoveryExpoCriteria31(recoveryMode);
  const portfolioMode=String(document.getElementById('creaRecPortfolioMode31')?.value||creaRecoveryPortfolioMode31(st,existing))==='concurso'?'concurso':'manual';
  const pc=portfolioMode==='concurso'?contestPc:manualPc;
  const importedPortfolio=existing.portfolioImportedFromWeekly===true && Number.isFinite(Number(existing.portfolio));
  const importedPortfolioValue=importedPortfolio?Number(existing.portfolio):null;
  const p=[...document.querySelectorAll('.creaRecPL31')].map(x=>String(x.value||''));
  const importedCount=Number(existing.portfolioImportedCriterionCount||0);
  const importedHistorical=(portfolioMode==='concurso' && existing.portfolioImportedFromWeekly===true && importedCount>0 && importedCount<pc.length);
  const eRaw=[...document.querySelectorAll('.creaRecEL31')].map(x=>String(x.value||''));
  const productPresented=document.getElementById('creaRecProductPresented31')?.checked===true;
  const prRaw=[...document.querySelectorAll('.creaRecPR31')].map(x=>String(x.value||''));
  const validP=p.every(v=>v===''||v==='ND'||/^[1-4]$/.test(v));
  const evaluatedP=p.filter(v=>/^[1-4]$/.test(v)).map(Number);
  const hasPortfolioRubricEntry=p.some(v=>v!=='');
  let portfolio=null;
  let portfolioFromRubric=false;
  if(hasPortfolioRubricEntry){
    const contestMode=portfolioMode==='concurso';
    const incomplete=p.length!==pc.length||p.some(v=>v==='')||evaluatedP.length===0;
    if(contestMode){
      // En la recuperación con rúbrica del concurso, los criterios históricos se
      // trasladan con sus niveles y los criterios añadidos quedan habilitados.
      // El docente puede calificarlos ahora o dejarlos en blanco si no fueron enseñados.
      // Los criterios en blanco no participan en el promedio.
      if(importedHistorical){
        const historicalPart=p.slice(0,importedCount);
        if(historicalPart.length!==importedCount || historicalPart.some(v=>!/^[1-4]$/.test(v))){
          alert('Los niveles históricos trasladados no están completos. Revisa los criterios que ya habían sido evaluados.');
          return;
        }
      }else if(p.some(v=>v!=='' && !/^[1-4]$/.test(v))){
        alert('Cada criterio del concurso debe tener Nivel 1, 2, 3 o 4, o quedar en blanco si todavía no corresponde calificarlo.');
        return;
      }
    }else if(incomplete||!validP){
      alert('Completa los criterios del Portafolio manual con niveles de 1 a 4. Los aspectos que no fueron desarrollados en aula pueden marcarse como “No desarrollado / no trabajado en aula”. Debe existir al menos un criterio evaluado.');
      return;
    }
    const historicalEvaluated=importedHistorical?evaluatedP.slice(0,importedCount):evaluatedP;
    const contestEvaluated=portfolioMode==='concurso'?evaluatedP:historicalEvaluated;
    if(!contestEvaluated.length){
      alert('Debe existir al menos un criterio evaluado para calcular el Portafolio.');
      return;
    }
    portfolio=Math.max(0,Math.min(20,contestEvaluated.reduce((a,b)=>a+b,0)/(contestEvaluated.length*4)*20));
    portfolioFromRubric=true;
  }else if(importedPortfolio && portfolioMode==='concurso'){
    portfolio=importedPortfolioValue;
  }else{
    alert(portfolioMode==='concurso'?'Completa los criterios del concurso o utiliza la nota trasladada de 11–20 ya registrada si aparece indicada arriba.':'Completa los criterios del Portafolio manual de recuperación.');
    return;
  }
  // La recuperación puede guardarse por etapas: primero Portafolio y después Exposición.
  // No se obliga a tener la exposición para poder guardar el trabajo que ya realizó el estudiante.
  const expoCompleted=eRaw.every(v=>/^[1-4]$/.test(v));
  const exposition=expoCompleted?Math.max(0,Math.min(20,eRaw.map(Number).reduce((a,b)=>a+b,0))):null;
  if(productPresented && (prRaw.length!==productCriteria.length || prRaw.some(v=>!/^[1-4]$/.test(v)))){
    alert('Has indicado que presentó producto/prototipo. Completa todos los criterios del Producto con niveles de 1 a 4, o desmarca “Presentó producto / prototipo” si todavía no lo presenta.');
    return;
  }
  const product=productPresented?Math.max(0,Math.min(20,prRaw.map(Number).reduce((a,b)=>a+b,0)/(productCriteria.length*4)*20)):null;
  let r=(db.creaRecoveryEvaluations||[]).find(x=>x.user===user);
  if(!r){r={id:'crec_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),user};db.creaRecoveryEvaluations.push(r);}
  r.category=cat;
  r.mode='recuperacion_pedagogica';
  r.creaRecoveryMode=String(document.getElementById('creaRecMode31')?.value||'individual')==='grupal'?'grupal':'individual';
  r.creaRecoveryGroupId=r.creaRecoveryMode==='grupal'?(document.getElementById('creaRecGroup31')?.value||''):'';
  if(r.creaRecoveryMode==='grupal'&&!r.creaRecoveryGroupId){alert('Selecciona un grupo existente de Crea y Emprende o un grupo nuevo de recuperación que hayas creado desde “Administrar grupos de recuperación”.');return;}
  const chosenRecoveryGroup=r.creaRecoveryMode==='grupal'?getCreaRecoveryGroupById31(r.creaRecoveryGroupId,st.grade,st.section):null;
  if(r.creaRecoveryMode==='grupal' && chosenRecoveryGroup?.source==='Grupo de recuperación'){
    const customGroup=(db.creaRecoveryGroups||[]).find(g=>String(g.id)===String(r.creaRecoveryGroupId));
    if(customGroup){
      if(!Array.isArray(customGroup.memberUsers))customGroup.memberUsers=[];
      if(!customGroup.memberUsers.some(id=>String(id)===String(user)))customGroup.memberUsers.push(user);
    }
  }
  r.creaRecoveryGroupName=chosenRecoveryGroup?.name||'';
  r.portfolioRubricMode=portfolioMode;
  st.creaRecoveryPortfolioMode=portfolioMode;
  r.portfolioLevels=portfolioFromRubric?(importedHistorical?p.slice(0,importedCount):p):[];
  r.portfolio=portfolio;
  if(importedHistorical) r.portfolioImportedCriterionCount=importedCount;
  r.portfolioEvaluatedCriteria=portfolioFromRubric?evaluatedP.length:0;
  r.portfolioNotDevelopedCriteria=portfolioFromRubric?p.filter(v=>v==='ND').length:0;
  r.portfolioImportedFromWeekly=importedHistorical?true:(portfolioFromRubric?false:importedPortfolio);
  if(portfolioFromRubric) delete r.portfolioImportedAt;
  if(portfolioFromRubric) r.portfolioSource=portfolioMode==='concurso'?'Criterios oficiales del concurso Crea y Emprende':'Rúbrica específica de recuperación manual';
  r.expositionLevels=expoCompleted?eRaw.map(Number):[];
  r.exposition=exposition;
  r.productLevels=productPresented?prRaw.map(Number):[];
  r.product=product;
  r.productPresented=productPresented;
  r.savedAt=Date.now();
  r.portfolioSavedAt=Date.now();
  r.expositionSavedAt=expoCompleted?Date.now():(r.expositionSavedAt||null);
  save();closeModal();render();
  alert(expoCompleted
    ? `✅ Recuperación de Crea y Emprende guardada.\nModalidad: ${recoveryMode==='grupal'?'Grupal · '+(r.creaRecoveryGroupName||'Grupo sin nombre'):'Individual'}\nPortafolio: ${portfolio.toFixed(2)} / 20\nExposición: ${exposition.toFixed(2)} / 20\nProducto: ${productPresented?product.toFixed(2)+' / 20':'No presentado'}\n\nLos criterios del concurso que quedaron en blanco no participan en el promedio.\nEl Proyecto de recuperación tendrá máximo 14 puntos (B).`
    : `✅ Portafolio de recuperación guardado.\nPortafolio: ${portfolio.toFixed(2)} / 20\nExposición: Pendiente\nProducto: ${productPresented?product.toFixed(2)+' / 20':'Pendiente / opcional'}\n\nPuedes cerrar ahora y registrar la exposición después.\nLos criterios del concurso que quedaron en blanco no participan en el promedio.\nEl Proyecto de recuperación se calculará recién cuando completes la Exposición; Portafolio + Exposición son el mínimo requerido. Máximo 14 puntos (B).`);
}
function creaRecovery31(){
  ensureClassData();
  const students=(db.users||[]).filter(u=>u.role==='student'&&u.creaRecovery===true).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es'));
  const rows=students.map((u,i)=>{
    const r=(db.creaRecoveryEvaluations||[]).find(x=>x.user===u.u)||{};
    const complete=Number.isFinite(Number(r.portfolio))&&Number.isFinite(Number(r.exposition));
    const hasProduct=r.product!==null&&r.product!==undefined&&Number.isFinite(Number(r.product));
    const project=complete?Math.max(0,Math.min(14,(Number(r.portfolio)*30+Number(r.exposition)*40+(hasProduct?Number(r.product)*30:0))/(hasProduct?100:70))):null;
    const final=finalGrade(u.u);const lv=final===null?'Pendiente':classLevel(final);
    const portfolioMode=creaRecoveryPortfolioMode31(u,r);
    const portfolioModeLabel=portfolioMode==='concurso'?'🏆 Concurso':'📁 Manual';
    const recoveryMode=r.creaRecoveryMode==='grupal'?'👥 Grupal':'👤 Individual';
    const recoveryGroup=r.creaRecoveryMode==='grupal'?(r.creaRecoveryGroupName||'Grupo sin nombre'):'Sin grupo';
    return `<tr><td>${i+1}</td><td><b>${escClass(u.name||u.u)}</b><div class="muted">${escClass(u.grade||'')} · ${escClass(u.section||'')} · ${portfolioModeLabel}<br>${recoveryMode}${r.creaRecoveryMode==='grupal'?` · ${escClass(recoveryGroup)}`:''}</div></td><td>${r.portfolio!=null?Number(r.portfolio).toFixed(2):'—'}</td><td>${r.exposition!=null?Number(r.exposition).toFixed(2):'—'}</td><td>${hasProduct?Number(r.product).toFixed(2):'No presentado'}</td><td><b>${project===null?'—':project.toFixed(2)}</b></td><td><b>${final===null?'Pendiente':Number(final).toFixed(2)}</b></td><td>${lv}</td><td><button class="small" onclick="openCreaRecoveryEval31('${escClass(u.u)}')">${complete?'✏️ Modificar':'📝 Evaluar'}</button></td></tr>`;
  }).join('');
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">🏆 Recuperación pedagógica — Crea y Emprende</h2><button class="secondary" onclick="openCreaRecoveryGroupManager31()">👥 Administrar grupos de recuperación</button></div><p class="muted" style="margin-top:10px">Estudiantes que no participaron en la etapa institucional y desarrollan posteriormente el proyecto en aula. <b>Portafolio + Exposición son obligatorios</b>; <b>Producto es opcional</b> y solo se incorpora si realmente lo presentan.</p><div class="alert"><b>Regla:</b> Portafolio + Exposición son el mínimo. Sin Producto, Proyecto = Portafolio 30% + Exposición 40% normalizado sobre 70%. Con Producto, se incorpora 30%. El máximo es <b>14 puntos (B)</b>.</div><div style="overflow:auto;margin-top:15px"><table><tr><th>#</th><th>Estudiante</th><th>Portafolio /20</th><th>Exposición /20</th><th>Producto /20</th><th>Proyecto recup.</th><th>Final</th><th>Nivel</th><th></th></tr>${rows||'<tr><td colspan="9">No hay estudiantes marcados para esta modalidad.</td></tr>'}</table></div></div>`;
}
