<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    getFirestore, doc, getDoc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    projectId: "sistema-profesor-frank-tito",
    storageBucket: "sistema-profesor-frank-tito.firebasestorage.app",
    messagingSenderId: "403594585544",
    appId: "1:403594585544:web:3ad952eb88b3805aae4cfd"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const firestore = getFirestore(firebaseApp);

  window.firebaseDB = firestore;
  window.firebaseDoc = doc;
  window.firebaseGetDoc = getDoc;
  window.firebaseSetDoc = setDoc;
  window.firebaseOnSnapshot = onSnapshot;
  window.firebaseReady = true;

  window.dispatchEvent(new Event("firebase-ready"));

/* ===== CORRECCIÓN v20: ACTIVIDADES = NOTAS DESDE ENTREGAS =====
   La calificación se coloca únicamente al revisar la entrega.
   "Actividades evaluadas" solo consulta y muestra esas calificaciones.
*/
function activitiesAvg(u){
  const subs=(db.submissions||[]).filter(s=>s.user===u && s.grade!==null && s.grade!==undefined && s.grade!=="");
  return avgNums(subs.map(s=>Number(s.grade)));
}

function activitySubmissionFor(userId, activityId){
  return (db.submissions||[]).find(s=>String(s.user)===String(userId) && String(s.activity)===String(activityId));
}

window.activityGradeModal9 = function(activityId){
  const a=(db.activities||[]).find(x=>String(x.id)===String(activityId));
  if(!a)return;
  const students=(db.users||[]).filter(u=>u.role==="student" && u.grade===a.grade && u.section===a.section);
  const rows=students.map((u,i)=>{
    const s=activitySubmissionFor(u.u,a.id);
    let estado="Sin entrega";
    let nota="—";
    if(s){
      estado=s.grade!==null && s.grade!==undefined && s.grade!=="" ? "Calificada" : "Pendiente de revisión";
      nota=s.grade!==null && s.grade!==undefined && s.grade!=="" ? `${Number(s.grade).toFixed(0)}/20` : "—";
    }
    return `<tr>
      <td>${i+1}</td>
      <td><b>${escClass(u.name)}</b></td>
      <td>${escClass(u.grade||"—")}</td>
      <td>${escClass(u.section||"—")}</td>
      <td>${estado}</td>
      <td><b>${nota}</b></td>
    </tr>`;
  }).join("");

  modalBody.innerHTML=`<h2>📊 ${escClass(a.title)}</h2>
    <p class="muted">La nota se obtiene de <b>Entregas → Revisar entrega</b>. Aquí solo se consulta.</p>
    <div class="item" style="margin:12px 0">
      <b>🎓 Aula:</b> ${escClass(a.grade)} · ${escClass(a.section)}
      ${a.due?` · <b>Fecha:</b> ${escClass(a.due)}`:""}
    </div>
    <div style="overflow:auto">
      <table>
        <tr><th>N.º</th><th>Estudiante</th><th>Grado</th><th>Sección</th><th>Estado</th><th>Nota</th></tr>
        ${rows||`<tr><td colspan="6">No hay estudiantes registrados en ${escClass(a.grade)} ${escClass(a.section)}.</td></tr>`}
      </table>
    </div>
    <div class="actions" style="margin-top:15px">
      <button class="secondary" onclick="closeModal()">Cerrar</button>
    </div>`;
  modal.classList.remove("hidden");
}

function activitiesGrades(){
  if(me.role!=="teacher")return `<div class="card"><h2>💻 Actividades evaluadas</h2><p class="muted">Solo para el docente.</p></div>`;
  const allActs=(db.activities||[]).slice().sort((a,b)=>String(b.due||"").localeCompare(String(a.due||"")));
  const selectedGrade=window.activityGradeFilter||"";
  const selectedSection=window.activitySectionFilter||"";
  const acts=allActs.filter(a=>{
    const g=a.grade||"";
    const sec=a.section||"";
    return (!selectedGrade || g===selectedGrade) && (!selectedSection || sec===selectedSection);
  });
  const gradeOptions=["1.º","2.º","3.º","4.º","5.º"].map(g=>`<option value="${g}" ${selectedGrade===g?"selected":""}>${g}</option>`).join("");
  const sectionOptions=["A","B"].map(sec=>`<option value="${sec}" ${selectedSection===sec?"selected":""}>${sec}</option>`).join("");
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div>
        <h2>💻 Actividades evaluadas</h2>
        <p class="muted">Selecciona el grado y sección. Así no se mezclan las actividades de los diferentes salones.</p>
      </div>
      <button onclick="go('submissions')">📥 Ir a Entregas</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin:15px 0">
      <label style="margin:0;min-width:180px">Grado
        <select id="activityGradeFilter" onchange="setActivityFilter9()">
          <option value="">Seleccionar grado</option>${gradeOptions}
        </select>
      </label>
      <label style="margin:0;min-width:150px">Sección
        <select id="activitySectionFilter" onchange="setActivityFilter9()">
          <option value="">Seleccionar sección</option>${sectionOptions}
        </select>
      </label>
      <button class="secondary" onclick="clearActivityFilter9()">🔄 Mostrar todos</button>
    </div>
    ${selectedGrade&&selectedSection?`<div class="badge" style="display:inline-block;margin-bottom:10px">Mostrando: ${escClass(selectedGrade)} · ${escClass(selectedSection)}</div>`:`<div class="muted" style="margin:8px 0 15px">Selecciona un grado y una sección para trabajar con un solo salón.</div>`}
    <div class="list" style="margin-top:5px">
      ${acts.map(a=>{
        const students=(db.users||[]).filter(u=>u.role==="student"&&u.grade===a.grade&&u.section===a.section);
        const subs=(db.submissions||[]).filter(s=>String(s.activity)===String(a.id));
        const graded=subs.filter(s=>s.grade!==null&&s.grade!==undefined&&s.grade!=="").length;
        const pending=Math.max(0,students.length-graded);
        return `<div class="item">
          <div>
            <span class="badge">${escClass(a.grade)} · ${escClass(a.section)}</span>
            <h3 style="margin:7px 0">${escClass(a.title)}</h3>
            <div class="muted">${a.due?"Fecha de entrega: "+escClass(a.due):"Sin fecha de entrega"}</div>
            <small>${students.length} estudiante(s) · ${graded} calificada(s) · ${pending} pendiente(s) de revisión</small>
          </div>
          <button onclick="activityGradeModal9('${escClass(a.id)}')">👁️ Ver notas</button>
        </div>`;
      }).join("")||(selectedGrade&&selectedSection?`<div class="item"><b>No hay actividades para ${escClass(selectedGrade)} · ${escClass(selectedSection)}.</b></div>`:`<div class="item"><b>Selecciona grado y sección.</b><div class="muted">Las actividades de cada salón se mostrarán por separado.</div></div>`)}
    </div>
  </div>`;
}
function setActivityFilter9(){
  window.activityGradeFilter=document.getElementById('activityGradeFilter')?.value||"";
  window.activitySectionFilter=document.getElementById('activitySectionFilter')?.value||"";
  // Mantener el mismo salón seleccionado al pasar a Entregas.
  window.submissionGradeFilter=window.activityGradeFilter;
  window.submissionSectionFilter=window.activitySectionFilter;
  render();
}
function clearActivityFilter9(){
  window.activityGradeFilter="";
  window.activitySectionFilter="";
  window.submissionGradeFilter="";
  window.submissionSectionFilter="";
  window.submissionActivityFilter="";
  render();
}
function setSubmissionFilter9(grade,section){
  window.submissionGradeFilter=grade||"";
  window.submissionSectionFilter=section||"";
  page='submissions';
  buildNav();
  render();
}
window.openFilteredSubmissions9 = function(grade,section,activityId){
  // Abre Entregas con el MISMO grado, sección y actividad.
  // Así nunca se mezclan estudiantes de otros salones ni otras actividades.
  window.submissionGradeFilter=String(grade||"");
  window.submissionSectionFilter=String(section||"");
  window.submissionActivityFilter=String(activityId||"");
  page='submissions';
  buildNav();
  render();
}
window.changeSubmissionFilter9 = function(){
  window.submissionGradeFilter=document.getElementById('submissionGradeFilter')?.value||"";
  window.submissionSectionFilter=document.getElementById('submissionSectionFilter')?.value||"";
  render();
}
window.clearSubmissionFilter9 = function(){
  window.submissionGradeFilter="";
  window.submissionSectionFilter="";
  window.submissionActivityFilter="";
  render();
}
/* ===== FIN CORRECCIÓN v23 ===== */

/* ===== FIN CORRECCIÓN v20 ===== */

</script>

<script>
const seed = {
 users:[
  {u:"profesor",p:"1234",role:"teacher",name:"Prof. Frank Carlos Tito Chávez"}
 ],
 materials:[],
 activities:[],
 submissions:[],
 messages:[],
 courses:[{id:1,name:"Educación para el Trabajo",area:"EPT",description:"Computación e Informática"}],
 units:[],
 sessions:[],
 attendance:{},
 incidents:[],
 announcements:[]
};
let db=JSON.parse(localStorage.getItem("aulaEPT")||JSON.stringify(seed));
let me=null, page="home";
function save(){
  localStorage.setItem("aulaEPT",JSON.stringify(db));
  if(typeof saveToFirebase === "function") saveToFirebase();
}

/* ===== SINCRONIZACIÓN FIREBASE ===== */
const FIREBASE_DOCUMENT = "aulaEPT/main";

async function saveToFirebase(){
  try{
    if(!window.firebaseReady) return;
    await window.firebaseSetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
      { data: db, updatedAt: Date.now() }
    );
  }catch(error){
    console.error("Firebase: no se pudo guardar", error);
  }
}

async function loadFromFirebase(){
  try{
    if(!window.firebaseReady) return false;
    const snap = await window.firebaseGetDoc(
      window.firebaseDoc(window.firebaseDB, "aulaEPT", "main")
    );
    if(snap.exists() && snap.data().data){
      db = snap.data().data;
      localStorage.setItem("aulaEPT", JSON.stringify(db));
      if(me && typeof render === "function") render();
      return true;
    }
  }catch(error){
    console.error("Firebase: no se pudo cargar", error);
  }
  return false;
}

function startFirebaseSync(){
  if(!window.firebaseReady) return;
  window.firebaseOnSnapshot(
    window.firebaseDoc(window.firebaseDB, "aulaEPT", "main"),
    (snap)=>{
      if(snap.exists() && snap.data().data){
        db = snap.data().data;
        localStorage.setItem("aulaEPT", JSON.stringify(db));
        if(me && typeof render === "function") render();
      }
    },
    (error)=>console.error("Firebase: error de sincronización", error)
  );
}

window.addEventListener("firebase-ready", async ()=>{
  const exists = await loadFromFirebase();
  if(!exists) await saveToFirebase();
  startFirebaseSync();
});

function refreshDB29(){
 try{
  const raw=localStorage.getItem("aulaEPT");
  if(raw){
   const fresh=JSON.parse(raw);
   if(fresh && typeof fresh==="object"){db=fresh; if(me&&db.users){const updated=db.users.find(u=>u.u===me.u); if(updated)me=updated;}}
  }
 }catch(e){}
}

function normalizeStudentPassword(u){
 if(u && u.role==="student" && u.p==null && u.pw!=null){u.p=u.pw;delete u.pw;save();}
 return u;
}
function login(){
 const u=username.value.trim(), p=password.value;
 const x=db.users.find(a=>a.u===u&&a.p===p);
 if(!x){alert("Usuario o contraseña incorrectos.");return}
 me=x; localStorage.setItem("session",x.u); start();

const AULA_SUB_DB="AulaEPT_Submissions_v1";
let aulaSubDBPromise=null;
function openSubFileDB(){
 if(aulaSubDBPromise)return aulaSubDBPromise;
 aulaSubDBPromise=new Promise((resolve,reject)=>{
   const r=indexedDB.open(AULA_SUB_DB,1);
   r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("files"))d.createObjectStore("files");};
   r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
 return aulaSubDBPromise;
}
async function saveSubFile(id,file){
 const d=await openSubFileDB();
 return new Promise((resolve,reject)=>{
  const tx=d.transaction("files","readwrite");tx.objectStore("files").put(file,id);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function getSubFile(id){
 const d=await openSubFileDB();
 return new Promise((resolve,reject)=>{
  const tx=d.transaction("files","readonly"),q=tx.objectStore("files").get(id);
  q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);
 });
}

function updateStudentsFromPaste23(){

 if(!db.users)db.users=[];

 let added=0,updated=0,skipped=0;
 lines.forEach((line,index)=>{
   let cols=line.split("\t").map(x=>x.trim());
   const name=(cols[0]||"").trim();
   const first=name.toLowerCase();
   if(index===0 && (first.includes("nombre")||first.includes("apellidos")||first.includes("estudiante"))){skipped++;return;}

   else if(db.users.some(u=>u.u===username)){
      skipped++;

 });

function attendanceAlerts26(){

 users.forEach(u=>{
   const entries=Object.keys(records).filter(k=>k.endsWith("|"+u.u)).map(k=>({key:k,date:k.split("|")[0],status:records[k]}));
   entries.forEach(x=>{
     if(x.status==="Representacion") alerts.push({u,level:"recuperacion",text:`${u.name||u.u} faltó el ${x.date} porque estuvo representando al colegio. Recuerda recuperar la actividad o evaluación de ese día.`});

   });
   const faltas=entries.filter(x=>x.status==="Falta").length;
   const tardanzas=entries.filter(x=>x.status==="Tardanza").length;
   if(faltas>=3) alerts.push({u,level:"alta",text:`${u.name||u.u} tiene ${faltas} faltas registradas.`});
   else if(faltas===2) alerts.push({u,level:"media",text:`${u.name||u.u} tiene 2 faltas registradas. Conviene hacer seguimiento.`});
   if(tardanzas>=3) alerts.push({u,level:"media",text:`${u.name||u.u} tiene ${tardanzas} tardanzas registradas.`});
 });
 return alerts;
}

function importStudentsFromExcel(){
  const box=document.getElementById("excelStudentsPaste");
  if(!box) return;

  const raw=box.value.trim();
  if(!raw){
    alert("Pega primero la lista copiada desde Excel.");
    return;
  }

  const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let added=0, skipped=0;

  lines.forEach((line,index)=>{
    let cols=line.split("\t").map(x=>x.trim());

    // También acepta ; o | si la lista no viene directamente desde Excel.
    if(cols.length<2){
      if(line.includes(";")) cols=line.split(";").map(x=>x.trim());
      else if(line.includes("|")) cols=line.split("|").map(x=>x.trim());
    }

    // Saltar encabezados habituales.
    const first=(cols[0]||"").toLowerCase();
    if(index===0 && (
      first.includes("nombre") ||
      first.includes("apellidos") ||
      first.includes("estudiante")
    )){
      skipped++;
      return;
    }

    if(cols.length<1 || !cols[0]) {
      skipped++;
      return;
    }

    const name=cols[0];
    const username=cols[1] || makeUsernameFromName(name);
    const password=cols[2] || "1234";
    const grade=cols[3] || "";
    const section=cols[4] || "";

    if(!db.users) db.users=[];

    // Evitar duplicados por usuario.
    if(db.users.some(u=>u.u===username)){
      skipped++;
      return;
    }

    db.users.push({
      u:username,
      p:password,
      role:"student",
      name:name,
      grade:grade,
      section:section
    });

    added++;
  });

  if(added===0){
    alert("No se importaron estudiantes. Revisa que las columnas estén separadas por tabulaciones.");
    return;
  }

  save();
  closeModal();
  render();

  alert(`✅ Se importaron ${added} estudiante(s).${skipped ? ` Se omitieron ${skipped}.` : ""}`);
}

function makeUsernameFromName(name){
  return name
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,".")
    .replace(/^\.+|\.+$/g,"");
}

function classLevel(n){n=Number(n);return n>=18?'AD':n>=15?'A':n>=11?'B':'C'}
function escClass(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function todayLocal30(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function classRecordById(id){ensureClassData();return db.classRecords.find(x=>String(x.id)===String(id))}
function classEvalRecord(classId,u){ensureClassData();return db.classEvaluations.find(x=>String(x.classId)===String(classId)&&x.user===u)}
function avgNums(a){const x=a.map(Number).filter(Number.isFinite);return x.length?x.reduce((s,n)=>s+n,0)/x.length:null}
function componentAvg(arr,u){
  const vals=(arr||[]).filter(x=>x.user===u&&x.grade!==null&&x.grade!==undefined&&x.grade!=="").map(x=>Number(x.grade));
  return avgNums(vals);
}
function classAvg(u){return componentAvg(db.classEvaluations,u)}
function activitiesAvg(u){const vals=(db.submissions||[]).filter(s=>String(s.user)===String(u)&&s.grade!==null&&s.grade!==undefined&&s.grade!=='').map(s=>Number(s.grade));return avgNums(vals)}
function participationAvg(u){return componentAvg(db.participations,u)}
function behaviorAvg(u){return componentAvg(db.behaviorGrades,u)}
function uniformAvg(u){return componentAvg(db.uniformGrades,u)}
function notebookAvg(u){return componentAvg(db.notebookGrades,u)}
function folderAvg(u){return componentAvg(db.folderGrades,u)}
function examAvg(u){return componentAvg(db.examGrades,u)}
const EVAL_PROJECT_KEYS=['portfolio','product','exposition'];
const EVAL_PROCESS_KEYS=['class','activities','participation','behavior','uniform','notebook','folder','exam'];
function evaluationActive(){ensureClassData();return db.evaluationActive;}
function projectAvg(u){
  const p=projectRecord(u), a=evaluationActive().project;
  const vals=[];
  EVAL_PROJECT_KEYS.forEach(k=>{if(a[k]){const v=p[k];if(v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v)))vals.push(Number(v));}});
  return avgNums(vals);
}
function processAvg(u){
  const a=evaluationActive().process, w=db.evaluationWeights||{};
  const vals={class:classAvg(u),activities:activitiesAvg(u),participation:participationAvg(u),behavior:behaviorAvg(u),uniform:uniformAvg(u),notebook:notebookAvg(u),folder:folderAvg(u),exam:examAvg(u)};
  let weighted=0,totalWeight=0;
  EVAL_PROCESS_KEYS.forEach(k=>{if(a[k] && Number.isFinite(Number(vals[k]))){const wt=Number(w[k]||0);weighted+=Number(vals[k])*wt;totalWeight+=wt;}});
  return totalWeight?weighted/totalWeight:null;
}
function finalGrade(u){
  // El promedio final aparece solo cuando TODOS los componentes ACTIVADOS tienen nota.
  const act=evaluationActive(), pRec=projectRecord(u);
  const projectActive=EVAL_PROJECT_KEYS.filter(k=>act.project[k]);
  const processActive=EVAL_PROCESS_KEYS.filter(k=>act.process[k]);
  if(!projectActive.length||!processActive.length)return null;
  const projectComplete=projectActive.every(k=>pRec[k]!==null&&pRec[k]!==undefined&&pRec[k]!==''&&Number.isFinite(Number(pRec[k])));
  const processVals={class:classAvg(u),activities:activitiesAvg(u),participation:participationAvg(u),behavior:behaviorAvg(u),uniform:uniformAvg(u),notebook:notebookAvg(u),folder:folderAvg(u),exam:examAvg(u)};
  const processComplete=processActive.every(k=>processVals[k]!==null&&processVals[k]!==undefined&&Number.isFinite(Number(processVals[k])));
  if(!projectComplete||!processComplete)return null;
  const p=projectAvg(u), pr=processAvg(u);
  return p===null||pr===null?null:p*.70+pr*.30;
}
function evaluationDetail(u){
  const p=projectAvg(u), pr=processAvg(u), f=finalGrade(u);
  return {project:p,process:pr,final:f,level:f===null?'—':classLevel(f)};
}

    const grade=raw===''?null:Math.max(0,Math.min(20,Number(raw)));
    if(!r)db.classEvaluations.push({id:'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),classId:id,user:u,status:st,grade,date:rec.date,title:rec.title,gradeClass:rec.grade,section:rec.section});
    else{r.status=st;r.grade=grade}
    n++;
  });
  save();alert(`✅ Evaluación guardada. Registros de esta clase: ${n}`);renderClass30();
}

function saveComponentGrades(key,arrName,id){
  ensureClassData();
  const rec=(db[arrName]||[]).find(x=>String(x.id)===String(id));
  if(!rec){alert('No se encontró el registro de evaluación.');return}
  const gradeEl=[...document.querySelectorAll('.cmpGrade')];
  let saved=0;
  // Cada nota queda vinculada al registro, al estudiante y al aula del registro.
  gradeEl.forEach(input=>{
    const user=input.dataset.user;
    const raw=(input.value??'').trim();
    let existing=(db[arrName]||[]).find(x=>String(x.recordId)===String(id)&&String(x.user)===String(user));
    if(raw===''){
      if(existing) db[arrName]=db[arrName].filter(x=>x!==existing);
      return;
    }
    const n=Number(raw);
    if(!Number.isFinite(n)) return;
    const grade=Math.max(0,Math.min(20,n));
    if(!existing){
      db[arrName].push({
        id:'cmpg_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        recordId:id,user,grade,
        date:rec.date,title:rec.title,
        gradeClass:rec.grade,section:rec.section
      });
    }else{
      existing.grade=grade;
      existing.date=rec.date;
      existing.title=rec.title;
      existing.gradeClass=rec.grade;
      existing.section=rec.section;
    }
    saved++;
  });
  // Por seguridad, no permitimos que un registro antiguo sin aula genere notas.
  if(!rec.grade||!rec.section){
    alert('Este registro no tiene grado y sección asignados. Crea un nuevo registro indicando el aula.');
    return;
  }
  save();
  alert(`✅ Notas guardadas correctamente. Estudiantes registrados: ${saved}.\n\nEstas notas ya forman parte del promedio de Proceso 30 %.`);
  closeModal();
  render();
}

function projectRubricScore(levels,criteriaCount){
  const vals=(levels||[]).map(Number).filter(Number.isFinite);
  if(!vals.length)return null;
  // Los criterios marcados "Aún no enseñado" no participan en el promedio.
  // Los criterios evaluados se normalizan de niveles 1–4 a escala 0–20.
  return (vals.reduce((a,b)=>a+b,0)/(vals.length*4))*20;
}
function categoryForStudent(u){
  const g=String(u?.grade||'').replace(/\s/g,'');
  return (g==='1.º'||g==='1°'||g==='1' || g==='2.º'||g==='2°'||g==='2')?'A':'B';
}
function projectRecord(u){
  ensureClassData();
  const weekly=(db.projectWeeklyGrades||[]).filter(x=>x.user===u);
  const legacy=(db.projectGrades||[]).filter(x=>x.user===u);
  const user=(db.users||[]).find(x=>x.u===u)||{};
  const cat=categoryForStudent(user);

  const pc=db.projectRubrics[cat+'_portfolio']||[];
  const pr=db.projectRubrics[cat+'_product']||[];
  const portfolioVals=weekly.map(x=>projectRubricScore(x.portfolioLevels,pc.length)).filter(x=>x!==null);
  const productVals=weekly.map(x=>projectRubricScore(x.productLevels,pr.length)).filter(x=>x!==null);

  if(!portfolioVals.length) legacy.forEach(x=>{if(x.portfolio!==''&&x.portfolio!=null)portfolioVals.push(Number(x.portfolio));});
  if(!productVals.length) legacy.forEach(x=>{if(x.product!==''&&x.product!=null)productVals.push(Number(x.product));});

  const expositionVals=(db.expositionRubric.scores||[])
    .filter(x=>x.user===u&&x.week!==undefined&&x.week!==null)
    .map(x=>Number(x.score)).filter(Number.isFinite);
  let exposition=avgNums(expositionVals);
  if(exposition===null){
    const legacyExpo=legacy.map(x=>x.exposition).filter(x=>x!==''&&x!=null).map(Number);
    exposition=avgNums(legacyExpo);
  }
  return {portfolio:avgNums(portfolioVals),product:avgNums(productVals),exposition};
}

function renderExpositionStudents30(){
  ensureClassData();const box=document.getElementById('expoTable30');if(!box)return;
  const criteria=db.expositionRubric.criteria||[],week=Number(document.getElementById('expoWeek30')?.value||1);
  const grade=document.getElementById('expoGrade30')?.value||'Todos',sec=document.getElementById('expoSection30')?.value||'Todas';
  const students=(db.users||[]).filter(u=>u.role==='student'&&(grade==='Todos'||u.grade===grade)&&(sec==='Todas'||u.section===sec));
  const groups=(db.groups||[]).filter(g=>(grade==='Todos'||g.grade===grade)&&(sec==='Todas'||g.section===sec));
  const headers=criteria.map(c=>`<th>${escClass(c.name)}<br><small>0–20</small></th>`).join('');
  let rows='';
  groups.forEach(g=>{
    const members=(g.members||[]).filter(id=>students.some(u=>u.u===id));
    members.forEach(userId=>{
      const student=students.find(u=>u.u===userId); if(!student)return;
      const cells=criteria.map(c=>{
        const s=(db.expositionRubric.scores||[]).find(x=>x.user===userId&&Number(x.week)===week&&x.criterionId===c.id);
        return `<td><input class="expoScore30" data-user="${escClass(userId)}" data-group="${escClass(g.id)}" data-criterion="${escClass(c.id)}" type="number" min="0" max="20" value="${s?.score??''}" style="width:75px"></td>`;
      }).join('');
      const vals=criteria.map(c=>(db.expositionRubric.scores||[]).find(x=>x.user===userId&&Number(x.week)===week&&x.criterionId===c.id)?.score).filter(x=>x!==undefined&&x!==null&&x!=='');
      const av=avgNums(vals);
      rows+=`<tr><td><b>${escClass(student.name)}</b><br><span class="muted">${escClass(g.name)} · ${escClass(student.grade||'')} · ${escClass(student.section||'')}</span></td>${cells}<td><b>${av===null?'—':av.toFixed(2)}</b></td></tr>`;
    });
  });
  box.innerHTML=`<table><tr><th>Estudiante / grupo</th>${headers}<th>Nota exposición</th></tr>${rows||'<tr><td colspan="'+(criteria.length+2)+'">No hay estudiantes con grupo para el filtro. Crea los grupos primero.</td></tr>'}</table><p class="muted" style="margin-top:10px">Cada estudiante recibe una calificación individual, aunque pertenezca al mismo grupo de trabajo.</p><button onclick="saveExpositionScores()">💾 Guardar exposiciones</button>`;
}
function saveExpositionScores(){
  ensureClassData();
  const week=Number(document.getElementById('expoWeek30')?.value||1),date=document.getElementById('expoDate30')?.value||todayLocal30();
  const inputs=[...document.querySelectorAll('.expoScore30')];
  let count=0;
  inputs.forEach(e=>{
    const user=e.dataset.user,groupId=e.dataset.group,criterionId=e.dataset.criterion,val=e.value;
    const g=(db.groups||[]).find(x=>x.id===groupId);if(!g||!user)return;
    let s=db.expositionRubric.scores.find(x=>x.user===user&&Number(x.week)===week&&x.criterionId===criterionId);
    if(val===''){if(s)db.expositionRubric.scores=db.expositionRubric.scores.filter(x=>x!==s);return;}
    if(!s){s={id:'ex_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),user,week,criterionId};db.expositionRubric.scores.push(s);}
    const student=(db.users||[]).find(x=>x.u===user);
    s.date=date;s.grade=student?.grade||'';s.section=student?.section||'';s.category=categoryForStudent(student);s.groupId=groupId;s.groupName=g.name;s.score=Math.max(0,Math.min(20,Number(val)));s.savedAt=Date.now();
    count++;
  });
  save();alert(`✅ Exposición de la semana ${week} guardada individualmente para ${count} registro(s).`);openProjectEvaluation();
}

function renderGroups30(){
  ensureClassData();
  const gsel=document.getElementById('gpGrade30')?.value||'', ssel=document.getElementById('gpSec30')?.value||'';
  if(!gsel||!ssel)return `<div class="card"><p class="muted">Selecciona primero un <b>grado y una sección</b> para ver los grupos de esa aula.</p></div>`;
  const filtered=db.groups.filter(g=>g.grade===gsel&&g.section===ssel);
  if(!filtered.length)return `<div class="card"><p class="muted">No hay grupos creados para ${escClass(gsel)} ${escClass(ssel)}.</p></div>`;
  return `<div class="grid3">${filtered.map((g,i)=>{
    const ms=(g.members||[]).map(x=>db.users.find(u=>u.u===x)).filter(Boolean);
    const classRecs=db.classRecords.filter(r=>r.grade===g.grade&&r.section===g.section);
    const total=ms.length*classRecs.length;
    const done=ms.reduce((z,u)=>z+classRecs.filter(r=>{const ev=classEvalRecord(r.id,u.u);return ev&&ev.status&&ev.status!=='NO HIZO'}).length,0);
    const prog=total?Math.round(done/total*100):0;
    const grades=ms.flatMap(u=>db.classEvaluations.filter(r=>r.user===u.u&&r.grade!=null&&classRecs.some(c=>c.id===r.classId)).map(r=>Number(r.grade)));
    const avg=grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(1):'—';
    return `<div class="card"><div style="display:flex;justify-content:space-between"><div><h3>${escClass(g.name||'Grupo '+(i+1))}</h3><div class="muted">${escClass(g.grade)} — ${escClass(g.section)}</div></div><button class="small secondary" onclick="renameGroup30('${escClass(g.id)}')">✏️</button></div>

    <div style="height:10px;background:#e2e8f0;border-radius:9px"><div style="height:100%;width:${prog}%;background:#2563eb;border-radius:9px"></div></div>
    <div class="list" style="margin-top:12px">${ms.map(u=>`<div class="item" style="padding:8px"><div><b>${escClass(u.name)}</b></div><select onchange="moveGroup30('${escClass(g.id)}','${escClass(u.u)}',this.value)" style="max-width:110px"><option value="">Mover…</option>${db.groups.filter(z=>z.id!==g.id&&z.grade===g.grade&&z.section===g.section).map(z=>`<option value="${escClass(z.id)}">${escClass(z.name)}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Sin estudiantes.</p>'}</div>
    <div class="actions" style="margin-top:10px"><button class="small" onclick="addGroupMember30('${escClass(g.id)}')">＋ Agregar</button><button class="small danger" onclick="deleteGroup30('${escClass(g.id)}')">Eliminar</button></div></div>`;
  }).join('')}</div>`;
}
function randomGroups30(){
  ensureClassData();
  const gradeEl=document.getElementById('gpGrade30');
  const secEl=document.getElementById('gpSec30');
  const g=gradeEl?.value;
  const s=secEl?.value;
  const n=Math.max(1,Math.min(20,Number(document.getElementById('gpCount30')?.value)||4));
  if(!g||!s){alert('Selecciona primero grado y sección.');return}

  // IMPORTANTE: cada clic vuelve a sortear SOLAMENTE el aula seleccionada.
  // No se vuelve a pedir grado/sección y no se mezcla con otros grados.
  const a=db.users.filter(u=>u.role==='student'&&u.grade===g&&u.section===s);
  if(!a.length){alert(`No hay estudiantes registrados en ${g} ${s}.`);return}

  window.__lastRaffleGrade30=g;
  window.__lastRaffleSection30=s;
  window.__raffleCount=(window.__raffleCount||0)+1;

  const ng=Math.min(n,a.length);
  const grupos=Array.from({length:ng},(_,i)=>({
    id:'grp_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7),
    name:'Grupo '+(i+1), grade:g, section:s, members:[]
  }));

  // Mezcla únicamente a los estudiantes de grado + sección seleccionados.
  const shuffled=[...a];
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }
  shuffled.forEach((u,i)=>grupos[i%grupos.length].members.push(u.u));

  // Reemplaza únicamente los grupos de ESTE grado/sección.
  db.groups=db.groups.filter(x=>!(x.grade===g&&x.section===s));
  db.groups.push(...grupos);
  save();

  // NO usamos render(): así el grado y sección quedan seleccionados.
  // Solo actualizamos la zona de resultados.
  const box=document.getElementById('groupsResults30');
  if(box) box.innerHTML=renderGroups30();

  // Dejamos explícitamente los selectores en el valor elegido.
  if(gradeEl) gradeEl.value=g;
  if(secEl) secEl.value=s;
}
function emptyGroups30(){
  ensureClassData();const g=document.getElementById('gpGrade30')?.value,s=document.getElementById('gpSec30')?.value,n=Math.max(1,Math.min(20,Number(document.getElementById('gpCount30')?.value)||4));
  if(!g||!s){alert('Selecciona primero grado y sección.');return}
  db.groups=db.groups.filter(x=>!(x.grade===g&&x.section===s));db.groups.push(...Array.from({length:n},(_,i)=>({id:'grp_'+Date.now()+'_'+i,name:'Grupo '+(i+1),grade:g,section:s,members:[]})));save();render();
}
function renameGroup30(id){const g=db.groups.find(x=>x.id===id);if(!g)return;const n=prompt('Nombre del grupo:',g.name);if(n){g.name=n.trim();save();render()}}

function moveGroup30(from,u,to){if(!to)return;const a=db.groups.find(x=>x.id===from),b=db.groups.find(x=>x.id===to);if(!a||!b||a.grade!==b.grade||a.section!==b.section){alert('Solo puedes mover estudiantes dentro del mismo grado y sección.');return}a.members=(a.members||[]).filter(x=>x!==u);if(!b.members.includes(u))b.members.push(u);save();render()}
function addGroupMember30(id){const g=db.groups.find(x=>x.id===id);if(!g)return;const used=new Set(db.groups.flatMap(x=>x.members||[])),a=db.users.filter(u=>u.role==='student'&&u.grade===g.grade&&u.section===g.section&&!used.has(u.u));if(!a.length){alert('No quedan estudiantes sin asignar en este grado y sección.');return}modalBody.innerHTML=`<h2>＋ Agregar estudiante</h2><p class="muted">Solo ${escClass(g.grade)} ${escClass(g.section)}.</p><select id="gm30">${a.map(u=>`<option value="${escClass(u.u)}">${escClass(u.name)}</option>`).join('')}</select><div class="actions"><button onclick="saveGroupMember30('${escClass(id)}')">Agregar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`;modal.classList.remove('hidden')}
function saveGroupMember30(id){const g=db.groups.find(x=>x.id===id),u=document.getElementById('gm30')?.value,stu=db.users.find(x=>x.u===u);if(!g||!stu)return;if(stu.grade!==g.grade||stu.section!==g.section){alert('El estudiante pertenece a otro grado/sección.');return}g.members=g.members||[];if(!g.members.includes(u))g.members.push(u);save();closeModal();render()}

function iaEPT(){

  const unique=[...new Set(topics)];
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>🤖 IA EPT</h2><p class="muted">Asistente básico interno del sistema. No utiliza ninguna IA externa ni API.</p></div><span class="badge">SOLO DOCENTE</span></div>
  <div class="grid3" style="margin-top:18px"><div><label>Tema</label><select id="iaTopic30"><option value="">Escribe o selecciona un tema</option>${unique.map(t=>`<option>${escClass(t)}</option>`).join('')}</select></div><div><label>Grado</label><select id="iaGrade30"><option>1.º</option><option>2.º</option><option>3.º</option><option>4.º</option><option>5.º</option></select></div><div><label>Cantidad de preguntas</label><input id="iaCount30" type="number" min="3" max="20" value="5"></div></div>
  <label style="margin-top:12px">O escribe tu tema</label><input id="iaCustom30" placeholder="Ej.: Lean Canvas, Design Thinking, Excel...">
  <div class="actions" style="margin-top:14px"><button onclick="iaExplain30()">📚 Explicar tema</button><button onclick="iaQuestions30()">❓ Generar preguntas</button><button onclick="iaActivity30()">📝 Crear actividad</button><button onclick="iaGame30()">🎮 Crear juego</button><button onclick="iaQuiz30()">🧠 Crear quiz</button></div></div>
  <div id="iaOutput30" class="card" style="margin-top:18px"><p class="muted">Selecciona una opción para generar contenido.</p></div>`;
}
function iaTopic30(){return (document.getElementById('iaCustom30')?.value.trim()||document.getElementById('iaTopic30')?.value||'Educación para el Trabajo').trim()}
function iaCount30(){return Math.max(3,Math.min(20,Number(document.getElementById('iaCount30')?.value)||5))}
function iaBase30(t){const x=t.toLowerCase();if(x.includes('design thinking')||x.includes('diseño pensativo'))return {name:t,concept:'proceso centrado en las personas para comprender necesidades, definir problemas, generar ideas, crear prototipos y probar soluciones.',keys:['empatizar','definir','idear','prototipar','evaluar']};if(x.includes('lean canvas'))return {name:t,concept:'herramienta visual para organizar y validar un modelo de negocio, identificando problema, solución, clientes, propuesta de valor y otros elementos clave.',keys:['problema','solución','clientes','propuesta de valor','canales']};if(x.includes('scamper'))return {name:t,concept:'técnica para generar ideas mediante acciones como sustituir, combinar, adaptar, modificar, poner en otros usos, eliminar y reorganizar.',keys:['sustituir','combinar','adaptar','modificar','eliminar']};if(x.includes('excel'))return {name:t,concept:'herramienta de hoja de cálculo que permite organizar datos, utilizar fórmulas, analizar información y presentar resultados.',keys:['celda','fórmula','función','tabla','gráfico']};return {name:t,concept:'tema de aprendizaje que puede analizarse identificando su concepto, características, utilidad, ejemplos y aplicación práctica en un proyecto de EPT.',keys:['concepto','características','utilidad','ejemplo','aplicación']}}
function iaQuestions30(){const t=iaTopic30(),b=iaBase30(t),n=iaCount30(),qs=[];const forms=[`¿Qué es ${b.name}?`,`¿Cuál es la principal utilidad de ${b.name}?`,`Menciona una característica importante de ${b.name}.`,`¿Cómo aplicarías ${b.name} en un proyecto de emprendimiento?`,`Da un ejemplo relacionado con ${b.name}.`,`¿Qué problema podría ayudar a resolver ${b.name}?`,`¿Qué pasos o elementos de ${b.name} recuerdas?`];for(let i=0;i<n;i++)qs.push(`${i+1}. ${forms[i%forms.length]}`);document.getElementById('iaOutput30').innerHTML=`<h2>❓ Preguntas — ${escClass(t)}</h2><ol>${qs.map(q=>`<li style="margin:10px 0">${escClass(q.slice(q.indexOf('. ')+2))}</li>`).join('')}</ol><p class="muted"><b>Clave sugerida:</b> ${escClass(b.keys.join(' · '))}</p>`}
function iaExplain30(){const t=iaTopic30(),b=iaBase30(t);document.getElementById('iaOutput30').innerHTML=`<h2>📚 Explicación — ${escClass(t)}</h2><p><b>¿Qué es?</b> ${escClass(b.concept)}</p><p><b>Ideas clave:</b> ${escClass(b.keys.join(' · '))}</p><p><b>Aplicación en EPT:</b> analiza una necesidad de tu comunidad, relaciona el tema con el problema identificado y propón una solución que pueda convertirse en un producto o servicio.</p>`}
